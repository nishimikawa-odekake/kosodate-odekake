<style>
:root{
  --bg:#faf6ef; --card:#fffdf9; --ink:#3d3a34; --sub:#7a746a; --line:#e7ddcd;
  --accent:#e08a5b; --accent-d:#c9713f;
  --animal:#E9A23B; --active:#4CAF6E; --water:#3FA9D6; --create:#9B6DD6; --vehicle:#E06C75; --indoor:#7A8AA0; --food:#D95D77;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0;width:100%;height:100dvh;z-index:1}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(to bottom,rgba(250,246,239,.96),rgba(250,246,239,.75));backdrop-filter:blur(4px)}
.topbar a.back{font-size:.8rem;font-weight:700;color:var(--accent-d);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.topbar .logo{font-size:.82rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* origin bar */
.originbar{position:fixed;top:calc(40px + env(safe-area-inset-top));left:0;right:0;z-index:490;display:flex;align-items:center;gap:6px;padding:6px 10px;overflow-x:auto}
.originbar select{font-size:.78rem;padding:6px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:38vw}
.originbar button{font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--accent-d);white-space:nowrap}
.originbar button:active{transform:scale(.95)}

/* pins (same design as index.html) */
.pin{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 5px rgba(0,0,0,.3);border:2px solid #fff}
.pin span{transform:rotate(45deg);font-size:16px}
.home-wrap{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.home-pulse{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.55;animation:home-pulse 2.2s ease-out infinite}
.home-pin{position:relative;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--accent-d);box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:24px}
.home-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;background:var(--accent-d);color:#fff;font-size:.72rem;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
@keyframes home-pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.home-pulse{animation:none;display:none}}

#recenterBtn{position:fixed;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:1100;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:19px;line-height:1;color:var(--accent-d);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#recenterBtn:active{transform:scale(.94)}
.geo-dot{width:16px;height:16px;position:relative}
.geo-dot-ring{position:absolute;inset:-7px;border-radius:50%;background:rgba(66,133,244,.25)}
.geo-dot-core{position:absolute;inset:0;border-radius:50%;background:#4285F4;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4)}
.geo-toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(30,28,24,.92);color:#fff;font-size:.8rem;font-weight:600;padding:9px 16px;border-radius:999px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86vw;text-align:center}

.countbadge{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top));z-index:480;background:rgba(61,58,52,.85);color:#fff;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px;pointer-events:none}

.chipbar::-webkit-scrollbar{display:none}

.chip.play[data-t="water"].on{background:var(--water)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:601;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.3,1);max-height:70dvh;overflow-y:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:translateY(0)}

.sheet h3{margin:0 0 4px;font-size:1.05rem;padding-right:28px}
.sheet .city{margin:0 0 8px;font-size:.82rem;color:var(--sub)}
.sheet .appeal{font-size:.86rem;margin:0 0 10px;line-height:1.5}
.sheet .badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.sheet .badge{font-size:.7rem;font-weight:700;color:#fff;border-radius:999px;padding:3px 9px}
.sheet .badge.play{filter:brightness(.95)}
.sheet .badge.drive{background:var(--accent-d)}
.sheet .badge.free{background:#4CAF6E}
.sheet .badge.rain{background:#3FA9D6}
.sheet .actions{display:flex;gap:8px;margin-top:8px}
.sheet .btn{flex:1;text-align:center;font-size:.86rem;font-weight:700;padding:11px 8px;border-radius:12px;text-decoration:none;border:1px solid var(--line)}
.sheet .btn.primary{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.sheet .btn.map{background:#fff;color:var(--accent-d)}

.leaflet-popup{display:none!important}
</style>

function haversineKm(la1,lo1,la2,lo2){
  const R=6371,d2r=Math.PI/180;
  const dLa=(la2-la1)*d2r,dLo=(lo2-lo1)*d2r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const REG=(function(){
  const xs=[],ys=[];
  SPOTS.forEach(s=>{
    if(s.latitude!=null&&s.longitude!=null&&s.estimated_drive_minutes_from_anjo!=null){
      xs.push(haversineKm(ANJO[0],ANJO[1],s.latitude,s.longitude));
      ys.push(s.estimated_drive_minutes_from_anjo);
    }
  });
  const n=xs.length;
  if(n<2) return {a:0,b:1.5,n};
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}
  const b=den?num/den:0, a=my-b*mx;
  return {a,b,n};
})();

const origin={name:'山口市',lat:ANJO[0],lng:ANJO[1],isAnjo:true};
function driveMinutes(s){
  if(origin.isAnjo && s.estimated_drive_minutes_from_anjo!=null) return s.estimated_drive_minutes_from_anjo;
  if(s.latitude==null||s.longitude==null) return null;
  const km=haversineKm(origin.lat,origin.lng,s.latitude,s.longitude);
  let m=Math.round((REG.a+REG.b*km)/5)*5;
  if(m<5)m=5;
  return m;
}

function matches(s){
  // チェーン飲食店は初期非表示。🍽ごはん配下の「子連れチェーン店」チップON時のみ表示する。
  if(s.is_chain===true && state.chain!==true) return false;
  if(state.play.size){
    const pts=s.play_types||[];
    if(![...state.play].some(t=>pts.includes(t))) return false;
  }
  if(state.rain){ if(!(s.rain_friendly===true||s.indoor_or_outdoor==='indoor')) return false; }
  if(state.free){ if(s.is_free!==true) return false; }
  if(state.kids){ if(s.has_kids_space!==true) return false; }
  if(state.jidokan){ if(s.is_jidokan!==true) return false; }
  else { if(s.is_jidokan===true) return false; }
  if(state.zashiki){ if(s.has_zashiki!==true) return false; }
  if(state.kids_chair){ if(s.has_kids_chair!==true) return false; }
  // 条件チップ単独時（ごはんチップ未選択）は、foodのみのスポット（飲食店）を除外
  const pts0=s.play_types||[];
  if(pts0.length&&pts0.every(t=>t==='food')&&!state.play.has('food')&&(state.rain||state.free||state.kids)) return false;
  return true;
}

function apply(){
  let n=0;
  SPOTS.forEach((s,i)=>{
    const ok=matches(s);
    if(ok)n++;
    const m=markers[i];
    if(m && map){ if(ok){ if(!map.hasLayer(m))m.addTo(map);} else { if(map.hasLayer(m))map.removeLayer(m);} }
  });
  document.getElementById('countBadge').textContent='該当'+n+'件';
}

});

  var kfHasKidsChair=Array.isArray(s.kid_features)&&s.kid_features.some(function(f){return /キッズチェア|子ども椅子|子供椅子|ハイチェア|ベビーチェア|まめイス/.test(f);});
  if(s.has_kids_chair===true&&!kfHasKidsChair) badges+='<span class="badge free">🪑 子ども椅子</span>';
  if(s.is_jidokan===true) badges+='<span class="badge free">🏠 児童館</span>';
  if(s.is_chain===true&&s.chain_name) badges+='<span class="badge free">🍴 チェーン店</span>';
  let actions='';
  if(s.official_url) actions+='<a class="btn primary" href="'+esc(s.official_url)+'" target="_blank" rel="noopener">公式サイト →</a>';

let userLatLng=null, userDotMarker=null, autoPannedOnce=false;
function showToast(msg){
  let t=document.getElementById('geoToast');

  t.textContent=msg; t.classList.add('show');

}
function blueDotIcon(){

function placeUserDot(lat,lng){
  userLatLng=[lat,lng];
  if(!map) return;
  try{
    if(userDotMarker){ userDotMarker.setLatLng(userLatLng); }
    else{ userDotMarker=L.marker(userLatLng,{icon:blueDotIcon(),zIndexOffset:3000,interactive:false,keyboard:false}).addTo(map); }
  }catch(e){ console.warn('user dot update failed',e); }
}
function requestGeolocation(onOk,onFail){
  if(!navigator.geolocation){ showToast('位置情報が許可されていません'); if(onFail)onFail(); return; }
  let done=false;
  const watchdog=setTimeout(()=>{ if(done)return; done=true; showToast('位置情報が許可されていません'); if(onFail)onFail(); },9000);
  navigator.geolocation.getCurrentPosition(
    pos=>{ if(done)return; done=true; clearTimeout(watchdog); onOk(pos.coords.latitude,pos.coords.longitude); },
    ()=>{ if(done)return; done=true; clearTimeout(watchdog); showToast('位置情報が許可されていません'); if(onFail)onFail(); },
    {timeout:8000,maximumAge:60000}
  );
}

    placeUserDot(lat,lng);
    if(!autoPannedOnce && map){ map.setView([lat,lng],13,{animate:true}); autoPannedOnce=true; }
  }, backToAnjo);
});
const recenterBtn=document.getElementById('recenterBtn');
if(recenterBtn){
  recenterBtn.addEventListener('click',()=>{
    if(userLatLng){
      if(map) map.setView(userLatLng,13,{animate:true});
      setOrigin('現在地',userLatLng[0],userLatLng[1]);
      placeUserDot(userLatLng[0],userLatLng[1]);
      return;
    }
    requestGeolocation((lat,lng)=>{
      setOrigin('現在地',lat,lng);
      placeUserDot(lat,lng);
      if(map) map.setView([lat,lng],13,{animate:true});
      autoPannedOnce=true;
    });
  });
}

// --- URL param handoff ---
(function(){
  const qs=new URLSearchParams(location.search);
  const filter=qs.get('filter');
  const from=qs.get('from');
  if(filter){
    if(filter==='rain'||filter==='free'||filter==='kids'||filter==='jidokan'){
      state[filter]=true;
      const c=document.querySelector('.chip[data-f="'+filter+'"]');
      if(c){c.classList.add('on');}
    }else if(PLAY[filter]){
      state.play.add(filter);
      const c=document.querySelector('.chip.play[data-t="'+filter+'"]');
      if(c){c.classList.add('on');}
    }
    updateFoodSubChipsM();
  }
  if(from==='現在地'){
    // index.htmlで現在地を選んだまま全画面にした場合: 座標を引き継ぎ現在地設定を維持する
    const flat=parseFloat(qs.get('flat')), flng=parseFloat(qs.get('flng'));
    if(isFinite(flat)&&isFinite(flng)){
      setOrigin('現在地',flat,flng);
      placeUserDot(flat,flng);
    }
  }else if(from){
    const match=CITIES.find(c=>c[0]===from);
    if(match){
      originSel.value=match[1]+','+match[2];
      setOrigin(match[0],match[1],match[2]);
    }
  }
  updateOriginMarker();
  apply();
})();
</script>
