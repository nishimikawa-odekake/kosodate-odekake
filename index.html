.btn:active{transform:scale(.97)}

.expand-note{text-align:center;font-size:.78rem;color:var(--sub);margin:16px 0 0}

footer{margin-top:48px;padding:22px 0 34px;border-top:1px solid var(--line);text-align:center}
.site-footer-links{font-size:.8rem;color:var(--sub);margin:0 0 10px}
