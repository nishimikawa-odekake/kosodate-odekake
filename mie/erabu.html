/* ===== [short-share] 共有URLを短くする =====
 * 施設名・出発地名の代わりに「名前から決まる短いID」を使う(FNV-1a 32bit を 36^6 で割った余りの base36、最大6文字)。
 * SPOTS の並び順には依存しない。受け側は shareExpandQs() で従来の長い形式(share=1&from=…&main=…)に戻してから
 * これまでどおり restoreFromShare() に渡すので、旧形式URL・名前が見つからないときの挙動は従来どおり。
 * 短いキー: s=share f=from y=lat x=lng(10万倍の整数をbase36) d=drive w=when t=depart a=age(0/3/e を連結) b=budget
 *           m=main l=lunch u=sub c=cs(ct=一時スポット) i=csli
 * ID が別の名前と重なる／解決できない項目は、その項目だけ従来の長い形式のまま残す(復元はできる)。 */
function shareNameId(s){
  let h=0x811c9dc5; s=String(s);
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return ((h>>>0)%2176782336).toString(36);
}
function shareIdMaps(){
  const sp=new Map(), ci=new Map();
  const add=(m,n)=>{ const k=shareNameId(n); if(!m.has(k)) m.set(k,n); else if(m.get(k)!==n) m.set(k,null); };
  SPOTS.forEach(s=>{ if(s&&s.name) add(sp,s.name); });
  CITIES.forEach(c=>{ if(c&&c[0]) add(ci,c[0]); });
  return {sp,ci};
}
const SHARE_W={today:'n',tomorrow:'t',sat:'s',sun:'u'}, SHARE_T={'slot:am':'a','slot:noon':'n'}, SHARE_A={'0-2':'0','3-5':'3','elem':'e'};
function shortShareUrl(longUrl){
  try{
    const u=new URL(longUrl), q=u.searchParams;
    if(q.get('share')!=='1') return longUrl;
    const M=shareIdMaps(), enc=encodeURIComponent, out=['s=1'];
    const sid=(m,n)=>{ const k=shareNameId(n); return m.get(k)===n?k:null; };
    const SK={main:'m',lunch:'l',sub:'u'};
    for(const [k,v] of q){
      let s=null;
      if(k==='share') continue;
      if(k==='from'){ const id=(v==='現在地')?'_h':sid(M.ci,v); if(id) s='f='+id; }
      else if((k==='lat'||k==='lng')&&/^-?\d{1,3}\.\d{5}$/.test(v)) s=(k==='lat'?'y=':'x=')+Math.round(parseFloat(v)*1e5).toString(36);
      else if(k==='drive') s='d='+enc(v);
      else if(k==='when'&&SHARE_W[v]) s='w='+SHARE_W[v];
      else if(k==='depart'){ if(SHARE_T[v]) s='t='+SHARE_T[v]; else if(/^offset:\d+$/.test(v)) s='t=o'+v.slice(7); }
      else if(k==='age'&&v.split(',').every(x=>SHARE_A[x])) s='a='+v.split(',').map(x=>SHARE_A[x]).join('');
      else if(k==='budget') s='b='+enc(v);
      else if(SK[k]){ const id=sid(M.sp,v); if(id) s=SK[k]+'='+id; }
      else if(k==='cs'){
        try{
          const arr=JSON.parse(v), t=[], tp=[];
          if(Array.isArray(arr)) for(const it of arr){
            if(!it){ t.push('-'); continue; }
            const ks=Object.keys(it);
            if(it.bento===1&&!it.temp&&ks.length===2&&'n' in it){ t.push('_b'); continue; }
            if(it.temp===1&&ks.join()==='n,lat,lng,addr,temp'){ t.push('_t'); tp.push([it.n,it.lat,it.lng,it.addr]); continue; }
            const id=(ks.length===1&&typeof it.n==='string')?sid(M.sp,it.n):null;
            if(!id){ t.length=0; break; }
            t.push(id);
          }
          if(t.length&&t.length===arr.length) s='c='+t.join('.')+(tp.length?'&ct='+enc(JSON.stringify(tp)):'');
        }catch(e){}
      }
      else if(k==='csli'&&/^\d+$/.test(v)) s='i='+v;
      out.push(s!=null?s:(enc(k)+'='+enc(v)));
    }
    return u.origin+u.pathname+'?'+out.join('&');
  }catch(e){ return longUrl; }
}
function shareExpandQs(qs){
  try{
    if(qs.get('s')!=='1'||qs.has('share')) return qs;
    const M=shareIdMaps(), o=new URLSearchParams();
    const inv=m=>{ const r={}; Object.keys(m).forEach(k=>{ r[m[k]]=k; }); return r; };
    const W=inv(SHARE_W), T=inv(SHARE_T), A=inv(SHARE_A);
    const L={s:'share',d:'drive',b:'budget',i:'csli'}, SK={m:'main',l:'lunch',u:'sub'};
    let tp=[]; try{ tp=JSON.parse(qs.get('ct')||'[]'); }catch(e){}
    for(const [k,v] of qs){
      if(k==='ct') continue;
      if(L[k]) o.append(L[k],v);
      else if(k==='f'){ const n=(v==='_h')?'現在地':M.ci.get(v); if(n) o.append('from',n); }
      else if(k==='w') o.append('when',W[v]||v);
      else if(k==='y'||k==='x') o.append(k==='y'?'lat':'lng',(parseInt(v,36)/1e5).toFixed(5));
      else if(k==='t') o.append('depart',T[v]||(/^o\d+$/.test(v)?('offset:'+v.slice(1)):v));
      else if(k==='a') o.append('age',v.split('').map(x=>A[x]||x).join(','));
      else if(SK[k]){ const n=M.sp.get(v); if(n) o.append(SK[k],n); }
      else if(k==='c'){
        const arr=v.split('.').map(x=>{
          if(x==='-') return null;
          if(x==='_b'){ let n=''; try{ n=bentoSpot().name; }catch(e){} return {n,bento:1}; }
          if(x==='_t'){ const a=tp.shift(); return Array.isArray(a)?{n:a[0],lat:a[1],lng:a[2],addr:a[3],temp:1}:null; }
          const n=M.sp.get(x); return n?{n}:null;
        });
        o.append('cs',JSON.stringify(arr));
      }
      else o.append(k,v);
    }
    return o;
  }catch(e){ return qs; }
}
function buildShareUrl(p){

  parts.push('from='+encodeURIComponent(originName));

    parts.push('lat='+state.origin.lat.toFixed(5));
    parts.push('lng='+state.origin.lng.toFixed(5));
  }
  parts.push('drive='+encodeURIComponent(state.driveTime||'any'));
  parts.push('when='+encodeURIComponent(state.when||'today'));
  if(state.depart){
    const d=state.depart;
    parts.push('depart='+encodeURIComponent(d.mode==='offset'?('offset:'+d.min):('slot:'+d.slot)));
  }
  parts.push('age='+encodeURIComponent([...state.ages].join(',')));
  parts.push('budget='+encodeURIComponent(state.budget||'any'));
  const spots=p.rows.filter(r=>r.type==='spot');
  const mainRow=spots.find(r=>r.tag==='メイン');
  if(mainRow) parts.push('main='+encodeURIComponent(mainRow.spot.name));
  const MEAL_TAGS=['ランチ','カフェ・休憩','夕食','食事'];
  const lunchRow=spots.find(r=>r!==mainRow&&(r.food===true||MEAL_TAGS.includes(r.tag)));
  const subRow=spots.find(r=>r!==mainRow&&r!==lunchRow&&(r.tag==='午後スポット'||r.tag==='余力があれば'));
  if(lunchRow) parts.push('lunch='+encodeURIComponent(lunchRow.spot.name));
  if(subRow) parts.push('sub='+encodeURIComponent(subRow.spot.name));
  try{ eng3SharePush(p,parts); }catch(e){}   // [engine-fix3 2026-09-25] お昼なし nl=1・無料 fo=1・滞在 sm/ss（通常のプランでは何も足さない）
  // 【実装2】カスタムのときだけ枠順(cs)とお昼枠位置(csli)を追加する。
  // 通常プランではこのブロックを通らないのでURLは従来と完全に同一。失敗時は従来URLにフォールバック。
  try{
    if(shareIsCustomPlan(p)){
      const items=shareSlotItems();
      if(items.length){
        const li=(state.customSlots&&state.customSlots.length===items.length)?cpLI():cpLIFor(items.length);
        parts.push('cs='+encodeURIComponent(JSON.stringify(items)));
        parts.push('csli='+li);
      }
    }
  }catch(e){ /* cs付与に失敗しても従来の main/lunch/sub だけで共有できる */ }
  return location.origin+location.pathname+'?'+parts.join('&');
}

function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve,reject)=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      ok?resolve():reject(new Error('copy failed'));
    }catch(e){ reject(e); }
  });
}

// rebuild wizard state + a concrete plan from share URL params; returns the plan object or null
function restoreFromShare(qs){
  const mainName=qs.get('main');
  let mainSpot=mainName?SPOTS.find(s=>s.name===mainName):null;
  // 【実装2】cs= があれば枠順を復元する(cs が無いときの挙動は従来どおり)
  let csSlots=null, csLi=null;
  const __csRaw=qs.get('cs');
  if(__csRaw){
    try{
      let arr=null;
      try{ arr=JSON.parse(__csRaw); }catch(e){ arr=JSON.parse(decodeURIComponent(__csRaw)); }
      if(Array.isArray(arr)&&arr.length){
        // 解決できない要素は null にして順番は保持する
        csSlots=arr.map(it=>{ try{ return cpResolveItem(it)||null; }catch(e){ return null; } });
        while(csSlots.length<3) csSlots.push(null);
        csSlots=csSlots.slice(0,5);
        if(!csSlots.some(Boolean)) csSlots=null;
        const __li=parseInt(qs.get('csli'),10);
        if(!isNaN(__li)) csLi=__li;
      }
    }catch(e){ csSlots=null; csLi=null; }
  }
  // main が解決できなくても cs があれば最初の枠で代替する(cs が無いときの既存挙動は変えない)
  if(!mainSpot&&csSlots) mainSpot=csSlots.find(Boolean)||null;
  if(!mainSpot) return null;
  const from=qs.get('from')||'四日市市';
  let lat=qs.has('lat')?parseFloat(qs.get('lat')):NaN;
  let lng=qs.has('lng')?parseFloat(qs.get('lng')):NaN;
  let originName=from;
  if(isNaN(lat)||isNaN(lng)){
    if(from==='四日市市'){ lat=ANJO[0]; lng=ANJO[1]; }
    else {
      const c=CITIES.find(c=>c[0]===from);
      if(c){ lat=c[1]; lng=c[2]; } else { lat=ANJO[0]; lng=ANJO[1]; originName='四日市市'; }
    }
  }
  state.origin={name:originName,lat,lng,isAnjo:originName==='四日市市'};
  const drive=qs.get('drive');
  state.driveTime=['20','40','60'].includes(drive)?drive:'any';
  const when=qs.get('when');
  state.when=['today','tomorrow','sat','sun'].includes(when)?when:'today';
  const departRaw=qs.get('depart')||'';
  if(departRaw.indexOf('offset:')===0){
    state.depart={mode:'offset',min:parseInt(departRaw.slice(7),10)||60};
  } else if(departRaw.indexOf('slot:')===0){
    state.depart={mode:'slot',slot:departRaw.slice(5)==='noon'?'noon':'am'};
  } else {
    state.depart=state.when==='today'?{mode:'offset',min:60}:{mode:'slot',slot:'am'};
  }
  const ageRaw=(qs.get('age')||'').split(',').filter(a=>['0-2','3-5','elem'].includes(a));
  state.ages=new Set(ageRaw.length?ageRaw:['3-5']);
  const budget=qs.get('budget');
  state.budget=['free','1000','3000','any'].includes(budget)?budget:'any';
  const lunchName=qs.get('lunch');
  const subName=qs.get('sub');
  const lunchSpot=lunchName?(SPOTS.find(s=>s.name===lunchName)||null):null;
  const subSpot=subName?(SPOTS.find(s=>s.name===subName)||null):null;
  if(csSlots){
    state.customSlots=csSlots;                       // 長さは3〜5にクランプ済み
    if(csLi!=null) state.cpLunchPos=csLi;
    try{ if(typeof cpNormalizeLunch==='function') cpNormalizeLunch(); }catch(e){}
    return {mainSpot,lunchSpot,subSpot,customSlots:state.customSlots.slice()};
  }
  return Object.assign({mainSpot,lunchSpot,subSpot},eng3ShareOpts(qs));   // [engine-fix3 2026-09-25] nl/fo/sm/ss（無ければ従来と同じ）
}

function cpPrevSpot(slot){

  }
  return null;
}
// 候補カードの所要時間ラベル(通常版swapCardHtmlと同じ文言/基準)
function cpSugTimeLabel(slot,sp){

  if(prev&&sp&&sp.latitude!=null&&sp.longitude!=null){
    const dm=legMinutes(prev.latitude,prev.longitude,sp.latitude,sp.longitude);
    if(dm!=null) return '🚗'+swapShortName(prev.name)+'から約'+dm+'分';
  }
  const dm0=state.origin?driveMinutesFrom(state.origin,sp):null;
  return dm0!=null?('🚗約'+dm0+'分'):'';
}
function cpSuggest(slot){
  // その枠に合う候補3件をその場で出す(枠の時間帯・移動条件・営業時間で絞る)
  const date=targetDate(state.when||'today');
  const start=startMinutes();
  const __li=cpLI();
  const __role=slot===__li?'lunch':(slot<__li?'am':'pm');
  const arrGuess=__role==='am'?start+30:(__role==='lunch'?start+150:start+270);
  const o=state.origin;
  const filled=state.customSlots.filter(Boolean);
  // 基準点は「直前に選択済みのスポット」。1枠目(直前が無い場合)は出発地。
  // cpSugTimeLabel() の表示基準(cpPrevSpot)と一致させることで、カードの「◯◯から約N分」が昇順になる。
  const ref=(typeof cpPrevSpot==='function'?cpPrevSpot(slot):null)||null;
  const refLat=(ref&&ref.latitude!=null)?ref.latitude:o.lat;
  const refLng=(ref&&ref.longitude!=null)?ref.longitude:o.lng;
  const capMin=capFor(state.driveTime||'any');
  let pool=SPOTS.filter(s=>{
    if(s.latitude==null) return false;
    if(isClosedNotice(s)) return false; // 閉店・休業告知のある店は全開放でも候補にしない
    if(typeof isJidokan==='function'&&isJidokan(s)) return false;
    if(__role==='lunch'){ if(!isLunchable(s)) return false; } else { if((s.play_types||[]).includes('food')&&isLunchable(s)) return false; }
    if(filled.some(x=>x===s||x.name===s.name)) return false;
    if(!budgetPass(s)) return false;
    const dmO=driveMinutesFrom(o,s); if(dmO==null||dmO>capMin) return false;
    if(haversineKm(refLat,refLng,s.latitude,s.longitude)>(__role==='lunch'?10:14)) return false;
    if(isClosedOn(s,date)) return false;
    if(closingInfo(s,arrGuess).exclude) return false;
    return true;
  });
  pool.forEach(s=>{ s.__cpD=haversineKm(refLat,refLng,s.latitude,s.longitude); });
  pool.sort((a,b)=>a.__cpD-b.__cpD);
  const top=pool.slice(0,10);
  // 既出候補(cpSugSeen)は除外。出し尽くしたら履歴をリセットして最初に戻る(ループ通知)
  state.cpSugSeen=state.cpSugSeen||{};
  state.cpSugCycled=state.cpSugCycled||{};
  const seen=state.cpSugSeen[slot]||[];
  let base=top.filter(s=>!seen.includes(s.name));
  if(!base.length&&top.length){
    state.cpSugSeen[slot]=[];
    state.cpSugCycled[slot]=true;
    base=top.slice();
  } else {
    state.cpSugCycled[slot]=false;
  }
  // 距離昇順のまま「まだ出していない近い順の3件」を出す。
  // (旧: 上位10件をシャッフルして3件。並び順が崩れる原因だったので廃止。
  //  「もっと見る」の入れ替えは cpSugSeen による繰り上げで従来どおり機能する)
  let out2=base.slice(0,3);
  if(out2.length<3){
    // 足りなければ既出の再利用を許可(見た目上いつも3件そろえる)
    top.forEach(s=>{ if(out2.length<3&&!out2.includes(s)) out2.push(s); });
  }
  // 補充で順序が乱れる可能性があるため最後に距離昇順で確定させる
  out2.sort((a,b)=>(a.__cpD-b.__cpD));
  state.cpSugSeen[slot]=(state.cpSugSeen[slot]||[]).concat(out2.map(s=>s.name).filter(n=>!(state.cpSugSeen[slot]||[]).includes(n)));
  return out2;
}

function cpSugNorm(s){

  return s.replace(/[\u30a1-\u30f6]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
}
function cpNameMatches(q){

    if(!sp||!sp.name) continue;
    if(state.customSlots.some(x=>x&&x.name===sp.name)) continue;
    if(cpSugNorm(sp.name).indexOf(n)>=0) out.push(sp);
  }
  return out;
}

async function cpAddPlace(){
  const nameEl=document.getElementById('cpName'), addrEl=document.getElementById('cpAddr');
  const msg=document.getElementById('cpAddMsg');
  const name=(nameEl&&nameEl.value||'').trim(), addr=(addrEl&&addrEl.value||'').trim();

  if(!addr){ msg.textContent='住所を入れてください（市町村名＋町名だけでもOK）'; return; }
  let tgt=(state.cpTarget!=null&&!state.customSlots[state.cpTarget])?state.cpTarget:(function(){
    const li=cpLI();
    const order=state.customSlots.map((_,k2)=>k2).sort((a,b)=>(a===li)-(b===li));
    return order.find(k2=>!state.customSlots[k2]);
  })();
  if(tgt===undefined){ msg.textContent='枠がいっぱいです。どれかの行を✕で外すか、「＋ スポットの枠を追加」で枠を増やしてください'; return; }
  msg.textContent='検索中…';
  try{
    const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(addr));
    const js=await r.json();
    if(!Array.isArray(js)||!js.length||!js[0].geometry){ msg.textContent='住所が見つかりませんでした。「岡崎市康生通西2丁目」のように市町村名から入れてみてください'; return; }
    const lng=js[0].geometry.coordinates[0], lat=js[0].geometry.coordinates[1];
    const title=(js[0].properties&&js[0].properties.title)||addr;
    const sp=tempSpot(name,lat,lng,title);
    if(typeof gtag==='function') gtag('event','plan_custom_addplace');
    state.customSlots[tgt]=sp;
    saveMyPlace(sp);
    state.cpTarget=null;
    cpSaveSlots();
    renderCustomPanel();
  }catch(e){ msg.textContent='検索に失敗しました。通信環境をご確認のうえ、もう一度お試しください'; }
}
// 番人: ユーザーが選んだスポットが完成プランから漏れていないか検査(漏れたら理由つきで表示)
/* ===== [S-1] マップで選んだ場所の「その日は休館日」検査 =========================
 * customGenerate / customGenerate5 はユーザーが選んだスポットをそのまま使うため、
 * 自動提案側のプールフィルタ(isClosedOn)を通らず、休館日でも警告が出なかった。
 * 選んだものは勝手に外さず、judgeClosed(v3.1) が closed のものだけ名前を返す。
 * unknown はここには入れず、既存の「🕐 営業時間は要確認」に任せる(新文言を増やさない)。
 * ======================================================================== */
function cpClosedWarnNames(date){
  try{
    const d=(date instanceof Date)?date:targetDate(state.when||'today');
    if(typeof setPlanDate==='function') setPlanDate(d);
    const seen={}, out=[];
    (state.customSlots||[]).forEach(function(sp){
      if(!sp||sp.__temp||sp.__bento||!sp.name||seen[sp.name]) return;
      seen[sp.name]=1;
      try{ if(judgeClosed(sp,d).state==='closed') out.push(sp.name); }catch(e){}
    });
    return out;
  }catch(e){ return []; }
}
/* ===== [裁定146] マップで選んだ場所の「到着時刻が営業時間外」検査 ====================
 * 選んだものは勝手に外さず、到着時刻が営業時間の外になる場合だけ名前・到着時刻・
 * 営業時間を返す。営業時間が解析できない行は対象にしない(既存の「🕐 営業時間は要確認」に任せる)。
 * ================================================================================ */
function cpHoursWarnList(plan,date){
  try{
    const d=(date instanceof Date)?date:targetDate(state.when||'today');
    if(typeof setPlanDate==='function') setPlanDate(d);
    const sel=(state.customSlots||[]).filter(Boolean).filter(function(s){ return !s.__bento&&!s.__temp&&s.name; }).map(function(s){ return s.name; });
    if(!sel.length) return [];
    const seen={}, out=[];
    ((plan&&plan.rows)||[]).forEach(function(r){
      if(!r||r.type!=='spot'||!r.spot||r.spot.__temp||r.spot.__bento) return;
      const s=r.spot;
      if(sel.indexOf(s.name)<0||seen[s.name]||r.time==null) return;
      let bh=null; try{ bh=parseBusinessHours(s,d); }catch(e){ bh=null; }
      const t=((r.time%1440)+1440)%1440;
      if(bh){
        if(t>=bh.openMin&&t<bh.closeMin) return;
        seen[s.name]=1;
        out.push({name:s.name,at:fmtTime(t),hours:fmtTime(bh.openMin)+'〜'+fmtTime(bh.closeMin)});
        return;
      }
      /* [裁定149] その日の営業時間が解析できない場合は「開いているか確認」を1本だけ出す。
         解析できる場合(上)を優先し、両方は出さない。終日開放の公園・24時間営業は対象外。 */
      if(!bhUnresolved(s,d)) return;
      seen[s.name]=1;
      out.push({name:s.name,at:fmtTime(t),hours:null});
    });
    return out;
  }catch(e){ return []; }
}

    const sel=(state.customSlots||[]).filter(Boolean).filter(s=>!s.__bento).map(s=>s.name);
    if(!sel.length) return [];
    const inPlan=new Set((plan.rows||[]).filter(r=>r.type==='spot'&&r.spot).map(r=>r.spot.name));
    return sel.filter(n=>!inPlan.has(n));
  }catch(e){ return []; }
}

// 4〜5枠のカスタムプラン: 選んだ順に「午前→お昼→午後」で時間割を自動配分する専用エンジン
// カスタムプラン(4〜5枠エンジン)の時間割・行データ構築。
// customGenerate5() から切り出した関数(DOM操作・loading表示・msg・genStart 等の副作用は呼び出し側に残す)。
// slots は「実際にプランへ入れる枠の中身」(自動補完ぶんを含む)。applySwap の組み直しからも同じ関数を使う。
function buildCustomPlanFromSlots(slots,date,w){
  slots=(slots||[]).slice();
  const li=cpLIFor(slots.length);
  const morning=slots.slice(0,li).filter(Boolean);
  const lunch=slots[li]||null;
  const afternoon=slots.slice(li+1).filter(Boolean);
  const o=state.origin;
  const onlyToddler=state.ages.has('0-2')&&state.ages.size===1;
  const capHome=capHomeFor(state.ages);   // [裁定172] 重複定義を1本に統一（旧: 18:00 固定）
  // 滞在時間の配分: 午前枠は合計で〜12:00めど、午後枠は帰宅上限から逆算
  const rows=[]; let legSum=0; let t=startMinutes();
  let lastName=(o.name==='現在地'||o.isAnjo)?'出発地周辺':o.name+'周辺';
  let lastLat=o.lat, lastLng=o.lng; let lastSpot=null;
  const mStay=morning.length>=2?60:90;
  morning.forEach((s,ix)=>{
    const dm2=lastSpot?legMinutes(lastLat,lastLng,s.latitude,s.longitude):(driveMinutesFrom(o,s)||30);
    rows.push({type:'move',time:t,label:'🚗 移動（約'+dm2+'分）',sub:transitLabel(lastName,s.name,dm2)});
    legSum+=dm2; t+=dm2;
    const ci=closingInfo(s,t);
    rows.push({type:'spot',time:t,spot:s,tag:morning.length>1?('午前スポット'+(ix+1)):'メイン',closeNote:ci.exclude?'※この時間帯は営業時間外の可能性があります。公式サイトでご確認ください':ci.note});
    t+=mStay;
    lastName=s.name; lastLat=s.latitude; lastLng=s.longitude; lastSpot=s;
  });
  if(lunch&&lunch.__bento){
    rows.push({type:'move',time:t,label:'🍱 お弁当ランチ（移動なし）',sub:(lastSpot?lastName:'最初のスポット')+'でそのままお昼休憩。レジャーシートがあると安心'});
    t+=50;
  } else if(lunch){
    const ldm=lastSpot?legMinutes(lastLat,lastLng,lunch.latitude,lunch.longitude):(driveMinutesFrom(o,lunch)||30);
    rows.push({type:'move',time:t,label:'🚗 移動（約'+ldm+'分）',sub:transitLabel(lastName,lunch.name,ldm)});
    legSum+=ldm; t+=ldm;
    const lci=closingInfo(lunch,t);
    let mealStay5=60, mealNote5=null;
    const mealBh5=parseBusinessHours(lunch);
    if(mealBh5&&mealBh5.closeMin-t>0){   // [裁定147] remain<=0 なら「閉店が近いため〜」を出さない
      const ml5=mealBh5.closeMin-15;
      if(t+mealStay5>ml5){ mealStay5=Math.max(30,Math.floor((ml5-t)/15)*15); mealNote5='※閉店が近いため滞在めやす〜'+mealStay5+'分（閉店15分前までの利用がおすすめです）'; }
    }
    rows.push({type:'spot',time:t,spot:lunch,tag:mealLabelFor(t),food:true,paynote:state.budget==='free',closeNote:mealNote5?((lci.note?lci.note+'／':'')+mealNote5):lci.note});
    t+=mealStay5;
    lastName=lunch.name; lastLat=lunch.latitude; lastLng=lunch.longitude; lastSpot=lunch;
  }
  // 午後枠: 残り時間を人数割り(最短45分・最長90分)
  let warn=false;
  afternoon.forEach((s,ix)=>{
    const dm2=legMinutes(lastLat,lastLng,s.latitude,s.longitude);
    rows.push({type:'move',time:t,label:'🚗 移動（約'+dm2+'分）',sub:transitLabel(lastName,s.name,dm2)});
    legSum+=dm2; t+=dm2;
    const remainSpots=afternoon.length-ix;
    const bdm=driveMinutesFrom(o,s)||legMinutes(s.latitude,s.longitude,o.lat,o.lng);
    // このスポット以降に残せる時間から滞在を決める
    const budgetMin=capHome-bdm-t-(remainSpots-1)*(45+15);
    let stay=Math.max(45,Math.min(90,Math.floor(budgetMin/remainSpots/15)*15));
    if(budgetMin<45*remainSpots){ stay=45; warn=true; }
    const ci=closingInfo(s,t);
    const bh=parseBusinessHours(s);
    if(bh&&t+stay>bh.closeMin-15){ stay=Math.max(30,Math.floor((bh.closeMin-15-t)/15)*15); if(stay<45) warn=true; }
    rows.push({type:'spot',time:t,spot:s,tag:afternoon.length>1?('午後スポット'+(ix+1)):'午後スポット',closeNote:ci.exclude?'※この時間帯は営業時間外の可能性があります。公式サイトでご確認ください':ci.note});
    t+=stay;
    lastName=s.name; lastLat=s.latitude; lastLng=s.longitude; lastSpot=s;
  });
  const homeDm=lastSpot?(driveMinutesFrom(o,lastSpot)||legMinutes(lastLat,lastLng,o.lat,o.lng)):0;
  rows.push({type:'move',time:t,label:'🚗 帰路（約'+homeDm+'分）',sub:transitLabel(lastName,'ご自宅',homeDm)+'／帰着めやす '+fmtTime(t+homeDm)+'ごろ'});
  legSum+=homeDm;
  const __retHome=t+homeDm;
  if(t+homeDm>capHome+30) warn=true;
  // 費用集計(既存ルール踏襲)
  const used=morning.concat((lunch&&!lunch.__bento)?[lunch]:[],afternoon);
  let known=0,hasUnknown=false,allFree=true;
  used.filter(s=>!((s.play_types||[]).includes('food'))).forEach(s=>{ const pr=parsePrice(s); if(pr==null)hasUnknown=true; else{known+=pr; if(pr>0)allFree=false;} });
  let cost;
  if(allFree&&!hasUnknown) cost='入場料など 無料（大人1人あたり・ランチ代は別）';
  else if(known===0&&hasUnknown) cost='入場料などは公式サイトで確認（ランチ代は別）';
  else cost='入場料など 大人1人あたり 目安'+known.toLocaleString()+'円'+(hasUnknown?'（一部要確認）':'')+'・ランチ代は別';
  const __lunchOut=(lunch&&!lunch.__bento)?lunch:null;
  const plan={rows,main:morning[0]||afternoon[0],lunch:__lunchOut,sub:afternoon[0]||null,totalDrive:legSum,cost,hasUnknown,homePriority:false,custom5:true,retHome:__retHome};
  plan.__warn=warn;
  return plan;
}

  state.isSharedView=false; state.isCustomView=true;
  state.excludedSpots=[]; state.lastPlanSpots=[];

  state.plans[0].__missing=cpMissingSelected(state.plans[0]);
  state.plans[0].__closedWarn=cpClosedWarnNames(date);   // [S-1]
  state.plans[0].__hoursWarn=cpHoursWarnList(state.plans[0],date);   // [裁定146]
  state.variant=0; state.planNo=1;
  if(!genOk(__gid)) return;
  document.getElementById('loading').style.display='none';

  }catch(e){ genFail(__gid); }

function fbRate(r){
  if(!state.fb) state.fb={rated:false,rating:null,sent:false};
  const first=!state.fb.rated;
  state.fb.rating=r; state.fb.rated=true;
  const g=document.getElementById('fbGood'), b=document.getElementById('fbBad');
  if(g) g.setAttribute('aria-pressed', r==='good'?'true':'false');
  if(b) b.setAttribute('aria-pressed', r==='bad'?'true':'false');
  const t=document.getElementById('fbThanks'); if(t) t.style.display='';

    gtag('event','plan_feedback_rate',seoP({rating:r,pref:PREF_SCOPE,plan_no:state.planNo,reroll_count:Math.max(0,(state.planNo||1)-1)}));
  }
}

  html+='<div class="summary">🚗 移動の目安 <b>約'+driveStr+'</b>（往復）　／　💰 <b>'+esc(p.cost)+'</b></div>';

  if(routeUrl){

      '<a class="act-gmaps" href="'+esc(routeUrl)+'" target="_blank" rel="noopener" onclick="track(\'gmaps_route\')" '+
      'style="display:inline-block;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:#1a73e8;color:#fff;font-weight:800;font-size:.95rem;text-decoration:none">'+
      '🚗 このルートをGoogleマップで開く</a>'+

      '</div>';
  }

  if(state.isCustomView){
    html+='<button class="act-reroll" onclick="editCustom()">✏️ えらんだ場所を編集する</button>';
  } else {
    html+='<button class="act-reroll" onclick="reroll()">🔄 別のプランにする</button>';
  }
  html+='<button class="act-restart" onclick="restart()">最初からやり直す</button>';
  html+='</div>';
  html+=fbHtml(); // プランの評価（.actions の直後・各注記より上）
  // [A-10] 上部から回した2番目以降の注記(削除せず、プランの下に残す)
  if(__below) html+=__below;
  if(!state.weather){
    html+='<div class="notice">※ 現在お天気情報を取得できなかったため、天気条件なしでプランを作成しています。</div>';
  }
  if(state.isCustomView&&state.custom5Warn){
    html+='<div class="notice" style="background:#fdf0e7;border:1px solid #e8b48a">⚠ この日程だと選んだ場所を全部回るのは駆け足になりそうです。1〜2カ所減らすか、滞在を短めにする前提でご利用ください。</div>';

    const dlab=['20','40','60'].includes(state.driveTime)?('〜'+state.driveTime+'分'):'ご希望';
    html+='<div class="notice">※ '+esc(dlab)+'圏内では条件に合う候補が少なかったため、少し範囲を広げています。</div>';
  }
  // P0: 営業時間が未登録で確定枠から外したスポットを「予備候補」として別表示する(確定枠には入れない)
  // SHOW_RESERVE_AFTER_PLAN=false のあいだは表示のみ抑止する(reserveHtml/openReserveSwap は候補不足時に使うため残す)
  if(SHOW_RESERVE_AFTER_PLAN&&!state.isSharedView&&!state.isCustomView){
    html+=reserveHtml('plan',[p.main,p.lunch,p.sub].filter(Boolean));
  }
  html+='<div class="noticebottom">'+
    '※飲食代は別途。表示金額は1人あたりの目安です<br>'+

}
/* ===== 前回条件の保存・復元 (localStorage / ログイン不要) ===== */
const PREF_KEY=pkey('odemaru_prefs_v1');
function savePrefs(){
  try{
    const o=state.origin||{};
    localStorage.setItem(PREF_KEY,JSON.stringify({
      origin:(o.name&&o.name!=='現在地')?{name:o.name,lat:o.lat,lng:o.lng,isAnjo:!!o.isAnjo}:null,
      driveTime:state.driveTime||null,
      ages:[...state.ages],
      budget:state.budget||null
    }));
  }catch(e){}
}
function loadPrefs(){
  try{
    const raw=localStorage.getItem(PREF_KEY);
    if(!raw) return;
    const p=JSON.parse(raw);
    // 出発地(市町村選択のみ復元。現在地は毎回取り直し)
    const __o=sanitizeOrigin(p.origin);
    if(__o){
      const sel=document.getElementById('originSel');
      if(sel){
        for(const opt of sel.options){
          if(opt.textContent===__o.name){ sel.value=opt.value; break; }
        }
      }
      state.origin=__o;
      const note=document.getElementById('geoNote');
      if(note) note.textContent='前回の出発地を選択しています（変更もできます）';
    } else if(p.origin){
      // 他県ページで保存された出発地 → 破棄し、当県の初期値のまま進む
      try{ localStorage.removeItem(PREF_KEY); }catch(e2){}
    }
    if(p.driveTime){
      const btn=document.querySelector('#driveBtns .bigbtn[data-drive="'+p.driveTime+'"]');
      if(btn){ btn.classList.add('on'); state.driveTime=p.driveTime; }
    }
    if(Array.isArray(p.ages)){
      p.ages.forEach(a=>{
        const btn=document.querySelector('#ageBtns .bigbtn[data-age="'+a+'"]');
        if(btn){ btn.classList.add('on'); state.ages.add(a); }
      });
    }
    if(p.budget){
      const btn=document.querySelector('#budgetBtns .bigbtn[data-budget="'+p.budget+'"]');
      if(btn){ btn.classList.add('on'); state.budget=p.budget; }
    }
    refreshNext();
  }catch(e){}
}
function reroll(){
  if(typeof gtag==='function') gtag('event','plan_reroll');
  state.isSharedView=false;
  state.swapFixed={}; state.swapSeen={};
  const curP=state.plans.length?state.plans[state.variant%state.plans.length]:null;
  state.lastPlanSpots=curP?[curP.main,curP.lunch,curP.sub].filter(Boolean):[];
  const date=targetDate(state.when);
  const newPlan=nextVarietyPlan(date,state.weather);
  if(newPlan&&newPlan.main) rememberMains([newPlan.main.name]);
  if(newPlan){
    state.plans.push(newPlan);
    state.variant=state.plans.length-1;
  } else {
    state.variant=state.plans.length?(state.variant+1)%state.plans.length:0;
  }
  state.planNo=(state.planNo||1)+1;
  showResult();
}
function restart(){
  CP_PICK_NAMES=null;   // [裁定146]
  state.isCustomView=false; state.customSlots=[null,null,null]; state.cpPlanSlots=null;
  try{ localStorage.removeItem(CUSTOM_KEY); }catch(e){}
  const cpEl=document.getElementById('customPanel'); if(cpEl) cpEl.style.display='none';
  state.driveTime=null; state.when=null; state.depart=null; state.ages.clear(); state.budget=null; state.weather=null; state.variant=0; state.planNo=1; state.plans=[]; state.expandedDrive=false; state.isSharedView=false; state.shownMains=[]; state.shownLunches=[]; state.shownSubs=[]; state.excludedSpots=[]; state.lastPlanSpots=[]; state.swapFixed={}; state.swapSeen={};
  document.querySelectorAll('.bigbtn.on').forEach(b=>b.classList.remove('on'));
  document.getElementById('departWrap').style.display='none';
  document.getElementById('result').style.display='none';
  planIntroVisible(true);   // [A-10] 入力画面に戻ったので導入文を戻す
  document.getElementById('dots').style.display='flex';
  step=0; render();
  steps.forEach(s=>{ const n=s.querySelector('[data-next]'); if(n&&+s.dataset.step!==0) n.disabled=true; });
  refreshNext();
}

<script>
/* ===== [share-img] 「📤 家族に送る」を画像つき共有に =====================================
 * 結果画面の「📤 家族に送る（共有）」から呼ばれる。既存の sharePlan() は変更せず、画像を共有できない端末ではそれを呼ぶ。
 * 表示中のプラン(state.plans[state.variant])を 1080px 幅・縦長(最低1920px)の PNG に Canvas 2D で描く。
 * - 写真は PHOTO_MAIN_ROW の写真だけ。読めない／canvas が汚染されたら写真とクレジットを両方外して描き直す
 *   （写真だけ載ってクレジットが無い画像は作らない）
 * - 共有テキストのURLは sharePlan() と同じ buildShareUrl(p)（画像には長いURLを載せない）
 * - 送信: Web Share(ファイル) が使えれば画像＋リンクの共有シート。使えなければ従来の sharePlan()（リンク共有／コピー）
 * - GA4: share_image {method:'image', result:'shared'|'downloaded'|'cancelled'}
 * ================================================================================== */
(function(){
var W=1080, MIN_H=1920, PAD=64, busy=false;
var SITE_DOMAIN='kosodate-odekake.jp';
// サイト名とマークはページ上部のロゴ(.odm-brand)から読む（県ごとにコードを変えないため）
function siteName(){ try{ var b=document.querySelector('.odm-brand'); var t=b?(b.textContent||'').trim():''; if(t) return t; var m=/｜([^｜]+)$/.exec(document.title||''); return m?m[1].trim():''; }catch(e){ return ''; } }
function markSrc(){ try{ var i=document.querySelector('.odm-brand img'); return (i&&i.getAttribute('src'))||'/odemaru-mark.png'; }catch(e){ return '/odemaru-mark.png'; } }
function css(n,d){ try{ var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v||d; }catch(e){ return d; } }
function ga(result){ try{ if(typeof gtag==='function'){ gtag('event','share_image',{method:'image',result:result}); } }catch(e){} }
function txt(html){ var d=document.createElement('div'); d.innerHTML=String(html==null?'':html); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function loadImg(src,ms,cors){
  return new Promise(function(res){
    var im=new Image(), done=false;
    var fin=function(v){ if(!done){ done=true; clearTimeout(t); res(v); } };
    var t=setTimeout(function(){ fin(null); },ms);
    if(cors) im.crossOrigin='anonymous';
    im.onload=function(){ fin(im.naturalWidth?im:null); };
    im.onerror=function(){ fin(null); };
    im.src=src;
  });
}
// 1回目が失敗したら、CORSなしでキャッシュされた応答を避けるため問い合わせ文字列を付けて1回だけ再試行（合計およそ4秒まで）
async function loadPhoto(src){
  var t0=Date.now();
  var im=await loadImg(src,4000,true);
  var left=4000-(Date.now()-t0);
  if(!im&&left>300) im=await loadImg(src+(src.indexOf('?')<0?'?':'&')+'odm_img=1',left,true);
  return im;
}
// 日本語向けの1文字単位の折り返し（行頭に来ない約物は前の行に残す）
function wrap(ctx,text,maxW,maxLines){
  var chars=Array.from(String(text||'')), lines=[], cur='';
  for(var i=0;i<chars.length;i++){
    var c=chars[i];
    if(cur&&ctx.measureText(cur+c).width>maxW&&!/^[、。，．）」』】〕！？ー…・:：\/)\]]$/.test(c)){ lines.push(cur); cur=c; }
    else cur+=c;
  }
  if(cur) lines.push(cur);
  if(maxLines&&lines.length>maxLines){
    lines=lines.slice(0,maxLines);
    var l=lines[maxLines-1];
    while(l&&ctx.measureText(l+'…').width>maxW) l=l.slice(0,-1);
    lines[maxLines-1]=l+'…';
  }
  return lines;
}
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// 画面の表示と同じ材料だけで行データを作る（rowHtml と同じ文言）
function planData(p){
  var rows=p.rows||[], main=[], bonus=[];
  rows.forEach(function(r){ (r.opt?bonus:main).push(r); });
  var conv=function(r){
    if(r.type==='move') return {k:'move',ik:'car',time:fmtTime(r.time),icon:'🚗',name:txt(r.label).replace(/^🚗\s*/,''),sub:txt(r.sub)};
    if(r.type==='branch') return {k:'branch',time:fmtTime(r.time),icon:'🏠',name:txt(r.label),sub:''};
    if(r.type==='note') return {k:'branch',ik:(/^(🍙|🍱|🍽)/.test(r.icon||'')?'food':null),time:fmtTime(r.time),icon:r.icon||'ℹ️',name:txt(r.text),sub:''};   // [plan-fix 2026-09-23]
    var s=r.spot||{};
    return {k:'spot',ik:(typeof plIllKey==='function'?plIllKey(s):null),time:fmtTime(r.time),icon:s.__temp?'📍':spotEmoji(s),name:String(s.name||''),sub:String(r.tag||'')+(s.city?'・'+s.city:'')};
  };
  var h=Math.floor(p.totalDrive/60), m=p.totalDrive%60;
  return {main:main.map(conv),bonus:bonus.map(conv),
    summary:'🚗 移動の目安 約'+((h?h+'時間':'')+(m?m+'分':'')||'0分')+'（往復）　／　💰 '+String(p.cost||'')};
}
// 画面のクレジット表記(photoCreditHTML)をそのまま文字にする
function creditText(s){ try{ return txt(photoCreditHTML(s)); }catch(e){ return ''; } }

function paint(ctx,H,d){
  var C={bg:css('--bg','#faf6ef'),card:css('--card','#fffdf9'),ink:css('--ink','#3d3a34'),sub:css('--sub','#7a746a'),
         line:css('--line','#e7ddcd'),acc:css('--accent','#e08a5b'),accd:css('--accent-d','#c9713f')};
  var F=d.font, f=function(w,px){ ctx.font=w+' '+px+'px '+F; };
  ctx.textBaseline='top';
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.acc; ctx.fillRect(0,0,W,14);
  var y=64;
  // ヘッダー
  if(d.mark){ try{ ctx.drawImage(d.mark,PAD,y,112,112); }catch(e){} }
  var hx=d.mark?PAD+136:PAD;
  f('800',64); ctx.fillStyle=C.accd; ctx.fillText('きょうのおでかけプラン',hx,y+2);
  f('700',36); ctx.fillStyle=C.ink; ctx.fillText(d.when,hx,y+80);
  y+=150;
  f('700',38); ctx.fillStyle=C.ink;
  wrap(ctx,'🏠 出発地：'+d.origin,W-PAD*2).forEach(function(l){ ctx.fillText(l,PAD,y); y+=52; });
  y+=18;
  // 写真（写真とクレジットは必ずセット）
  if(d.photo&&d.credit){
    var pw=W-PAD*2, ph=Math.round(pw/2.4), im=d.photo;
    var sc=Math.max(pw/im.naturalWidth,ph/im.naturalHeight), sw=pw/sc, sh=ph/sc;
    ctx.save(); rrect(ctx,PAD,y,pw,ph,28); ctx.clip();
    ctx.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,PAD,y,pw,ph);
    ctx.restore();
    y+=ph+10;
    f('400',22); ctx.fillStyle=C.sub;
    wrap(ctx,d.credit,pw,3).forEach(function(l){ ctx.fillText(l,PAD,y); y+=30; });
    y+=18;
  }
  // タイムライン（カード）
  var cardY=y, cx=PAD, cw=W-PAD*2, tX=cx+28, iX=cx+28+128+40, bX=iX+58, bW=cx+cw-28-bX;
  if(d.cardH){ ctx.fillStyle=C.card; rrect(ctx,cx,cardY,cw,d.cardH,32); ctx.fill(); ctx.strokeStyle=C.line; ctx.lineWidth=3; ctx.stroke(); }
  y+=32;
  var drawRows=function(list){
    list.forEach(function(r,i){
      var isMove=r.k==='move', top=y;
      f('800',isMove?30:38); ctx.fillStyle=isMove?C.sub:C.ink; ctx.fillText(r.time,tX,y+(isMove?6:4));
      var nl, sl;
      f('800',isMove?32:44); nl=wrap(ctx,r.name,bW,3);
      f('600',isMove?26:28); sl=r.sub?wrap(ctx,r.sub,bW,2):[];
      var nh=isMove?44:58, sh=isMove?34:38, bh=nl.length*nh+sl.length*sh, rowH=Math.max(isMove?60:84,bh)+(isMove?22:30);
      if(i<list.length-1){ ctx.strokeStyle=C.line; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(iX,top+30); ctx.lineTo(iX,top+rowH+30); ctx.stroke(); }
      var rr=isMove?26:36;
      var im=(r.ik&&typeof PLIL_IMG!=='undefined')?PLIL_IMG[r.ik]:null, useIm=!!(im&&im.complete&&im.naturalWidth&&!PLIL_IMG.__taint);   // [ill-icons 2026-09-26]
      ctx.beginPath(); ctx.arc(iX,top+rr,rr,0,Math.PI*2); ctx.fillStyle=useIm?'#fff':'#fff6ee'; ctx.fill();
      ctx.lineWidth=isMove?3:(useIm?5:4); ctx.strokeStyle=useIm?(PLIL_C[r.ik]||C.acc):(isMove?C.line:C.acc); ctx.stroke();
      if(useIm){ var sz=rr*1.45; try{ ctx.drawImage(im,iX-sz/2,top+rr-sz/2,sz,sz); }catch(e){ useIm=false; } }
      if(!useIm){ f('400',isMove?26:36); ctx.textAlign='center'; ctx.fillStyle=C.ink; ctx.fillText(r.icon,iX,top+rr-(isMove?15:20)); ctx.textAlign='left'; }
      var yy=top;
      f('800',isMove?32:44); ctx.fillStyle=isMove?C.sub:C.ink; nl.forEach(function(l){ ctx.fillText(l,bX,yy); yy+=nh; });
      f('600',isMove?26:28); ctx.fillStyle=C.sub; sl.forEach(function(l){ ctx.fillText(l,bX,yy); yy+=sh; });
      y=top+rowH;
    });
  };
  drawRows(d.rows.main);
  if(d.rows.bonus.length){
    y+=6; f('800',32); ctx.fillStyle='#8a7a4a'; ctx.fillText('⏱ 余力があればもう1カ所',tX,y); y+=58;
    drawRows(d.rows.bonus);
  }
  f('700',30); var sm=wrap(ctx,d.rows.summary,cw-56-40,3);
  ctx.fillStyle='#f6ede0'; rrect(ctx,tX,y,cw-56,sm.length*42+32,20); ctx.fill();
  ctx.fillStyle='#5a4632'; var sy=y+16; sm.forEach(function(l){ ctx.fillText(l,tX+20,sy); sy+=42; });
  y+=sm.length*42+32+28;
  var cardH=y-cardY;
  y+=26;
  if(d.note){ f('600',28); ctx.fillStyle=C.sub; wrap(ctx,d.note,W-PAD*2).forEach(function(l){ ctx.fillText(l,PAD,y); y+=40; }); y+=10; }
  // フッター（下端に固定）: サイト名とドメインだけ
  var FH=150, fy=Math.max(y,H-FH);
  ctx.fillStyle=C.card; ctx.fillRect(0,fy,W,H-fy);
  ctx.fillStyle=C.acc; ctx.fillRect(0,fy,W,8);
  f('800',34); ctx.fillStyle=C.accd; ctx.textAlign='center';
  ctx.fillText('おでまる｜'+d.site,W/2,fy+34);
  f('600',26); ctx.fillStyle=C.sub; ctx.fillText(SITE_DOMAIN,W/2,fy+88);
  ctx.textAlign='left';
  return {contentBottom:y, cardH:cardH, need:y+FH};
}
function toBlob(cv){
  return new Promise(function(res,rej){
    try{ cv.toBlob(function(b){ b?res(b):rej(new Error('toBlob null')); },'image/png'); }catch(e){ rej(e); }
  });
}
async function render(d){
  var m=document.createElement('canvas'); m.width=W; m.height=4000;
  var r1=paint(m.getContext('2d'),4000,d);
  d.cardH=r1.cardH;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=Math.max(MIN_H,Math.ceil(r1.need));
  paint(cv.getContext('2d'),cv.height,d);
  return toBlob(cv);   // 汚染されていれば SecurityError で reject
}
async function buildImage(p){
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  var d={font:(getComputedStyle(document.body).fontFamily||'sans-serif'),
    when:(function(){ try{ return whenLabel(); }catch(e){ return ''; } })(),
    origin:(state.origin&&state.origin.name)||'', rows:planData(p), site:siteName(),
    note:'※営業時間・休みは必ず公式サイトでご確認ください', mark:null, photo:null, credit:''};
  var row=(typeof PHOTO_MAIN_ROW!=='undefined')?PHOTO_MAIN_ROW:null;
  var s=(row&&(p.rows||[]).indexOf(row)>=0)?row.spot:null;
  var jobs=[loadImg(markSrc(),3000,false)];
  if(s&&photoAllowed(s)) jobs.push(loadPhoto(s.image_url));
  var got=await Promise.all(jobs);
  d.mark=got[0];
  if(got[1]){ var c=creditText(s); if(c){ d.photo=got[1]; d.credit=c; } }
  if(!d.photo) return render(d);
  try{ return await render(d); }
  catch(e){ d.photo=null; d.credit=''; return render(d); }   // 写真で失敗したら写真とクレジットを外して描き直す
}
function fileName(){
  var t; try{ t=targetDate(state.when); }catch(e){ t=new Date(); }
  return 'odemaru-plan-'+t.getFullYear()+('0'+(t.getMonth()+1)).slice(-2)+('0'+t.getDate()).slice(-2)+'.png';
}
function download(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.style.display='none'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },4000);
  showToast('画像を保存しました。LINEで送れます');
  ga('downloaded');
}
async function doShare(file,text){
  try{ await navigator.share({files:[file],text:text}); ga('shared'); return 'ok'; }
  catch(e){ if(e&&e.name==='AbortError'){ ga('cancelled'); return 'ok'; } return e&&e.name==='NotAllowedError'?'retry':'fail'; }
}
// 画像ファイルを共有できる端末か（できなければ従来のリンク共有 sharePlan() をそのまま使う）
function canShareFiles(){

/* ===== [erabu] マップから自分で選ぶ（v6：エンジンを engine-fix3 の tokyo/plan.html に。無料で絞っているときは freeOnly、お昼の「変える」に「お昼なし（家で食べる）」＝ lunch:'none'（午前だけ）、共有URLに nl・fo・sm・ss。以下 v5：アイコンはオリジナルの SVG（OI）・休みのピンは薄くするだけ・日付を変えたらひとこと・夕方は先に日付を選ぶ。以下 v4：プランはおまかせの結果画面と同じ縦のタイムライン・自分で選んだ場所は「マップで選び直す」・名前はズーム15以上・カードは最小限） =====
 * 上の <script> は tokyo/plan.html のエンジン部分（宣言だけを取り出したもの）。ここではそれを呼ぶだけで、エンジンの中身は変えない。
 * 差し替えるのは次の6つだけ（このページの中だけ・window のプロパティを上書き）:
 *   targetDate … 'd:YYYYMMDD' を日付として受ける（あす・週末・共有の固定日）
 *   startMinutes … 共有で開いたときは送った人の出発時刻に固定
 *   whenLabel … 共有画像の日付表示
 *   showResult … applySwap() の後の再描画をこのページの3行表示にする
 *   buildShareUrl / sharePlan … 共有URLに日付(d)と出発時刻(t)を入れる
 * 「午後に行く」は、選んだ場所を午後の枠に固定し、午前の遊び場を buildPool()（エンジンの主役候補）のうちその場所の近くから、
 *   お昼を lunchCandidates()（その遊び場の近くのお店）のうち選んだ場所への寄り道が少ない順に選び、buildPlan(main,date,w,{lunch,sub}) で組む。
 * 「変える」の候補はおまかせと同じ swapCandidates()（最初の3件）と swapFilterAll()（もっと見るの続き）、差し替えは applySwap()。
 * 出発地の「📍 現在地」は plan.html の sanitizeOrigin / cpSaveOrigin / cpLoadOrigin（HERE_MAX_AGE_MS=30分）をそのまま使う。
 */
(function(){
'use strict';
const $=id=>document.getElementById(id);
/* ---------- v5：アイコン（OI は build.js が icons/svg から入れる。絵文字は使わない） ---------- */
const ic=(k,cls)=>'<svg class="'+(cls||'oi')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(OI.g[k]||'')+'</svg>';
// ピンの影は CSS の filter（drop-shadow）だと100本近いピンで描画が重くなるので、同じ輪郭を少し下にずらした薄い黒で SVG の中に描く
const pinSvg=k=>{ const p=OI.pin[k]; return '<svg class="pg" viewBox="'+p.vb+'" aria-hidden="true" focusable="false">'+(p.d?'<path d="'+p.d+'" transform="translate(0 1.8)" fill="#000" fill-opacity=".24"/>':'')+p.svg+'</svg>'; };
// エンジンが HTML 用に変換済みの文字列（transitLabel など）を、いったん普通の文字に戻す（esc を2回かけない）
const _ta=document.createElement('textarea');
const plain=h=>{ _ta.innerHTML=String(h==null?'':h); return _ta.value; };
function ga(n,p){ try{ if(typeof gtag==='function') gtag('event',n,p||{}); }catch(e){} }
const E={mode:'play',f:{},q:'',sugOff:false,sel:null,when:null,fixedStart:null,
  main:null,L:undefined,S:undefined,userL:false,userS:false,shared:false,pending:null,addFor:null,wx:{},lastShare:null,
  pin:null,pmAuto:false,sw:null,
  noLunch:false,fo:false,stay:null};   // v6：noLunch＝お昼なし（家で食べる・午前だけ）、fo＝無料で絞ってプランを組んだ、stay＝共有で受け取った滞在の指定 {stayMain,staySub}（このページからは指定しない）
/* v6：buildPlan の4つ目の引数に、無料の指定・受け取った滞在の指定を足す（lunch/sub のキーの有無はそのまま＝従来の意味） */
function planOpts(base){
  const o=Object.assign({},base||{});
  if(E.fo) o.freeOnly=true;
  if(E.stay){ if(E.stay.stayMain) o.stayMain=E.stay.stayMain; if(E.stay.staySub) o.staySub=E.stay.staySub; }
  return Object.keys(o).length?o:undefined;
}   // pin={name,slot:'am'|'pm',spot}：カードで選んだ場所と午前／午後。sw：開いている「変える」パネル
window.__ERABU=E;

/* ---------- エンジンの差し替え（このページの中だけ） ---------- */
const _targetDate=targetDate, _startMinutes=startMinutes;
window.targetDate=function(when){
  const m=/^d:(\d{4})(\d{2})(\d{2})$/.exec(String(when==null?'':when));
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  return _targetDate(when);
};
E.shift=0;   // 主役の開く時刻より早く着くときだけ、出発をその分おそくする（このページだけの調整）
window.startMinutes=function(){ return E.fixedStart!=null?E.fixedStart:_startMinutes()+E.shift; };
// v5：共有画像の2行目。見出しを「9/27（日）のおでかけプラン」にするので（下の fillText の置きかえ）、ここは出発時刻
window.whenLabel=function(){ try{ const p=currentPlanObj(), v=p?view3(p):null; if(v&&v.start!=null) return fmtTime(v.start)+' 出発'; }catch(e){} return dateLabel(targetDate(state.when)); };
window.showResult=function(){ syncFromPlan(); renderPlan(); };

/* ---------- 日付 ---------- */
const WDJ=['日','月','火','水','木','金','土'];
const dateLabel=d=>(d.getMonth()+1)+'/'+d.getDate()+'（'+WDJ[d.getDay()]+'）';
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const dk=d=>'d:'+ymd(d);
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function whenOpts(){
  const t=today0(), tm=addDays(t,1);
  let sat=addDays(tm,1); while(sat.getDay()!==6) sat=addDays(sat,1);            // あすより後の最初の土曜
  const mon=d=>addDays(d,-((d.getDay()+6)%7)).getTime();
  const o=[];
  if(todayPlanAvailable()) o.push({k:'today',lab:'きょう',d:t});
  o.push({k:dk(tm),lab:'あす',d:tm});
  o.push({k:dk(sat),lab:(mon(sat)===mon(t)?'今週末':'来週末'),d:sat});
  return o;
}
function defaultWhen(){ return todayPlanAvailable()?'today':dk(addDays(today0(),1)); }

/* ---------- 見た目の材料 ---------- */
// v7：乗り物（vehicle）を独立。ピンの分類（icons/work/classify.js の規則をそのまま）：たべる（チェーン店／個人店）→ 児童館 → 名前（例外を先に）→ play_types
function pinKind(s){
  const pt=s.play_types||[], n=String(s.name||'');
  if(s.is_chain===true) return 'chain';
  if(pt.indexOf('food')>=0) return 'food';
  if(s.is_jidokan===true) return 'jidokan';
  // 名前：例外（「科学」「ふるさと村」の名前でも中身は公園）
  if(/森林科学園|山のふるさと村/.test(n)) return 'park';
  // 名前：例外（美術館・公園などの名前でも中身が室内あそび場）
  if(/おもちゃ美術館|あそびのせかい|あそびの森|HUGHUG|ちきゅうのにわ|PLAY! PARK|こどもひろば|0123|まんがぱーく|キッズ|プレイルーム|サンリオピューロランド/.test(n)) return 'indoor';
  if(/動物|水族|ZOO|牧場|ポニー|リス園|さる園|生物園|自然文化園/.test(n)) return 'animal';
  // 名前：例外（防災館は消防署が運営していても体験施設。乗り物にしない）

       選んでいる日がお休みの場所はピンを薄くする（押せる）。 */
let map=null, layers=null, selMk=null;
const CLUSTER_OFF_ZOOM=12, CLUSTER_R=40, LABEL_ZOOM=14, SPOT_ZOOM=14, SAME_KM=0.03;   // v4：名前はズーム15以上（送られた場所を開くときのズームは v3 と同じ14）
function tiles(m){ L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(m); m.attributionControl.setPrefix(false); m.attributionControl.setPosition('topright'); }
// v5：ピンは pin-*.svg（しずく型＋白い線画）。幅44・高さ51、先端が地点
const pinIcon=(s,cls,lab,cnt)=>{ const k=kindOfS(s); return L.divIcon({className:'pinw',html:'<div class="pin '+(cls||'')+'" data-k="'+k+'">'+pinSvg(k)+'</div>'+(cnt>1?'<em class="cnt">'+cnt+'</em>':'')+(lab?'<b class="lbl">'+esc(lab)+'</b>':''),iconSize:[44,51],iconAnchor:[22,49]}); };
const homeIcon=(label,cls)=>L.divIcon({className:'homew',html:'<div class="hm '+(cls||'')+'">'+pinSvg('home')+'<i>'+esc(label)+'</i></div>',iconSize:[44,44],iconAnchor:[22,22]});
function clusterGroup(){
  return L.markerClusterGroup({maxClusterRadius:CLUSTER_R,disableClusteringAtZoom:CLUSTER_OFF_ZOOM,showCoverageOnHover:false,spiderfyOnMaxZoom:false,zoomToBoundsOnClick:true,removeOutsideVisibleBounds:true,chunkedLoading:false,
    iconCreateFunction:c=>{ const n=c.getChildCount(), z=n<10?44:(n<100?50:58); return L.divIcon({html:'<div class="cl"><span>'+n+'</span></div>',className:'clw',iconSize:[z,z]}); }});
}
/* 選んでいる日（きょう、またはプランで日付を変えていればその日） */
function mapWhen(){ return E.when||'today'; }
function mapDate(){ return targetDate(mapWhen()); }
function dayWord(){ const d=mapDate(), n=Math.round((d-today0())/864e5); return n===0?'きょう':(n===1?'あす':dateLabel(d)); }
// isClosedOn / parseBusinessHours はエンジンの対象日（PLAN_DATE）を書き換えるので、呼んだあと元に戻す
let closedCache={k:null,m:new Map()};
function closedOnMap(s){
  if(!s||s.__temp) return false;
  const d=mapDate(), k=ymd(d); if(closedCache.k!==k) closedCache={k,m:new Map()};
  if(closedCache.m.has(s)) return closedCache.m.get(s);
  const keep=PLAN_DATE; let v=false;
  try{ v=isClosedOn(s,d); }catch(e){ v=false; } finally{ setPlanDate(keep); }
  closedCache.m.set(s,v); return v;
}
// 薄くするのは、選んでいる日がお休みの場所だけ（年齢で薄くするのは取りやめ：エンジンの判定だと乳幼児向けの施設まで薄くなるため）
const dimOf=s=>closedOnMap(s)?1:0;
const tierRank=s=>s.tier==='S'?0:(s.tier==='A'?1:2);
function hoursInfo(s){   // 「きょう 9:30〜17:00」「きょうはお休み」。読めないときは null（出さない）
  if(!s||s.__temp) return null;
  const d=mapDate(), w=dayWord(), keep=PLAN_DATE;
  try{
    if(isClosedOn(s,d)) return {closed:true,t:w+'はお休み'};
    const bh=parseBusinessHours(s,d); if(!bh||!isFinite(bh.openMin)||!isFinite(bh.closeMin)||bh.closeMin<=bh.openMin) return null;
    if(bh.openMin<=0&&bh.closeMin>=1440) return {closed:false,t:w+' 24時間'};
    const f=m=>m>=1440?'24:00':fmtTime(m);
    return {closed:false,t:w+' '+f(bh.openMin)+'〜'+f(bh.closeMin)};
  }catch(e){ return null; } finally{ setPlanDate(keep); }
}
// 30m以内の場所を1つにまとめる（緯度順に並べて近いものだけ見る）
function groupNear(list){
  const out=[], used=new Uint8Array(list.length), idx=list.map((s,i)=>i).sort((a,b)=>(list[a].latitude-list[b].latitude)||(a-b));
  for(let a=0;a<idx.length;a++){
    const i=idx[a]; if(used[i]) continue; used[i]=1; const s=list[i], g=[s];
    for(let b=a+1;b<idx.length;b++){
      const j=idx[b], t=list[j]; if(t.latitude-s.latitude>0.0003) break;
      if(used[j]||Math.abs(t.longitude-s.longitude)>0.0004) continue;
      if(haversineKm(s.latitude,s.longitude,t.latitude,t.longitude)<=SAME_KM){ used[j]=1; g.push(t); }
    }
    out.push(g);
  }
  return out;
}
function drawPins(m,list,extra){
  const cg=clusterGroup(), al=L.layerGroup();
  let nDim=0, nGroup=0;
  groupNear(list).forEach(g=>{
    g.sort((a,b)=>(dimOf(a)-dimOf(b))||(tierRank(a)-tierRank(b)));
    const s=g[0], dim=g.every(x=>dimOf(x)), cls=(s.__temp?'me':'')+(dim?' rest':'');   // v5：休みは .rest（画面を暗くする幕 .scrim とは別の名前）
    if(dim) nDim++; if(g.length>1) nGroup++;
    const lab=shortName(s.name)+(g.length>1?' ほか'+(g.length-1):'');
    const mk=L.marker([s.latitude,s.longitude],{icon:pinIcon(s,cls,lab,g.length),title:g.map(x=>x.name).join('／'),keyboard:false,zIndexOffset:(g.some(x=>x.tier==='S')?600:0)});   // v5：休みのピンも沈めない（薄くするだけ）
    mk.on('click',()=>{ if(g.length>1) openGroup(g); else openCard(g[0]); });
    if(g.some(x=>x.tier==='S'||x.__temp)) al.addLayer(mk); else cg.addLayer(mk);
  });
  (extra||[]).forEach(x=>al.addLayer(x));
  cg.addTo(m); al.addTo(m);
  return {cg,al,nDim,nGroup};
}
function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:false,maxZoom:18,minZoom:8,tap:false});
  tiles(map);
  map.setView([state.origin.lat,state.origin.lng],CLUSTER_OFF_ZOOM);
  map.on('click',()=>{ if(E.q&&!E.sugOff){ E.sugOff=true; renderSug(); } if(!$('card').classList.contains('hidden')) closeCard(); });   // 地図の何もないところを押したらカードを閉じる
  map.on('zoomend moveend',()=>{ schedLabels(); saveView(); });
  // 指で動かしたときは markercluster が描き直す。プログラムで遠くへ飛んだとき（viewreset）は markercluster の表示が古いまま残ることがあるので、ピンを描き直す
  map.on('viewreset',schedRedraw);
  E.map=map;   // 確認用
}
let redrawRaf=0;
function schedRedraw(){ if(redrawRaf) return; redrawRaf=requestAnimationFrame(()=>{ redrawRaf=0; refresh({noSug:true}); }); }
/* 名前ラベル：ズーム15以上（v4）。重なったら手前（z-index の大きい）ほうだけ出す */
let lblRaf=0;
function schedLabels(){ if(lblRaf) return; lblRaf=requestAnimationFrame(()=>{ lblRaf=0; placeLabels(); }); }
function placeLabels(){
  if(!map) return;
  const el=$('map'), on=map.getZoom()>=LABEL_ZOOM; el.classList.toggle('lblon',on); if(!on) return;
  const mr=el.getBoundingClientRect();
  const a=[...el.querySelectorAll('.leaflet-marker-icon.pinw .lbl')];
  a.forEach(x=>x.classList.remove('hide'));
  const it=a.map(x=>({x,r:x.getBoundingClientRect(),z:+(x.parentNode.style.zIndex||0)})).filter(o=>o.r.width&&o.r.right>mr.left&&o.r.left<mr.right&&o.r.bottom>mr.top&&o.r.top<mr.bottom);
  it.sort((u,v)=>v.z-u.z);
  const kept=[];
  it.forEach(o=>{ const r=o.r; if(kept.some(k=>r.left<k.right+2&&r.right>k.left-2&&r.top<k.bottom+1&&r.bottom>k.top-1)) o.x.classList.add('hide'); else kept.push(r); });
}
/* プランから戻ったとき・開き直したときに同じ表示にする（このタブの中だけ・30分） */
const VIEW_KEY=pkey('odemaru_erabu_view_v1'), VIEW_MAX_MS=30*60*1000;
function saveView(){ if(!map||E.shared) return; try{ const c=map.getCenter(); sessionStorage.setItem(VIEW_KEY,JSON.stringify({lat:+c.lat.toFixed(5),lng:+c.lng.toFixed(5),z:map.getZoom(),mode:E.mode,f:E.f,o:state.origin.name,ts:Date.now()})); }catch(e){} }
function loadView(){ try{ const v=JSON.parse(sessionStorage.getItem(VIEW_KEY)||'null'); if(!v||!(Date.now()-v.ts<VIEW_MAX_MS)||v.o!==state.origin.name||!isFinite(v.lat)||!isFinite(v.lng)||!isFinite(v.z)) return null; return v; }catch(e){ return null; } }
function currentPool(){
  let a=SPOTS.filter(s=>s.latitude!=null&&s.longitude!=null&&matchE(s));
  if(E.q) a=a.filter(s=>hit(s,E.q));
  return a;
}
function myList(){
  if(E.mode!=='play') return [];
  let a=myPlaces().map(x=>tempSpot(x.n,x.lat,x.lng,x.addr)).filter(s=>isFinite(s.latitude)&&isFinite(s.longitude));

}
function refresh(opt){
  opt=opt||{};
  const t0=performance.now();
  const pool=currentPool(), mine=myList();
  E.pool=pool; E.sorted=E.q?sortNear(pool):pool; E.mine=mine;
  if(map){
    if(layers){ map.removeLayer(layers.cg); map.removeLayer(layers.al); }
    const ref=refPoint(), extra=[];
    extra.push(L.marker([state.origin.lat,state.origin.lng],{icon:homeIcon(state.origin.name,''),interactive:false,keyboard:false,zIndexOffset:3000}));
    if(opt.fit){   // 先に表示位置を決めてから描く（描き直しを1回にする）
      const pts=(E.q?E.sorted.slice(0,25):[]).map(s=>[s.latitude,s.longitude]).concat((E.q?mine:[]).map(s=>[s.latitude,s.longitude]));
      if(E.q&&pts.length){ pts.push([ref.lat,ref.lng]); map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:14,animate:false}); }
      else map.setView([ref.lat,ref.lng],CLUSTER_OFF_ZOOM,{animate:false});
    }
    layers=drawPins(map,pool.concat(mine),extra);
  }
  if(!opt.noSug) renderSug();
  if(redrawRaf){ cancelAnimationFrame(redrawRaf); redrawRaf=0; }   // いま描いたので、表示位置の変更による描き直しは不要
  E.perf={refreshMs:Math.round((performance.now()-t0)*10)/10,n:pool.length+mine.length,dim:layers?layers.nDim:0,groups:layers?layers.nGroup:0};

}

/* ---------- カード（v4：名前・市区・距離・その日の営業時間・タグ2つまで・午前に行く｜午後に行く・小さなリンク1行「公式サイト」「この場所を送る」） ---------- */
function gmapsSearch(s){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.__temp?(s.latitude+','+s.longitude):(s.name+' '+(s.city||''))); }

const clip=(t,n)=>{ t=String(t||'').replace(/\s+/g,' ').trim(); return t.length>n?t.slice(0,n)+'…':t; };
// v4：カードに出すのは、その日の営業時間（hoursInfo・読めるときだけ1行）だけ。料金・駐車場・授乳／おむつの行はやめた

// v4：カードのタグは最大2つ。あそぶは「無料」「雨でもOK」。v5：水あそび・乗り物もタグで出す（ピンの絵にはしない）ので、あそぶは最大3つ
function cardTags(s){

// ズームは変えない。ピンがカード（または地図の上端・左右）に隠れるときだけ、見える所までずらす
function keepVisible(s,animate){

  const band=Math.max(120,(cr.height?cr.top:mr.bottom)-mr.top), W=mr.width;
  const p=map.latLngToContainerPoint([s.latitude,s.longitude]);
  const top=p.y-58, bottom=p.y+(map.getZoom()>=LABEL_ZOOM?24:8), M=12;

}

/* ---------- 雨の予報の日は「☔雨でもOK」を最初からON（外すのは1タップ）。天気はエンジンの fetchWeather／isRainMode ---------- */
async function mapWeather(){
  const k=mapWhen(), key=(k==='today'?'t'+ymd(today0()):k)+'@'+state.origin.name;
  if(key in E.wx) return E.wx[key];
  if(!E.main) state.when=k;   // プランを組む前だけ（組むときは prep() が state.when を入れ直す）
  let w=null; try{ w=await fetchWeather(); }catch(e){ w=null; }

/* ---------- 「午前に行く」「午後に行く」→ 年齢 → プラン ---------- */

/* v5：夕方以降（きょうのプランが組めない、またはきょう組むと出発が15時以降）は、先に「きょう／あす／週末」を選んでもらう（1タップ） */
const LATE_START=15*60;
function needWhenAsk(){

    +o.map(x=>'<button class="opt bigw" data-act="ask" data-k="'+x.k+'"><span class="tx"><b>'+x.lab+'</b><small>'+dateLabel(x.d)+'</small></span><span class="go">›</span></button>').join('')+'</div>';

function openAge(){ document.querySelectorAll('#ageSheet .age').forEach(b=>b.classList.toggle('on',state.ages.has(b.dataset.age))); $('ageGo').disabled=!state.ages.size; openBS('ageSheet'); }
// その日に主役へ行けるか（休館日・きょうは着いた時点で閉まっている）。行けない日は黙って次の日にする
function okOn(main,when){
  if(!main||main.__temp) return true;
  const sv=E.when; E.when=when; prep();
  try{
    const d=targetDate(when);
    if(isClosedOn(main,d)) return false;
    if(when==='today'){ const arr=startMinutes()+(driveMinutesFrom(state.origin,main)||30), bh=parseBusinessHours(main,d); if(bh&&arr>=bh.closeMin-45) return false; }   // 着いたときにもう閉まる

}
function closedOn(s,when){   // 休館日だけを見る（午後に行くの日付選び）
  if(!s||s.__temp) return false;

}
function nextOkWhen(main,from){
  const t=today0(); let start=from==='today'?0:Math.max(0,Math.round((targetDate(from)-t)/864e5));
  for(let i=start;i<start+8;i++){ const k=i===0?'today':dk(addDays(t,i)); if(i===0&&!todayPlanAvailable()) continue; if(okOn(main,k)) return k; }
  return from;
}
function dayKeysFrom(from){   // from（きょう／d:YYYYMMDD）から8日分
  const t=today0(), s0=from==='today'?0:Math.max(0,Math.round((targetDate(from)-t)/864e5)), a=[];
  for(let i=s0;i<s0+8;i++){ if(i===0&&!todayPlanAvailable()) continue; a.push(i===0?'today':dk(addDays(t,i))); }

}
/* v5：日付が自動で変わったときの「ひとこと」（プラン画面の見出しの下に1回だけ） */
function isTomorrowKey(k){ return k!=='today'&&ymd(targetDate(k))===ymd(addDays(today0(),1)); }
function dayMsg(P,req,fin,why){
  if(!req||!fin||req===fin) return null;
  const fd=targetDate(fin), fl=(isTomorrowKey(fin)?'あす ':'')+dateLabel(fd);
  const rd=req==='today'?today0():targetDate(req);
  if(why!=='late'&&P&&closedOn(P,req)){
    // 毎週のお休み（1週間後の同じ曜日も休み）なら「月曜は」、そうでなければ日付で
    const wk=closedOn(P,dk(addDays(rd,7)));
    return (wk?WDJ[rd.getDay()]+'曜':(req==='today'?'きょう':dateLabel(rd)))+'はお休みなので、'+dateLabel(fd)+'にしました';
  }

// 午前に行く：選んだ場所をメインにして、お昼と午後を組む（これまでと同じ）
async function planAm(main){
  E.main=main; E.L=undefined; E.S=undefined; E.userL=false; E.userS=false; E.fixedStart=null; E.shared=false; E.pmAuto=false; E.sw=null;
  const req=E.when||'today'; let why=null;
  if(!E.when||(E.when==='today'&&!todayPlanAvailable())){ E.when=defaultWhen(); if(E.when!=='today') why='late'; }
  if(!okOn(main,E.when)){ if(E.when==='today'&&!closedOn(main,'today')) why='late'; E.when=nextOkWhen(main,E.when); }
  await ensureWeather();
  let p=compose();
  if(E.when==='today'&&p.retHome&&p.retHome>capHomeFor(state.ages)){   // きょうだと帰宅上限を超える → 次に行ける日
    const k=nextOkWhen(main,dk(addDays(today0(),1))); if(k!==E.when){ E.when=k; why='late'; await ensureWeather(); compose(); }
  }

/* 午後に行く：選んだ場所 P を午後の枠に固定し、午前の遊び場とお昼を P の近くで組む。
   ・午前の遊び場 … buildPool()（エンジンの主役候補：年齢・雨・休館・開館時刻・帰宅上限で絞り、点数順）のうち P から車で20分以内（3件未満なら近い順8件）。
     車で5分・10分・15分・20分以内の4段に分け、同じ段の中は点数順
   ・お昼 … lunchCandidates(午前の遊び場)（エンジンのお昼候補）のうち、遊び場→お店→P の寄り道が少ない順に3件まで
   ・組み立ては buildPlan(午前,date,w,{lunch,sub:P})（compose() 経由で、開館前に着くときの出発調整も同じ）
   ・採用するのは P が「午後」の行に入り、帰宅上限（capHomeFor）と移動合計の上限（generatePlans と同じ 130／190分）に収まり、お昼が11:00以降になる案だけ
   乱数は「P の名前＋|pm」で固定。組めなければ false（呼び出し側が黙って次の日を試す） */
function pmLunches(M,P){
  let c=[]; try{ c=lunchCandidates(M,targetDate(state.when))||[]; }catch(e){ c=[]; }
  c=c.filter(s=>s!==P&&s.name!==P.name);
  const det=s=>legMinutes(M.latitude,M.longitude,s.latitude,s.longitude)+legMinutes(s.latitude,s.longitude,P.latitude,P.longitude);
  return c.map((s,i)=>({s,i,d:det(s)})).sort((a,b)=>(a.d-b.d)||(a.i-b.i)).slice(0,3).map(x=>x.s);
}
const PM_LUNCH_MIN=11*60;
function pmLimits(){ const onlyT=state.ages.has('0-2')&&state.ages.size===1; return {kidCap:capHomeFor(state.ages),driveLimit:onlyT?130:190}; }
function pmOk(p,M,L,P){
  const v=view3(p), lim=pmLimits();
  if(!v.m||v.m.spot!==M) return false;
  if(!v.s||v.s.spot!==P) return false;
  if(L==='bento'){ if(!v.b) return false; } else if(!v.l||v.l.spot!==L) return false;
  const lt=v.l?v.l.time:v.b.time; if(lt<PM_LUNCH_MIN) return false;   // お昼が11時より前になる組み方（午前の場所の滞在が短い）はとらない
  if(lim.kidCap&&p.retHome&&p.retHome>lim.kidCap) return false;
  if(p.totalDrive!=null&&p.totalDrive>lim.driveLimit) return false;
  return true;
}
function pmTry(M,P){
  const tryL=L=>{ E.main=M; E.L=L; E.S=P; E.userL=true; E.userS=true; E.shift=0; let p; try{ p=compose(); }catch(e){ return false; } return pmOk(p,M,L,P); };
  E.shift=0; prep();
  const ls=pmLunches(M,P);
  for(const L of ls){ if(tryL(L)) return true; }
  if(!ls.length&&tryL('bento')) return true;   // 近くにお店が1軒も無いときだけお弁当
  return false;
}
function saveParts(){ return {main:E.main,L:E.L,S:E.S,userL:E.userL,userS:E.userS,shift:E.shift,plans:(state.plans||[]).slice(),variant:state.variant}; }
function restoreParts(x){ E.main=x.main; E.L=x.L; E.S=x.S; E.userL=x.userL; E.userS=x.userS; E.shift=x.shift; state.plans=x.plans; state.variant=x.variant; }
function pmBuild(P){
  const saved=saveParts();
  const date=targetDate(E.when);
  E.fixedStart=null; E.shift=0; prep();
  let pool=[];
  const _rm=window.recentMains;
  try{
    window.recentMains=function(){ return []; };   // このブラウザの履歴で候補の順が変わらないように（同じ場所なら同じ中身）
    pool=withSeed(P.name+'|pm',()=>buildPool(date,state.weather))||[];
  }catch(e){ pool=[]; } finally{ window.recentMains=_rm; }
  pool=pool.filter(s=>s!==P&&s.name!==P.name&&isPlay(s)&&!isSamePlace(s,P,1.0));
  const leg=s=>legMinutes(s.latitude,s.longitude,P.latitude,P.longitude);
  // 近い順の4段（車で5分・10分・15分・20分以内）に分け、同じ段の中はエンジンの点数順（buildPool の並び）
  const band=s=>{ const m=leg(s); return m<=5?0:(m<=10?1:(m<=15?2:3)); };
  let near=pool.map((s,i)=>({s,i})).filter(x=>leg(x.s)<=20).sort((a,b)=>(band(a.s)-band(b.s))||(a.i-b.i)).map(x=>x.s);
  if(near.length<3) near=pool.map((s,i)=>({s,i,k:haversineKm(s.latitude,s.longitude,P.latitude,P.longitude)})).sort((a,b)=>(a.k-b.k)||(a.i-b.i)).slice(0,8).map(x=>x.s);
  for(const M of near.slice(0,10)){ if(pmTry(M,P)) return true; }
  restoreParts(saved);
  return false;
}
async function planPm(P){

  const w0=E.when;

    if(closedOn(P,k)) continue;

  }

}
/* v13：お昼にここへ行く：選んだお店 L をお昼に固定し、午前の遊び場を L の近くで選ぶ（午後はエンジンが組む）。
   ・午前の遊び場 … buildPool() のうち L から車で20分以内（5・10・15・20分の4段、同じ段は点数順）。3件未満なら近い順8件
   ・採用するのは L がお昼の行に入り、お昼が11:00〜13:30、帰宅上限と移動合計の上限（午後に行くと同じ）に収まる案だけ

const LU_MIN=11*60, LU_MAX=13*60+30;
function luOk(p,M,L){

function luBuild(L){

  let near=pool.map((s,i)=>({s,i})).filter(x=>leg(x.s)<=20).sort((a,b)=>(band(a.s)-band(b.s))||(a.i-b.i)).map(x=>x.s);
  if(near.length<3) near=pool.map((s,i)=>({s,i,k:haversineKm(s.latitude,s.longitude,L.latitude,L.longitude)})).sort((a,b)=>(a.k-b.k)||(a.i-b.i)).slice(0,8).map(x=>x.s);
  for(const M of near.slice(0,10)){

async function planLu(L){

async function pmFeasible(P,k){   // その日に「午後に行く」で組めるか（中身は変えない。日付の選択肢に使う）

async function startPlan(P,slot){

/* ⭐ の行の「🗺 マップで選び直す」：マップに戻る（表示位置・あそぶ/たべる・条件ボタンは backToMap が前回のまま戻す。検索欄の文字だけ消す）。

const SW_MORE=5;

function swMore(){

/* ---------- 共有（日付と出発時刻を固定で持たせる。sl=午前/午後） ---------- */
window.buildShareUrl=function(p){
  const v=view3(p), o=state.origin, enc=encodeURIComponent;
  const parts=['share=1','from='+enc(o.name)];
  if(o.name==='現在地'){ parts.push('lat='+o.lat.toFixed(5),'lng='+o.lng.toFixed(5)); }
  parts.push('age='+enc([...state.ages].join(',')));
  const m=v.m?v.m.spot:E.main;
  const tp=x=>x.name+'~'+(+x.latitude).toFixed(5)+'~'+(+x.longitude).toFixed(5);   // 自分の場所は「名前~緯度~経度」
  if(m.__temp) parts.push('main=_t','mt='+enc(tp(m)));
  else parts.push('main='+enc(m.name));
  if(v.l){ const l=v.l.spot; if(l.__temp) parts.push('lunch=_t','lt='+enc(tp(l))); else parts.push('lunch='+enc(l.name)); }
  else if(v.b) parts.push('lunch=_b'); else parts.push('lunch=_n');
  if(v.s){ const s=v.s.spot; if(s.__temp) parts.push('sub=_t','st='+enc(tp(s))); else parts.push('sub='+enc(s.name)); }
  try{ eng3SharePush(p,parts); }catch(e){}   // v6：エンジンと同じ nl=1（お昼なし）・fo=1（無料）・sm/ss（滞在の分）
  const long=location.origin+location.pathname+'?'+parts.join('&');
  const t=v.start, hhmm=String(Math.floor(t/60)).padStart(2,'0')+String(t%60).padStart(2,'0');
  const pin=pinOf(v);
  const u=shortShareUrl(long)+'&d='+ymd(targetDate(state.when))+'&t='+hhmm+(pin?'&sl='+(pin==='sub'?'pm':(pin==='lunch'?'lu':'am')):'');   // 既存の短縮形式＋日付・出発時刻・午前/午後
  E.lastShare=u;
  return u;
};
window.sharePlan=async function(){
  const p=currentPlanObj(); if(!p) return;
  const url=buildShareUrl(p), text=dateLabel(targetDate(state.when))+'のおでかけプラン（おでまる）';
  if(navigator.share){ try{ await navigator.share({title:'おでかけプラン',text,url}); }catch(e){} return; }
  try{ await copyToClipboard(url); showToast('リンクをコピーしました'); }catch(e){ showToast('コピーできませんでした'); }
};
function parseShared(){
  const raw=new URLSearchParams(location.search);
  if(raw.get('s')!=='1'&&raw.get('share')!=='1') return null;
  const d=raw.get('d')||'', t=raw.get('t')||'';
  if(!/^\d{8}$/.test(d)||!/^\d{4}$/.test(t)) return null;
  const qs=shareExpandQs(raw);   // f/a/m/l/u を名前に戻す（既存の短縮URLの復元）
  const tmp=(k)=>{ const a=String(qs.get(k)||raw.get(k)||'').split('~'); if(a.length<3) return null; const lng=+a.pop(), lat=+a.pop(), n=a.join('~'); return (n&&isFinite(lat)&&isFinite(lng))?tempSpot(n,lat,lng,''):null; };
  const spot=(v,k)=>v==='_t'?tmp(k):(SPOTS.find(s=>s.name===v)||null);
  const main=spot(qs.get('main'),'mt'); if(!main) return null;
  const from=qs.get('from')||HOME_CITY;
  let o=null;
  if(from==='現在地'&&qs.has('lat')&&qs.has('lng')) o=sanitizeOrigin({name:'現在地',lat:parseFloat(qs.get('lat')),lng:parseFloat(qs.get('lng'))});   // 県外の座標は使わない
  if(!o) o=cityOrigin(from)||cityOrigin(HOME_CITY);
  const ages=(qs.get('age')||'').split(',').filter(a=>['0-2','3-5','elem'].includes(a));
  const lv=qs.get('lunch');
  const L0=lv==='_b'?'bento':(lv==='_n'||!lv?null:spot(lv,'lt'));
  const S0=qs.get('sub')?spot(qs.get('sub'),'st'):null;
  const sl=raw.get('sl');
  let e3={}; try{ e3=eng3ShareOpts(qs).e3||{}; }catch(e){ e3={}; }   // v6：nl・fo・sm・ss（エンジンと同じ読み方）
  return {o,ages,d,start:(+t.slice(0,2))*60+(+t.slice(2)),main,L:L0,S:S0,sl:(sl==='pm'||sl==='am'||sl==='lu')?sl:null,e3};
}

/* ---------- v5：共有画像の見出しと共有の文言を実際の日付に（エンジンの共有画像は「きょうの」固定の文字列なので、このページの中だけで差しかえる） ----------
   ・見出し：canvas の fillText に「きょうのおでかけプラン」が来たら「9/27（日）のおでかけプラン」にして、幅に入るよう文字を小さくする
   ・文言：navigator.share に渡る text の先頭の「きょうのおでかけプラン」を同じく差しかえる */
const shareTitle=()=>dateLabel(targetDate(state.when))+'のおでかけプラン';
(function(){
  try{
    const P=CanvasRenderingContext2D.prototype, ft=P.fillText;
    P.fillText=function(t,x,y,mw){
      if(t==='きょうのおでかけプラン'&&this.canvas&&this.canvas.width===1080){
        const nt=shareTitle(), f0=this.font, room=this.canvas.width-x-64;
        let w=this.measureText(nt).width;
        if(w>room){ const m=/(\d+(?:\.\d+)?)px/.exec(f0); if(m){ const px=Math.floor(+m[1]*room/w); this.font=f0.replace(m[0],px+'px'); } }
        try{ return ft.call(this,nt,x,y); } finally{ this.font=f0; }
      }
      return mw===undefined?ft.call(this,t,x,y):ft.call(this,t,x,y,mw);
    };
  }catch(e){}
  try{
    const ns=navigator.share;
    if(typeof ns==='function'){
      Object.defineProperty(navigator,'share',{configurable:true,writable:true,value:function(d){
        try{ if(d&&typeof d.text==='string'&&/^きょうのおでかけプラン/.test(d.text)) d=Object.assign({},d,{text:d.text.replace(/^きょうのおでかけプラン/,shareTitle())}); }catch(e){}
        return ns.call(navigator,d);
      }});
    }
  }catch(e){}
})();

    const v=view3(currentPlanObj());
    if(pinOf(v)==='sub'){ E.pmAuto=false; E.sw=null; E.main=sp; const x=partsOf(currentPlanObj()); E.L=x.L; E.S=x.S; E.userL=true; E.userS=true; compose(); renderPlan(); }
    else if(pinOf(v)==='lunch'){ E.main=sp; E.L=v.l.spot; E.userL=true; E.S=null; E.userS=false; compose(); renderPlan(); }   // v13
    else { await planAm(sp); renderPlan(); }
  }
  else if(f==='sub'||f==='lunch'){ ga('erabu_change',{slot:f,to:'myplace'}); setSlot(f,sp); }
  else {   // 検索欄から：その場所のカード（午前に行く／午後に行く）を出す
    if(E.mode!=='play'){ E.mode='play'; setModeClass(); renderChips(); }
    clearQ(); refresh(); openCard(sp);
  }
}

/* ---------- v5：マークの見かた（地図の隅の「？」。見本 icons/legend.png のとおり） ---------- */
const KIND_ONE={park:'公園・広場・水あそび場など外あそび',indoor:'屋内のあそび場・キッズスペース・工作など',jidokan:'児童館・子どもセンター（無料が多い）',animal:'動物園・ふれあい広場・水族館',vehicle:'電車の博物館・交通公園・遊園地',science:'科学館・プラネタリウム・防災館など',book:'美術館・郷土資料館・図書館など',food:'子連れで入りやすい、町のお店',chain:'ファミレスなど、おなじみのチェーン店'};
function openLegend(){
  const li=(pin,b,sm,cls)=>'<div class="li'+(cls||'')+'">'+pin+'<div class="tx"><b>'+b+'</b><small>'+sm+'</small></div></div>';
  $('legBody').innerHTML=['park','indoor','jidokan','animal','vehicle','science','book','food','chain'].map(k=>li('<span class="lpin">'+pinSvg(k)+'</span>',KIND_NAME[k],KIND_ONE[k])).join('')
    +li('<span class="lpin home">'+pinSvg('home')+'</span>','出発地','ここから近い順・車の時間を出します',' sm')
    +li('<span class="lpin">'+pinSvg('myplace')+'</span>','自分の場所','自分で追加した場所',' sm')
    +li('<span class="lpin rest">'+pinSvg('park')+'</span>','うすいピン','選んだ日はお休みの場所（押せます）',' sm last');
  openBS('legSheet'); ga('erabu_legend',{});
}

/* ---------- 操作 ---------- */
function bind(){
  document.querySelector('.mode').addEventListener('click',e=>{ const b=e.target.closest('button[data-m]'); if(!b||b.dataset.m===E.mode) return; E.mode=b.dataset.m; ga('erabu_mode',{mode:E.mode}); setModeClass(); renderChips(); closeCard(); refresh(); });
  $('srow').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const k=b.dataset.f; E.f[k]=!E.f[k]; E.fTouched=true; b.classList.toggle('on',E.f[k]); b.setAttribute('aria-pressed',E.f[k]?'true':'false'); closeCard(); refresh(); });
  let qt=null;
  $('q').addEventListener('input',()=>{ clearTimeout(qt); qt=setTimeout(()=>{ E.q=$('q').value.trim(); E.sugOff=false; $('qClr').classList.toggle('hidden',!E.q); closeCard(); refresh({fit:true}); },200); });
  $('q').addEventListener('focus',()=>{ if(E.q&&E.sugOff){ E.sugOff=false; renderSug(); } });
  $('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('q').blur(); } });
  $('qClr').addEventListener('click',e=>{ e.preventDefault(); clearQ(); closeCard(); refresh({fit:true}); });
  $('sug').addEventListener('click',e=>{ const a=e.target.closest('[data-add]'); if(a){ openAdd(E.q,null); return; } const b=e.target.closest('.item[data-i]'); if(!b) return; const s=spotFromData(b.dataset.i); if(s) openCard(s); });
  $('card').addEventListener('click',e=>{
    const gi=e.target.closest('[data-gi]'); if(gi&&E.selG){ const x=E.selG[+gi.dataset.gi]; if(x) openCard(x); return; }
    const b=e.target.closest('[data-act]'); if(!b) return; const s=E.sel;
    if(b.dataset.act==='close') closeCard();
    else if(b.dataset.act==='send') shareSpot(s);
    else if(b.dataset.act==='am') go(s,'am');
    else if(b.dataset.act==='lu'){ ga('erabu_pick',{mode:E.mode,kind:pickKind(s),tier:s.tier||'',pick_for:'',slot:'lunch'}); go(s,'lu'); }
    else if(b.dataset.act==='pm'){ ga('erabu_pick',{mode:E.mode,kind:pickKind(s),tier:s.tier||'',pick_for:'',slot:'pm'}); go(s,'pm'); }
  });
  $('originPick').innerHTML='<option value="__here">現在地（いまいる場所）</option>'+CITIES.map(c=>'<option>'+esc(c[0])+'</option>').join('');
  $('originPick').addEventListener('change',()=>{
    const v=$('originPick').value;
    if(v==='__here'){ useHere(); return; }
    const o=cityOrigin(v); if(!o) return;
    __hereOut=false; __hereExpired=false; E.originFromLink=false;
    setOrigin(o); savePrefsKeep(); dropSavedHere();
  });
  // 年齢
  $('ageSheet').addEventListener('click',e=>{ const b=e.target.closest('.age'); if(!b) return; const a=b.dataset.age; if(state.ages.has(a)) state.ages.delete(a); else state.ages.add(a); b.classList.toggle('on',state.ages.has(a)); $('ageGo').disabled=!state.ages.size; });
  $('ageGo').addEventListener('click',()=>{ if(!state.ages.size) return; savePrefsKeep(); closeBS(); const x=E.pending; E.pending=null; if(x) proceed(x.s,x.slot); });
  // プラン
  $('planBack').addEventListener('click',()=>{ if(history.state&&history.state.erabu==='plan') history.back(); else backToMap(); });   // 戻る（スワイプ・ブラウザの戻る）と同じ動き
  window.addEventListener('popstate',()=>{ if($('vPlan').classList.contains('on')) backToMap(); });
  $('rows').addEventListener('click',e=>{
    const c=e.target.closest('[data-sw]'); if(c){ pickSw(+c.dataset.sw); return; }
    const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
    if(a==='main'||a==='sub'||a==='lunch') openSw(a);
    else if(a==='repick') repick(b.dataset.slot);
    else if(a==='nosub'){ ga('erabu_change',{slot:'sub',to:'none'}); setSlot('sub',null); }
    else if(a==='swmore') swMore();
    else if(a==='swclose'){ E.sw=null; renderPlan(); }
    else if(a==='bento'){ ga('erabu_change',{slot:'lunch',to:'bento'}); setSlot('lunch','bento'); }
    else if(a==='mine-lunch') openMine('lunch');
    else if(a==='nolunch'){ ga('erabu_change',{slot:'lunch',to:'none'}); E.noLunch=true; E.sw=null; compose(); renderPlan(); }   // v6：お昼なし（家で食べる）→ 午前だけ
    else if(a==='addlunch'){ ga('erabu_change',{slot:'lunch',to:'add'}); E.noLunch=false; E.sw=null; compose(); renderPlan(); }   // v6：元に戻す
    else if(/^addmine-/.test(a)) openAdd('',a.slice(8));
  });
  $('dateBtn').addEventListener('click',async()=>{
    const pm=E.pin&&E.pin.slot==='pm'&&E.pmAuto&&E.pin.spot;
    const all=whenOpts(); let o0=[];
    if(pm){ for(const x of all){ if(x.k===E.when||await pmFeasible(E.pin.spot,x.k)) o0.push(x); } }   // 午後に行く：その日に組めない日は出さない
    else o0=all.filter(x=>okOn(E.main,x.k)&&!(E.pin&&E.pin.slot==='lu'&&E.pin.spot&&closedOn(E.pin.spot,x.k)));   // 行く場所（お昼に選んだお店も）がお休みの日は出さない
    const o=o0.length?o0:all;
    $('optBody').innerHTML='<h2>いつ行く？</h2><div class="opts">'+o.map(x=>'<button class="opt'+(x.k===E.when?' on':'')+'" data-act="when" data-k="'+x.k+'"><span class="tx"><b>'+x.lab+'</b><small>'+dateLabel(x.d)+'</small></span></button>').join('')+'</div>';
    openBS('optSheet');
  });
  $('shareBtn').addEventListener('click',()=>{
    let img=false; try{ img=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([''],'x.png',{type:'image/png'})]})); }catch(e){}
    ga('erabu_share',{method:img?'image':'link'});
    // v5：エンジンは渡したボタンの文字を textContent で書きかえる（アイコンが消え、⏳ が出る）ので、ボタンは渡さずにこちらで表示する
    const bt=$('shareBtn'); if(bt.disabled) return;
    const h0=bt.innerHTML; bt.disabled=true; bt.innerHTML=ic('send')+'画像を作っています…';
    Promise.resolve().then(()=>typeof window.sharePlanImage==='function'?window.sharePlanImage(null):sharePlan()).catch(()=>{}).then(()=>{ bt.disabled=false; bt.innerHTML=h0; });
  });
  $('optSheet').addEventListener('click',async e=>{
    const b=e.target.closest('[data-act],[data-close]'); if(!b) return;
    if(b.hasAttribute('data-close')){ closeBS(); return; }
    const a=b.dataset.act, i=+b.dataset.i;
    if(a==='when'){ closeBS(); if(b.dataset.k!==E.when){ E.when=b.dataset.k; E.whenChosen=true; ga('erabu_change',{slot:'date',to:whenKind()}); await replan(); } }
    else if(a==='ask'){ closeBS(); const x=E.pending; E.pending=null; E.when=b.dataset.k; E.whenChosen=true; ga('erabu_change',{slot:'date',to:whenKind(),ask:1}); if(x) startPlan(x.s,x.slot); }
    else if(/^addmine-/.test(a)){ closeBS(); openAdd('',a.slice(8)); }
    else if(/^usemine-/.test(a)){ const slot=a.slice(8), s=E.mineOpts[i]; closeBS(); if(!s) return; ga('erabu_change',{slot,to:'myplace'}); setSlot(slot,s); }
  });
  $('addSheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeBS(); });
  $('legSheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeBS(); });
  $('legBtn').addEventListener('click',openLegend);
  $('addGo').addEventListener('click',doAdd);
  ['addName','addAddr'].forEach(id=>$(id).addEventListener('input',()=>$(id).classList.remove('bad')));
  $('dim').addEventListener('click',()=>{ closeBS(); E.pending=null; });
  window.addEventListener('resize',layout);
}

/* ---------- 起動 ---------- */
function init(){
  initPrefs();
  bind();
  const sh=parseShared();
  if(sh){ showShared(sh); ga('erabu_open',{shared:1}); window.__ERABU_READY=true; return; }
  restoreHere();
  const sp=spotFromUrl(), v=sp?null:loadView();
  if(sp&&!E.hadOrigin&&state.origin.name!=='現在地'){ const fo=spotFromOrigin(); if(fo){ state.origin=fo; E.originFromLink=true; } }   // v5：保存済みの出発地が無ければ送った人の出発地
  syncLoc();
  if(v){ E.mode=v.mode==='eat'?'eat':'play'; E.f=(v.f&&typeof v.f==='object')?v.f:{}; E.fTouched=true; }   // プラン→戻る・開き直し：前の表示に戻す
  if(sp){ E.mode=isEat(sp)?'eat':'play'; if(sp.is_jidokan===true) E.f.jidokan=true; }                    // 送られてきた場所：そのカードを開く
  setModeClass(); renderChips();
  show('vMap'); initMap(); layout();
  if(sp){ map.setView([sp.latitude,sp.longitude],SPOT_ZOOM,{animate:false}); refresh(); openCard(sp,{noAnim:true}); }
  else if(v){ map.setView([v.lat,v.lng],v.z,{animate:false}); refresh(); }
  else refresh({fit:true});
  autoRain(sp);
  ga('erabu_open',sp?{shared:0,spot:1}:{shared:0});
  window.__ERABU_READY=true;
}
try{ init(); }catch(e){ console.error(e); }
})();

</script>
