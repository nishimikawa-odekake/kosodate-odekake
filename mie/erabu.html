<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8HQQDPB5DN"></script>

<title>マップから選ぶ｜みえ子育ておでかけマップ</title>
<meta name="description" content="三重の子連れおでかけスポットを地図から選んで、お昼と午後を自動で組んだ1日プランにします。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e08a5b">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" referrerpolicy="no-referrer">
<style>
:root{--accent:#e08a5b;--accent-d:#c9713f;--food:#D95D77;--food-d:#b8425c;--bg:#faf6ef;--card:#fffdf9;--ink:#3d3a34;--sub:#7a746a;--line:#e7ddcd;--map:#e4e1db;
--animal:#E9A23B;--active:#4CAF6E;--water:#3FA9D6;--create:#9B6DD6;--vehicle:#E06C75;--indoor:#7A8AA0;--chain:#e8853d;--pm:#54709f;--topH:48px;--ctlH:104px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
.view{position:fixed;inset:0;display:none;background:var(--bg)}
.view.on{display:block}
.hidden{display:none!important}
.odm-brand{display:none}
/* ヘッダー */
.top{position:absolute;left:0;right:0;top:0;height:var(--topH);display:flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;background:var(--card);border-bottom:1px solid var(--line);z-index:900}
.home{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 6px;text-decoration:none;color:var(--ink);font-size:16px;font-weight:800;white-space:nowrap}
.home .ar{color:var(--accent-d);font-size:20px}
.imk{display:inline-block;width:24px;height:24px;background:url(/odemaru-mark.png) center/contain no-repeat;flex:none}
.iwv{display:inline-block;background:url(/odemaru-wave.png) center/contain no-repeat;flex:none}
.loc{position:relative;margin-left:auto;display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--accent-d);font-size:15px;font-weight:800;white-space:nowrap;max-width:190px;overflow:hidden}
.loc span{overflow:hidden;text-overflow:ellipsis}
.loc select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.back{min-height:44px;padding:0 8px;color:var(--accent-d);font-size:16px;font-weight:800;white-space:nowrap}
.wx{margin-left:auto;font-size:15px;color:var(--sub);white-space:nowrap;padding-right:6px}
/* 操作帯 */
.ctl{position:absolute;left:0;right:0;top:var(--topH);height:var(--ctlH);background:var(--bg);padding:6px 12px;z-index:800;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.mode{display:flex;height:44px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:0;flex:none}
.mode button{flex:1;height:44px;border-radius:999px;font-size:15px;font-weight:800;color:var(--sub)}
.mode button.on[data-m=play]{background:var(--accent-d);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mode button.on[data-m=eat]{background:var(--food);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.srow{display:flex;gap:6px;align-items:center;height:44px;flex:none;min-width:0}
.search{position:relative;display:flex;align-items:center;height:44px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);padding:0 0 0 10px;flex:1 1 auto;min-width:0}
/* 入力中は追加欄を横いっぱいに（条件ボタンは入力が終わると戻る） */
.search:focus-within~#chips .chip{display:none}
.search input{flex:1;height:44px;font-size:16px;background:none;outline:0;min-width:0;width:100%}
.search input::placeholder{color:var(--accent-d);font-weight:700;opacity:1}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:44px;height:44px;font-size:17px;color:var(--sub);flex:none}
.chip{flex:none;height:44px;min-width:44px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;white-space:nowrap;padding:0 8px;letter-spacing:-.05em}
.chip.on{background:var(--accent-d);color:#fff;border-color:transparent}
.eat .chip.on{background:var(--food)}
/* 地図 */
.map{position:absolute;left:0;right:0;background:var(--map)}
#map{top:calc(var(--topH) + var(--ctlH));bottom:0;z-index:0}
.leaflet-container{font:inherit;background:var(--map)}
.leaflet-control-attribution{font-size:15px!important;line-height:1.3;padding:1px 6px!important;background:rgba(255,255,255,.75)!important;color:var(--sub)}
.pinw{background:none;border:none}
.pin{position:relative;width:44px;height:51px}
/* v5：ピンは pin-*.svg（しずく型＋白い線画）。休みの日は薄くするだけ（.rest。画面を暗くする幕は .scrim で別の名前） */
.pin .pg{display:block;width:44px;height:51px;overflow:visible}
.pin.sel .pg{filter:drop-shadow(0 0 2px rgba(201,113,63,1)) drop-shadow(0 0 5px rgba(201,113,63,.85))}
.pin.rest{opacity:.45;filter:saturate(.35)}
.pinw .cnt{position:absolute;right:-8px;top:-10px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#fff;color:var(--ink);border:2px solid var(--accent-d);font-size:15px;line-height:20px;font-style:normal;font-weight:800;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* 名前ラベル（ズーム15以上。押せる要素ではないので12px。v5：v3 と同じ白い箱に戻す） */
.pinw .lbl{display:none;position:absolute;top:51px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;color:#3d3a34;background:rgba(255,255,255,.92);padding:0 5px;border-radius:6px;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#map.lblon .pinw .lbl{display:block}
#map.lblon .pinw .lbl.hide{visibility:hidden}
.pinw .pin.rest~.lbl{opacity:.6}
.clw{background:none;border:none}
.cl{width:100%;height:100%;border-radius:50%;background:var(--accent-d);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 5px rgba(201,113,63,.28),0 2px 6px rgba(0,0,0,.3)}
.eat .cl{background:var(--food);box-shadow:0 0 0 5px rgba(217,93,119,.28),0 2px 6px rgba(0,0,0,.3)}
.homew{background:none;border:none}
.hm{position:relative;width:44px;height:44px}
.hm .pg{display:block;width:44px;height:44px;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hm i{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:var(--accent-d);color:#fff;font-size:15px;font-style:normal;font-weight:800;white-space:nowrap;padding:1px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.hm.star{border-color:var(--food)}.hm.star i{background:var(--food)}
.grab{flex:none;height:26px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab i{width:46px;height:5px;border-radius:9px;background:#d8ccb9}
/* 検索欄の候補（地図の上に重ねる） */
.sug{position:absolute;left:8px;right:8px;top:calc(var(--topH) + var(--ctlH) + 4px);max-height:calc(100% - var(--topH) - var(--ctlH) - 20px);overflow-y:auto;background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:890;padding:0 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:76px;padding:8px;border-bottom:1px solid var(--line)}
.item .e{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item b{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tg{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}
.tag{font-size:15px;line-height:1.35;background:#fff3ea;color:var(--accent-d);border:1px solid #f3cdb3;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.eat .tag,.ftag{background:#fdeef1;color:var(--food-d);border-color:#f3c3ce}
.item .go{flex:none;color:#b9ae9e;font-size:22px}
.item.me .e{background:#6b5ea8}
.item.add{border:2px dashed #d8ccb9;border-radius:16px;margin:8px 0;justify-content:center;font-size:16px;font-weight:800;color:var(--accent-d);min-height:60px}
/* カード（v3：画面の3分の1ほど） */
.card{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.2);z-index:870;padding:12px 16px calc(8px + env(safe-area-inset-bottom));max-height:48%;overflow-y:auto;overscroll-behavior:contain}
.card .x{position:absolute;right:4px;top:4px;width:44px;height:44px;font-size:20px;color:var(--sub)}
.card .hd{display:flex;gap:10px;align-items:center;padding-right:38px}
.card .hd .e{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px}
.card .ht{min-width:0}
.card h2{font-size:18px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:15px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:15px;line-height:1.45;margin-top:6px}
.card .facts .hr{font-weight:800;color:#2f7d4f;margin-right:2px;white-space:nowrap}
.card .facts .hr.off{color:var(--food-d)}
.card .facts .tag{padding:0 8px}
.primary{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:999px;background:var(--accent);color:#fff;font-size:19px;font-weight:800;box-shadow:0 4px 12px rgba(201,113,63,.35);text-decoration:none}
.primary.food{background:var(--food);box-shadow:0 4px 12px rgba(217,93,119,.35)}
.gorow{display:flex;gap:10px;margin-top:10px}
.gorow .primary{flex:1 1 0;margin-top:0!important;padding:0 6px;white-space:nowrap;height:48px;font-size:16px}
.primary.pm{background:var(--pm);box-shadow:0 4px 12px rgba(84,112,159,.35)}
.card .primary{margin-top:10px;height:52px;font-size:18px}
.card .gorow .primary{margin-top:0;height:48px;font-size:16px}
.subs{display:flex;justify-content:space-between;gap:4px;margin-top:2px}
.subs a,.subs button{flex:none;display:flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 6px;background:none;border:0;font-size:15px;font-weight:700;color:var(--accent-d);text-decoration:none;white-space:nowrap}
.glist{display:flex;flex-direction:column;margin-top:6px}
.gi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;padding:6px 4px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi .e{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.gi.rest .e{opacity:.45;filter:saturate(.35)}
.gi .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.gi b{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi small{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .go{flex:none;color:#b9ae9e;font-size:22px}
/* 下から出るシート（年齢・変える・日付・追加） */
.scrim{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:950;display:none}
.scrim.on{display:block}
.bs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:960;padding:6px 18px 24px;display:none;max-height:86%;overflow-y:auto}
.bs.on{display:block}
.bs .x{position:absolute;right:8px;top:6px;width:48px;height:48px;font-size:22px;color:var(--sub)}
.bs h2{font-size:21px;padding-right:44px}.bs .q{font-size:15px;color:var(--sub);margin-top:2px}
.bs .hdr{display:flex;align-items:center;gap:10px;margin:4px 0}.bs .hdr .iwv{width:58px;height:62px}
.ages{display:flex;flex-direction:column;gap:10px;margin:12px 0 16px}
.age{height:64px;border-radius:18px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800;display:flex;align-items:center;gap:14px;padding:0 20px;text-align:left}
.age.on{border-color:var(--accent);background:#fff3ea;color:var(--accent-d)}.age.on::after{content:"✓";margin-left:auto;font-size:22px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;text-align:left;padding:8px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.opt .e{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.opt .tx{flex:1;min-width:0;display:flex;flex-direction:column}.opt b{font-size:16px;line-height:1.35}.opt small{font-size:15px;color:var(--sub)}
.opt.on{border-color:var(--accent);background:#fff3ea}
.opt.plain{justify-content:center;font-size:16px;font-weight:800;color:var(--accent-d);min-height:56px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:15px;font-weight:700;color:var(--sub)}
.field input{height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);padding:0 14px;font-size:16px;color:var(--ink);font-weight:400}
.field input.bad{border-color:var(--food)}
.bs .primary{margin-top:16px}
/* プラン（v4：おまかせ plan.html の結果画面と同じ部品 .plancard / .timeline / .tl / .swapbtn / .whybadges / .links。文字15px以上・押せるもの44px以上に拡大） */
.planwrap{position:absolute;top:var(--topH);left:0;right:0;bottom:0;padding:12px 16px 16px;display:flex;flex-direction:column;overflow-y:auto}
.ph2 h1{font-size:24px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.ph2 .date{font:inherit;font-weight:800;color:var(--accent-d);min-height:48px;padding:0 6px 0 0}
.ph2 p{font-size:15px;color:var(--sub)}
.plancard{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px;box-shadow:0 3px 12px rgba(160,140,110,.14);flex:none}
.timeline{position:relative}
.tl{display:flex;gap:10px;padding:0 0 14px;position:relative}
.tl:last-child{padding-bottom:0}
.tl .rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:50px}
.tl .time{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
.tl .icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:3px;background:#fff6ee;border:2px solid var(--accent)}
.tl.move .icon{background:#eef2f6;border-color:#c9d3dd;font-size:16px}
.tl .line{flex:1;width:2px;background:var(--line);margin-top:2px}
.tl:last-child .line{display:none}
.tl .body{flex:1;padding:1px 0 4px;min-width:0}
.tl .sname{font-weight:800;font-size:17px;line-height:1.4;margin:0 0 2px;color:var(--ink);overflow-wrap:anywhere}
.tl.move .sname{font-weight:700;font-size:15px;color:var(--sub)}
.tl.none .sname{color:var(--sub);font-weight:700}
.tl .role{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 4px}
.tl .appeal{font-size:15px;line-height:1.5;color:#5a4632;background:#fff6ee;border-left:3px solid var(--accent);border-radius:5px;padding:5px 8px;margin:4px 0 6px;word-break:break-word}
.tl .meta{font-size:15px;line-height:1.5;color:var(--sub);margin:0 0 4px;word-break:break-word}
.moveline{font-size:15px;color:var(--sub)}
.whybadges{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 4px}
.whybadges .wpill{display:inline-block;font-size:15px;font-weight:700;color:var(--accent-d);background:#fff6ee;border:1px solid var(--accent);border-radius:999px;padding:1px 9px;line-height:1.45}
.tl .links{display:flex;gap:8px;flex-wrap:wrap}
.tl .links a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:700;text-decoration:none;border-radius:999px;padding:0 14px;border:1.5px solid var(--accent);color:var(--accent-d);background:#fff}
/* 🔁 変更する／🗺 マップで選び直す：見た目は plan.html の .swapbtn.sb-inline（押せる範囲は44px） */
.swapbtn{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 2px;margin-left:2px;vertical-align:middle;background:none;border:0;cursor:pointer}
.swapbtn span{display:inline-block;background:#fff;border:1.5px solid var(--accent);color:var(--accent-d);font-weight:800;font-size:15px;line-height:1.3;border-radius:999px;padding:3px 11px;white-space:nowrap}
.swapbtn.on span{background:#fff2e4}
.swapbtn.repick span{background:#f3f6fb;border-color:var(--pm);color:var(--pm)}
.swapbtn:active span{transform:scale(.97)}
.skip{display:block;margin:8px 0 0;height:44px;padding:0 16px;border-radius:999px;border:1.5px dashed #d8ccb9;background:#fff;font-size:15px;font-weight:700;color:var(--sub)}
.tl.open{background:#fff8f2;border-radius:12px}
.big{display:flex;flex-direction:column;gap:10px;margin-top:16px;flex:none}
.share{height:58px;border-radius:999px;background:var(--card);border:2px solid var(--accent);color:var(--accent-d);font-size:18px;font-weight:800}
.note{margin:auto -6px 0;font-size:15px;letter-spacing:-.03em;white-space:nowrap;color:var(--sub);text-align:center;padding-top:12px;flex:none}
.hello{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex:none}.hello .iwv{width:56px;height:60px}.hello p{font-size:17px;font-weight:700;color:var(--accent-d)}
.more2{display:flex;gap:8px;margin:8px 0 0}
.more2 button{flex:1;height:52px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
/* 変えるパネル（おまかせ plan.html の .swapwrap と同じ組み立て。文字15px以上・押せるもの44px以上に拡大） */
.tl .body .swapwrap{margin-left:-60px}
.swapwrap{margin:8px 0 4px;background:#fff8f2;border:1px solid #f0ddc8;border-radius:14px;padding:10px}
.swapwrap .sc-head{font-size:15px;font-weight:800;color:var(--sub);margin:2px 0 4px 2px}
.swapcard{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #eadbc8;border-radius:12px;padding:10px 12px;margin:8px 0;min-height:64px;cursor:pointer}
.swapcard:active{transform:scale(.99)}
.swapcard .sc-name{display:block;font-weight:800;font-size:16px;line-height:1.4;color:var(--ink)}
.swapcard .sc-meta{display:block;font-size:15px;color:var(--sub);margin-top:3px;line-height:1.45}
.swapcard .sc-choose{float:right;background:#fff2e4;color:var(--accent-d);font-size:15px;font-weight:800;border-radius:999px;padding:1px 10px;margin-left:8px}
.swapwrap.eat .swapcard .sc-choose{background:#fdeef1;color:var(--food-d)}
.sc-current{background:#fdf3e7;border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:6px}

.toast.show{opacity:.95}
#shareToast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:15px;font-weight:700;padding:12px 18px;border-radius:999px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
#shareToast.show{opacity:.95}
/* ===== v5：オリジナルの SVG アイコン（i-*.svg。色は文字色） ===== */
.oi{display:inline-block;width:18px;height:18px;vertical-align:-3px;flex:none;margin-right:4px}
.og{display:block;width:24px;height:24px;color:#fff}
.mode button{display:flex;align-items:center;justify-content:center;gap:2px}

.chip{display:inline-flex;align-items:center}
.chip .oi{margin-right:2px}
.sic{display:flex;color:var(--accent-d);margin-right:4px}.sic .oi{width:20px;height:20px;margin:0}
.search{padding-left:8px}
.search .clr{display:flex;align-items:center;justify-content:center}.search .clr .oi{margin:0;width:20px;height:20px}

.hr .oi{width:17px;height:17px;margin-right:3px;vertical-align:-3px}
.x{display:flex;align-items:center;justify-content:center}.x .oi{width:22px;height:22px;margin:0}
.card .hd .e{color:#fff}

.role .oi{width:16px;height:16px;margin-right:2px}
.swapbtn span{display:inline-flex;align-items:center}.swapbtn span .oi{width:16px;height:16px;margin-right:3px}
.wpill{display:inline-flex!important;align-items:center}.wpill .oi{width:16px;height:16px;margin-right:4px}
.more2 button{display:flex;align-items:center;justify-content:center}

.dnote{display:flex;align-items:center;gap:6px;margin-top:6px;padding:7px 12px;border-radius:12px;background:#fff3ea;border:1px solid #f3cdb3;color:var(--accent-d);font-size:15px;font-weight:700;line-height:1.4}

.legq{position:absolute;left:10px;top:calc(var(--topH) + var(--ctlH) + 10px);z-index:780;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.22);font-size:20px;font-weight:800;color:var(--accent-d);display:flex;align-items:center;justify-content:center}
#vMap:not(.on) .legq{display:none}
.leg{margin-top:6px}
/* v7：種類が9つ＋出発地・自分の場所・うすいピンになったので、行の高さを 54→50px（ピン 44px＋上下 3px）にして1画面に収める */

/* ---- 正規化 -------------------------------------------------------------- */
function norm(s){
  s = String(s==null?'':s);
  var out='';
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i), c=s.charCodeAt(i);
    if(c>=0xFF10&&c<=0xFF19) ch=String.fromCharCode(c-0xFEE0);          // ０-９ → 0-9
    else if('（【［〔'.indexOf(ch)>=0) ch='(';
    else if('）】］〕'.indexOf(ch)>=0) ch=')';
    else if('，,；;'.indexOf(ch)>=0)   ch='、';
    else if('～〜－–—ｰ-'.indexOf(ch)>=0) ch='〜';                       // 範囲記号を統一
    else if(ch==='／') ch='/';
    else if(ch==='　') ch=' ';
    else if(ch==='･')  ch='・';
    out+=ch;
  }
  /* 裁定160-1: 範囲記号 ~ (U+007E)。char ループで一律に '〜' へ寄せると
     business_hours の「月~金曜日 9:00-12:00」まで曜日範囲として読めるようになり、
     別規則（平日限定営業）が新たに発火して休が増える。今回の裁定は日付範囲の件なので、
     **直前が数字始まりの日付トークン・直後が数字** の形に限って範囲記号に寄せる。 */
  out = out.replace(/([0-9][0-9日月旬末年\/() \t]{0,8})~(?=[ \t]{0,3}[0-9])/g, '$1〜');
  /* 裁定160-1: 「12月29日 – 1月3日」のように範囲記号の左右へ空白を入れた表記。
     – (U+2013) / — (U+2014) は上のループで '〜' になるが、splitTop の弱区切り（空白）で
     範囲が単発日付 2 つにちぎれていた。**数字…〜…数字 の形に限って** 空白を畳む。
     曜日範囲「月 〜 金」や時刻「9時 〜 17時」は直前が数字でないので対象外（従来どおり）。 */
  out = out.replace(/([0-9][ \t]*[日月]?)[ \t]*〜[ \t]*(?=[0-9])/g, '$1〜');
  return out;
}

  var re=new RegExp('(第\\s*['+NUMC+']+)\\s*[・、]\\s*(?=第?\\s*['+NUMC+'])','g');
  var prev=null;
  while(prev!==t){ prev=t; t=t.replace(re,'$1'); }
  /* 「5月・10月の…」「4〜6月・9〜11月は…」の月リストも節分割で壊さない */
  var re3=/([0-9]{1,2}\s*月)\s*[・、]\s*(?=[0-9]{1,2})/g;

/* 強区切り: 、 。 / 改行 ※  (「12/29」の / は数字に挟まれるので区切らない)
   弱区切り: ・ & 空白  → セグメント内の並列。極性（休/営業）はセグメント単位で決める */
function splitTop(text, strong){
  var out=[], buf='', depth=0;
  for(var i=0;i<text.length;i++){
    var ch=text.charAt(i);
    if(ch==='(') { depth++; buf+=ch; continue; }
    if(ch===')') { depth=Math.max(0,depth-1); buf+=ch; continue; }
    var isSep=false;
    if(depth===0){
      if(strong){
        if(ch==='、'||ch==='。'||ch==='\n'||ch==='※') isSep=true;
        else if(ch==='/'){
          var p=text.charAt(i-1), n=text.charAt(i+1);
          if(!(/[0-9]/.test(p)&&/[0-9]/.test(n))) isSep=true;
        }
      }else{
        if(ch==='・'||ch==='&'||ch==='＆'||ch===' ') isSep=true;
      }
    }
    if(isSep){ if(buf.trim()) out.push(buf.trim()); buf=''; }
    else buf+=ch;
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

         return 'MONTHDAY'; }
  m=p.match(new RegExp('(['+WDS+'])曜?日?\\s*〜\\s*(['+WDS+'])曜?日?'));
  if(m && !/[0-9]/.test(p)){
    var cw=parseConds(condsRaw,'WEEKDAY');
    expandRange(m[1],m[2],function(w){ spec.weekly.push({wd:w,conds:cw,src:p,only:only}); });
    return 'WEEKDAY_RANGE';
  }
  /* 「7月第一月曜日〜水曜日」＝ 7月の第1月曜から同じ週の水曜までの連続した日。
     第1火・第1水（＝その月で最初の火曜・水曜）とは別物なので連続区間として持つ。 */
  m=p.match(new RegExp('第\\s*(['+NUMC+'][^'+WDS+']{0,12}?)\\s*週?\\s*(['+WDS+'])曜?日?\\s*〜\\s*(['+WDS+'])曜?日?'));
  if(m){
    var nsr=nthList(m[1]);
    if(nsr.length){
      spec.nthSpan.push({wd:m[2], endWd:m[3], nth:nsr, conds:parseConds(condsRaw,'NTH'), src:p, only:only});
      return 'NTH_SPAN';
    }
  }
  m=p.match(new RegExp('第\\s*(['+NUMC+'][^'+WDS+']{0,12}?)\\s*週?\\s*(['+WDS+'])曜?日?'));
  if(m){
    var ns=nthList(m[1]);
    if(ns.length){ spec.nth.push({wd:m[2], nth:ns, conds:parseConds(condsRaw,'NTH'), src:p, only:only,
                                  par:parityOf(p)||parityOf(seg)}); return 'NTH'; }
  }
  m=p.match(new RegExp('(最終|最後の)\\s*(['+WDS+'])曜?日?'));
  if(m){ spec.nth.push({wd:m[2], nth:['last'], conds:parseConds(condsRaw,'NTH'), src:p, only:only,
                       par:parityOf(p)||parityOf(seg)}); return 'NTH_LAST'; }
  if(/土日祝|土日|週末|土・日/.test(p)){
    spec.weekend={conds:parseConds(condsRaw,'WEEKEND'), src:p};
    if(/祝/.test(p)) spec.holiday={conds:parseConds(condsRaw,'HOLIDAY'), src:p};
    return 'WEEKEND';
  }
  if(/^日祝/.test(p)||/日・祝/.test(p)){
    spec.sunday={src:p};
    spec.holiday={conds:parseConds(condsRaw,'HOLIDAY'), src:p};
    return 'SUN_HOL';
  }
  m=p.match(new RegExp('(?:^|[^第0-9])(['+WDS+'])曜'));
  if(m && !new RegExp('第\\s*[0-9]\\s*週?\\s*'+m[1]).test(p)){
    spec.weekly.push({wd:m[1], conds:parseConds(condsRaw,'WEEKDAY'), src:p, only:only,
                      par:parityOf(p)}); return 'WEEKDAY';
  }
  var bare0=p.replace(/^[^：:]{0,10}[：:]/,'').replace(/^(毎週|毎)/,'');
  var bare=bare0.replace(/(定休日?|休館日?|休園日?|休所日?|休業日?|休み|休|日)+$/,'');
  if(!bare) bare=bare0;                      // 「日」だけの節を消してしまわない
  if(bare.length===1 && WDS.indexOf(bare)>=0){
    spec.weekly.push({wd:bare, conds:parseConds(condsRaw,'WEEKDAY'), src:p, only:only}); return 'WEEKDAY_BARE';
  }
  if(RE_HOLHOST.test(p) && !/翌|直後|振替日/.test(p)){
    spec.holiday={conds:parseConds(condsRaw,'HOLIDAY'), src:p}; return 'HOLIDAY';
  }
  var bare2=p.replace(/(定休日?|休館日?|休園日?|休業日?|休み|休|のみ)+$/,'');
  if(bare2==='平日'){ spec.weekdaysMonFri={conds:parseConds(condsRaw,'WEEKDAY'), src:p}; return 'WEEKDAYS'; }
  /* v3.1-⑥: 西暦付きの絶対期間（年またぎ・「◯月末」）。
     「2026年6月から2027年1月末(予定)まで休館」(id=129 あいち航空ミュージアム) */
  var ar=parseAbsRanges(p);
  if(ar.length){
    for(var ai=0;ai<ar.length;ai++) pushRange(spec, ar[ai], p, 'abs', POL);   // 裁定157/166
    return 'ABS_RANGE';
  }
  /* v3.1-⑤: 月中境界（上旬=1-10 / 中旬=11-20 / 下旬=21-末） */
  var sr=parseSpanRanges(p);
  if(sr.length){
    for(var sj=0;sj<sr.length;sj++) pushRange(spec, sr[sj], p, 'span', POL);  // 裁定157/166
    return 'SPAN_RANGE';
  }
  /* 「11月24日以降平日」のように終端が書かれていない形は範囲が決まらない。
     単独日付として誤読せず、未解析に落として旧実装のフォールバックに委ねる（裁定⑱）。 */
  if(/以降|以後|前後|頃|ごろ|中旬|上旬|下旬/.test(p)) return null;
  var rr=parseRanges(p);
  if(rr.length){ for(var i=0;i<rr.length;i++) pushRange(spec, rr[i], p, 'md', POL); return 'DATE_RANGE'; }   // 裁定157/166
  /* 裁定166-2: 「11月〜4月(冬期休館)」「12月〜3月は休館」「利用期間は4月から10月まで」
     のように月だけで書かれた範囲。**範囲の直近に極性語（開設/開館/営業/開園/開場/利用/
     開催 ＝期間内open ・ 休館/休園/閉鎖/閉館/休業/休止 ＝期間内closed）があるときに限り**
     月初・月末で補完する。極性語の無い裸の月範囲（「12月〜3月」「11月〜4月」）は
     従来どおり採らない＝未解析→unknown のまま（裁定158「裸の範囲の扱いを変えない」）。 */
  var mrP=parseMonthOnlyRanges(p);
  if(mrP.length && !RE_NOCLOSE2.test(p) && !RE_HEDGE2.test(p)){   // 裁定167
    /* 括弧の中に極性語がある形（「11月〜4月(冬期休館)」）を読むため、
       近傍文脈だけは括弧を残した節全体 seg から取り直す。範囲そのものは p 由来。 */
    var mrS=parseMonthOnlyRanges(seg==null?p:seg), got=false, mi, mk;
    for(mi=0;mi<mrP.length;mi++){
      var nr=mrP[mi].near;
      for(mk=0;mk<mrS.length;mk++)
        if(mrS[mk].r[0]===mrP[mi].r[0] && mrS[mk].r[2]===mrP[mi].r[2]){ nr=mrS[mk].near; break; }
      if(RE_NOCLOSE2.test(nr) || RE_HEDGE2.test(nr)) continue;   // 裁定167
      if(rangePolarity(nr)==null) continue;
      pushRange(spec, mrP[mi].r, p, 'md', nr);
      got=true;
    }
    if(got) return 'MONTH_RANGE';
  }
  /* 監督A MAJOR-1(A): 範囲でない単独の実日付（「12月31日」「1月1日のみ」「3/31」） */
  var sd=parseSingleDates(p);
  if(sd.length){ for(var j=0;j<sd.length;j++) pushRange(spec, sd[j], p, 'md', POL); return 'DATE'; }   // 裁定157/166
  return null;
}

/* ---- 評価 ---------------------------------------------------------------- */
function nthOfMonth(d){ return Math.floor((d.getDate()-1)/7)+1; }
function isLastOfMonth(d){ var n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()+7>n; }
function condExceptsHoliday(c, date){
  if(!c) return false;
  var nm=holName(date);
  if(nm && c.exceptHolidayNames.indexOf(nm)>=0) return true;
  if(c.exceptHolidayMD.indexOf((date.getMonth()+1)+'/'+date.getDate())>=0) return true;
  if(c.exceptWeekdays.indexOf(date.getDay())>=0) return true;
  return false;
}
function monthExcluded(c,date){ return !!(c && c.exceptMonths.indexOf(date.getMonth()+1)>=0); }

function evalSpec(spec, s, date, OPT){
  OPT = OPT||DEFAULT_OPT;
  var dow=date.getDay(), tw=WD[dow], isWeekend=(dow===0||dow===6);
  var isHol=isHolDate(date);
  var i,r;

  if(spec.noClosure) return {closed:false, reason:'無休の記載'};
  /* v3: 「※8月12日(水)は開館」型の単発開館日は、どの休業規則よりも優先して開ける */
  if(spec.openMDGlobal && spec.openMDGlobal.length &&
     spec.openMDGlobal.indexOf((date.getMonth()+1)+'/'+date.getDate())>=0)
    return {closed:false, reason:'単発の開館日が明記されている'};
  /* 裁定④: 解決できた営業宣言の期間内では、曜日由来・振替由来の休を打ち消す */
  var openSpan = inOpenSpan(spec, date);

  if(spec.obon){
    var orange = (OPT.nenmatsuFromData!==false && spec.obon.ranges) || [[8,12,8,16]];
    var omd=(date.getMonth()+1)+'/'+date.getDate();
    if(!(spec.obon.openMD&&spec.obon.openMD.indexOf(omd)>=0))
      for(i=0;i<orange.length;i++) if(inMDRange(date,orange[i]))
        return {closed:true, reason:'お盆休（節「'+spec.obon.src+'」）'};
  }
  if(spec.newyear){
    var nrange = (OPT.nenmatsuFromData!==false && spec.newyear.ranges) || [OPT.nenmatsuNarrow?[12,29,1,3]:[12,28,1,4]];
    var nmd=(date.getMonth()+1)+'/'+date.getDate();
    if(!(spec.newyear.openMD&&spec.newyear.openMD.indexOf(nmd)>=0))
      for(i=0;i<nrange.length;i++) if(inMDRange(date,nrange[i]))
        return {closed:true, reason:'年末年始（節「'+spec.newyear.src+'」/ 窓 '+nrange[i].join('-')+'）'};
  }
  if(OPT.dateRange){
    /* v3.1-⑥: 西暦付きの絶対期間（長期休館など）。毎年繰り返させない */
    for(i=0;i<spec.absRanges.length;i++) if(inAbsRange(date,spec.absRanges[i].r))
      return {closed:true, reason:'長期休館の期間（節「'+spec.absRanges[i].src+'」）'};
    for(i=0;i<spec.ranges.length;i++) if(inMDRange(date,spec.ranges[i].r))
      return {closed:true, reason:'明示日付範囲（節「'+spec.ranges[i].src+'」）'};
    /* 裁定157: 開設・営業期間として書かれた範囲は、その *外* が休み */
    for(i=0;i<(spec.openRanges||[]).length;i++){
      var orr=spec.openRanges[i];
      var inside = orr.abs ? inAbsRange(date,orr.r) : inMDRange(date,orr.r);
      if(!inside) return {closed:true, reason:'開設期間外（節「'+orr.src+'」）'};
    }
  }
  for(i=0;i<spec.weekly.length;i++){
    r=spec.weekly[i];
    if(r.wd!==tw) continue;
    if(monthExcluded(r.conds,date)) continue;
    if(r.only && r.only.indexOf(date.getMonth()+1)<0) continue;
    if(!parityOk(r.par,date)) continue;
    if(isHol && (r.conds.holidayOpen||spec.globalHolidayOpen)) continue;
    if(openSpan) continue;
    return {closed:true, viaWeekday:true, reason:'毎週'+r.wd+'曜が定休（節「'+r.src+'」）'};
  }
  for(i=0;i<spec.nth.length;i++){
    r=spec.nth[i];
    if(r.wd!==tw) continue;
    if(monthExcluded(r.conds,date)) continue;
    if(r.only && r.only.indexOf(date.getMonth()+1)<0) continue;
    if(!parityOk(r.par,date)) continue;
    var hit=false;
    for(var k=0;k<r.nth.length;k++){
      if(r.nth[k]==='last'){ if(isLastOfMonth(date)) hit=true; }
      else if(r.nth[k]===nthOfMonth(date)) hit=true;
    }
    if(!hit) continue;
    if(isHol && (r.conds.holidayOpen||spec.globalHolidayOpen)) continue;
    if(openSpan) continue;
    return {closed:true, viaWeekday:true, reason:'第'+r.nth.join('・').replace('last','最終')+r.wd+'曜が定休（節「'+r.src+'」）'};
  }
  /* ---- v3.1-①: 第N曜への振替 --------------------------------------------
     「第３金曜日（祝日・休日の場合は開館し、第4金曜日に休館します。）」(id=15)。
     当日が振替先の第N曜で、かつ**同じ月の**ホスト第N曜が祝日のときだけ休。
     ホストが祝日でない月は何も起きない（第4金曜は開く）。                     */
  for(i=0;i<spec.nth.length;i++){
    r=spec.nth[i];
    if(!r.conds || !r.conds.substNth) continue;
    var swd=r.conds.substNthWd||r.wd;
    if(swd!==tw) continue;
    if(nthOfMonth(date)!==r.conds.substNth) continue;
    if(monthExcluded(r.conds,date)) continue;
    if(r.only && r.only.indexOf(date.getMonth()+1)<0) continue;
    if(!parityOk(r.par,date)) continue;
    var wi3=WDS.indexOf(r.wd), hostHol=false;
    if(wi3<0) continue;
    var f3=1, fd3=new Date(date.getFullYear(),date.getMonth(),1);
    while(fd3.getDay()!==wi3){ fd3=new Date(date.getFullYear(),date.getMonth(),++f3); }
    for(var hk=0;hk<r.nth.length;hk++){
      var hn=r.nth[hk];
      var hday=(hn==='last') ? (f3+Math.floor((new Date(date.getFullYear(),date.getMonth()+1,0).getDate()-f3)/7)*7)
                             : (f3+(hn-1)*7);
      var hd=new Date(date.getFullYear(),date.getMonth(),hday);
      if(hd.getMonth()===date.getMonth() && isHolDate(hd)) hostHol=true;
    }
    if(!hostHol) continue;
    if(openSpan) continue;
    return {closed:true, viaWeekday:true,
            reason:'第'+r.conds.substNth+swd+'曜への振替休（第'+r.nth.join('・').replace('last','最終')+
                   r.wd+'曜が祝日 / 節「'+r.src+'」）'};
  }
  /* 第N曜を起点にした連続区間（「7月第一月曜日〜水曜日」） */
  for(i=0;i<spec.nthSpan.length;i++){
    r=spec.nthSpan[i];
    if(r.only && r.only.indexOf(date.getMonth()+1)<0) continue;
    if(monthExcluded(r.conds,date)) continue;
    var wi=WDS.indexOf(r.wd), span=(WDS.indexOf(r.endWd)-wi+7)%7;
    if(wi<0) continue;
    var first=1; var fd=new Date(date.getFullYear(),date.getMonth(),1);
    while(fd.getDay()!==wi){ fd=new Date(date.getFullYear(),date.getMonth(),++first); }
    var sHit=false;
    for(var sk=0;sk<r.nth.length;sk++){
      var nn=r.nth[sk]; if(nn==='last') continue;
      var startDay=first+(nn-1)*7;
      if(date.getDate()>=startDay && date.getDate()<=startDay+span) sHit=true;
    }
    if(!sHit) continue;
    if(isHol && (r.conds.holidayOpen||spec.globalHolidayOpen)) continue;
    if(openSpan) continue;
    return {closed:true, viaWeekday:true, reason:'第'+r.nth.join('・').replace('last','最終')+r.wd+'曜〜'+r.endWd+'曜が休（節「'+r.src+'」）'};
  }
  /* v3: 振替休の逆算。ホスト日 H（定休曜日・第N曜）が祝日のとき、
     substKind（翌日／翌平日＝直後の休日でない日）で求めた振替先が当日なら休。
     nextWeekday は連休で複数日先になりうるので、直近 10 日を遡ってホストを探す。 */
  for(var back=1; back<=10; back++){
    var H=new Date(date.getFullYear(),date.getMonth(),date.getDate()-back);
    if(!isHolDate(H)) continue;
    var hw=WD[H.getDay()];
    for(i=0;i<spec.weekly.length;i++){
      r=spec.weekly[i];
      var k1=r.conds.substKind || (spec.substituteAny &&
              (!spec.substituteWd || spec.substituteWd===r.wd) ? spec.substituteKind : null);
      if(!k1) continue;
      if(r.wd!==hw) continue;
      if(r.only && r.only.indexOf(H.getMonth()+1)<0) continue;
      if(!parityOk(r.par,H)) continue;
      var tgt1=resolveSubst(k1,H);
      if(!tgt1 || tgt1.getTime()!==date.getTime()) continue;
      if(openSpan) continue;
      /* v3.1-②: 「祝日の場合は翌日」で振替先そのものが祝日。公式に規定がないので断定しない */
      if(k1==='next' && isHol)
        return {unknown:true, reason:'振替先の'+(date.getMonth()+1)+'/'+date.getDate()+
                'も祝日で、公式に規定がない（'+(H.getMonth()+1)+'/'+H.getDate()+'の'+r.wd+
                '曜が祝日 / 節「'+r.src+'」）'};
      return {closed:true, viaWeekday:true,
              reason:'祝日振替休（'+(H.getMonth()+1)+'/'+H.getDate()+'の'+r.wd+'曜が祝日 / '+
                     (k1==='nextWeekday'?'直後の休日でない日':'翌日')+' / 節「'+r.src+'」）'};
    }
    for(i=0;i<spec.nth.length;i++){
      r=spec.nth[i];
      var k2=r.conds.substKind || (spec.substituteAny &&
              (!spec.substituteWd || spec.substituteWd===r.wd) ? spec.substituteKind : null);
      if(!k2) continue;
      if(r.wd!==hw) continue;
      if(r.only && r.only.indexOf(H.getMonth()+1)<0) continue;
      if(!parityOk(r.par,H)) continue;
      var nhit=false;
      for(var nk=0;nk<r.nth.length;nk++){
        if(r.nth[nk]==='last'){ if(isLastOfMonth(H)) nhit=true; }
        else if(r.nth[nk]===nthOfMonth(H)) nhit=true;
      }
      if(!nhit) continue;
      var tgt2=resolveSubst(k2,H);
      if(!tgt2 || tgt2.getTime()!==date.getTime()) continue;
      if(openSpan) continue;
      /* v3.1-②: 振替先そのものが祝日。公式に規定がないので断定しない */
      if(k2==='next' && isHol)
        return {unknown:true, reason:'振替先の'+(date.getMonth()+1)+'/'+date.getDate()+
                'も祝日で、公式に規定がない（節「'+r.src+'」）'};
      return {closed:true, viaWeekday:true,
              reason:'祝日振替休（'+(H.getMonth()+1)+'/'+H.getDate()+'が第'+r.nth.join('・').replace('last','最終')+r.wd+'曜の祝日 / 節「'+r.src+'」）'};
    }
  }
  /* v3: 「毎月1日（土日祝の場合は翌平日）」「毎月末日」等 */
  for(i=0;i<spec.monthDays.length;i++){
    r=spec.monthDays[i];
    if(r.only && r.only.indexOf(date.getMonth()+1)<0) continue;
    var lastD=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
    var hostDay=(r.day==='last')?lastD:r.day;
    if(hostDay>lastD) continue;
    var MH=new Date(date.getFullYear(),date.getMonth(),hostDay);
    var mk=r.conds&&r.conds.substKind, eff=MH;
    if(mk && (MH.getDay()===0||MH.getDay()===6||isHolDate(MH))){
      var sh=resolveSubst(mk,MH); if(sh) eff=sh; else continue;
    }
    if(eff.getTime()!==date.getTime()) continue;
    if(openSpan) continue;
    return {closed:true, reason:'毎月'+(r.day==='last'?'末日':r.day+'日')+'が休（節「'+r.src+'」）'};
  }
  var y=new Date(date.getFullYear(),date.getMonth(),date.getDate()-1);
  if(isHolDate(y)){
    if(OPT.afterHoliday && spec.afterHoliday){
      var ah=spec.afterHoliday, ok=true;
      /* 「祝日直後の平日」「祝日の翌平日」は平日にしか効かない */
      if((/平日/.test(ah.src) || (ah.conds && /平日/.test(ah.conds.raw||''))) &&
         (dow===0||dow===6||isHol)) ok=false;
      /* 括弧の除外（「土日祝は開館」「土・日曜、祝日を除く」） */
      if(ok && condExceptsHoliday(ah.conds,date)) ok=false;
      if(ok && ah.conds && ah.conds.exceptSelfHoliday && isHol) ok=false;
      /* 適用範囲が書かれていない節は、既定では土日祝に効かせない */
      if(ok && !OPT.afterHolidayOnWeekend){
        var bare = !(ah.conds && (ah.conds.exceptSelfHoliday || ah.conds.exceptWeekdays.length));
        if(bare && (dow===0||dow===6||isHol)) ok=false;
      }
      if(ok) return {closed:true, reason:'祝日の翌日（節「'+ah.src+'」）'};
    }
  }
  if(isHol && spec.holiday){
    if(!condExceptsHoliday(spec.holiday.conds,date))
      return {closed:true, reason:'祝日が休（節「'+spec.holiday.src+'」）'};
  }
  if(isWeekend && spec.weekend) return {closed:true, reason:'土日が休（節「'+spec.weekend.src+'」）'};
  if(dow===0 && spec.sunday)    return {closed:true, reason:'日曜が休（節「'+spec.sunday.src+'」）'};
  if(OPT.weekdayClose && spec.weekdaysMonFri && dow>=1 && dow<=5 && !isHol)
    return {closed:true, reason:'平日が休（節「'+spec.weekdaysMonFri.src+'」）'};
  if(OPT.openOnly && spec.openDays.length && !(spec.weekly.length||spec.nth.length)){
    if(spec.openDays.indexOf(tw)<0 && !(isHol && spec.openDays.indexOf('祝')>=0))
      return {closed:true, reason:'営業曜日('+spec.openDays.join('')+')の補集合'};
  }
  return null;
}

/* ---- 平日限定営業の週末除外（現行 R9 相当・シグナルを曜日別に分けた）--------
   現行は weekendOpen が1本で、「平日 9:00」の"日"や「学校休業日」の"休日"を
   週末営業と誤読しうる。ここでは土・日・祝それぞれのシグナルを分けて持つ。 */
var RE_WEEKDAY_ONLY = /月\s*〜\s*金|平日のみ|平日限定|平日だけ|平日\s*[0-9]/;
function stripNonWeekend(t){
  return t.replace(/学校休業日|学校休業期間|学校休暇|長期休暇|長期休業|夏季休館|冬季休館|臨時休館|臨時休業|休館日|休業日|定休日/g,'\u0001');
}
var RE_SAT_OPEN = new RegExp(['土日','週末','土曜','土祝','土・日','土、日','年中無休','無休',
  '土(?:曜日?)?[^、。/]{0,4}[0-9]{1,2}\\s*[:：時]',       // 「土 9:00」「土曜日 07:00」
  '[(（]\\s*土',                                        // 「10:00〜17:30(土)」
  '\\u0001[^、。/]{0,2}[0-9]{1,2}\\s*[:：時]',            // 「学校休業日 8:00」等
  '\\u0001[^、。/]{0,2}[0-9]{1,2}\\s*時間',
  '休日[^、。/]{0,2}[0-9]{1,2}\\s*[:：時]'].join('|'));
var RE_SUN_OPEN = new RegExp(['土日','週末','年中無休','無休','日祝日?営業','日曜祝日',
  '(?:日曜|日・祝|日、祝|日祝)[^、。/]{0,4}[0-9]{1,2}\\s*[:：時]',
  '[(（]\\s*日','休日[^、。/]{0,2}[0-9]{1,2}\\s*[:：時]'].join('|'));
var RE_HOL_OPEN_BH = new RegExp(['土日祝','年中無休','無休','祝前?日?営業','日祝日?営業',
  '(?:祝日?|日・祝|日祝)[^、。/]{0,4}[0-9]{1,2}\\s*[:：時]',
  '休日[^、。/]{0,2}[0-9]{1,2}\\s*[:：時]'].join('|'));
var RE_HOL_EXPLICIT_CLOSED = /日?祝[^、。]{0,12}(を?除|は?休|閉)/;   // 「日祝…を除き開館」
function weekendOpenSignal(bhTxt, openDays, dow, isHol){
  var t=stripNonWeekend(bhTxt);
  var sat=RE_SAT_OPEN.test(t) || openDays.indexOf('土')>=0;
  var sun=RE_SUN_OPEN.test(t) || openDays.indexOf('日')>=0;
  if(isHol){
    /* 祝日は「土日いずれかが開く」なら開く側に倒す（現行踏襲＝閉を増やさない）。
       ただし business_hours が「日祝を除き開館」等と明記していれば閉のまま。 */
    if(RE_HOL_EXPLICIT_CLOSED.test(t) && !RE_HOL_OPEN_BH.test(t) && openDays.indexOf('祝')<0) return false;
    return sat || sun || RE_HOL_OPEN_BH.test(t) || openDays.indexOf('祝')>=0;
  }
  if(dow===6) return sat;
  if(dow===0) return sun;
  return false;
}

/* =====================================================================
 * v3: 3値判定 judge() — closed / open / unknown
 *   原則1（監督A裁定100）: 誤って「閉」と出すことを最優先で防ぐ。
 *   v2 の「未解析節 → 旧実装フォールバック（閉になりうる）」は廃止し、unknown にする。
 * ===================================================================== */

/* U2: 期間が特定できない営業宣言（GW・お盆・夏休み等）が、この曜日の休を
   打ち消しうるか。曜日を名指ししていれば一致時のみ、していなければ常に該当。 */
function unresolvedOpenBlocks(spec, tw){
  var u=spec.openSpansUnresolved||[], i;
  for(i=0;i<u.length;i++){
    var q=u[i], w=q.match(new RegExp('(['+WDS+'])曜'));
    if(!w) return q;
    if(w[1]===tw) return q;
  }
  return null;
}

/* U4: 「翌々日」等で振替先が確定できない行のうち、直近に祝日ホストがある日だけ unknown。
   （行全体を常時 unknown にすると無関係な曜日まで巻き込むため） */
function substUnknownRelevant(spec, date){
  if(!spec.substUnknown) return false;
  for(var back=1; back<=10; back++){
    var H=new Date(date.getFullYear(),date.getMonth(),date.getDate()-back);
    if(!isHolDate(H)) continue;
    var hw=WD[H.getDay()], i;
    for(i=0;i<spec.weekly.length;i++) if(spec.weekly[i].wd===hw) return true;
    for(i=0;i<spec.nth.length;i++)    if(spec.nth[i].wd===hw)    return true;
  }
  return false;
}

/* U1: 未解析節がこの日付に掛かりうるか。曜日・月・実日付・期間語のいずれかが当日と一致
   するときだけ unknown にする（一致しない行は open のままだが unverified フラグは立てる）。 */
var RE_PERIODWORD = /(年末年始|年始年末|お盆|盆休|GW|ゴールデンウィーク|ゴールデンウイーク)/;
function relevantUnparsed(spec, date){
  var tw=WD[date.getDay()], mo=date.getMonth()+1, md=mo+'/'+date.getDate(), i;
  for(i=0;i<spec.unparsed.length;i++){
    var q=norm(spec.unparsed[i]);
    if(new RegExp(tw+'曜').test(q)) return q;
    if(RE_PERIODWORD.test(q)){
      if(/年末年始|年始年末/.test(q) && inMDRange(date,[12,28,1,4])) return q;
      if(/お盆|盆休/.test(q) && inMDRange(date,[8,12,8,16]))          return q;
      if(/GW|ゴールデンウィーク|ゴールデンウイーク/.test(q) && isGWDate(date)) return q;
      continue;
    }
    var rs=parseRanges(q); for(var j=0;j<rs.length;j++) if(inMDRange(date,rs[j])) return q;
    var sd=parseSingleDates(q); for(j=0;j<sd.length;j++) if(inMDRange(date,sd[j])) return q;
    var ms=monthsFromSubject(q); if(ms.length && ms.indexOf(mo)>=0) return q;
  }
  return null;
}

/* 行が「営業状況が完全には確定していない」か（カードの既存文言 🕐 営業時間は要確認 用） */
function specIsSoft(spec){
  return !!(spec.unparsed.length || spec.substUnknown || (spec.openSpansUnresolved||[]).length
            || (spec.vagueRanges||[]).length);
}
/* 裁定157: 端点が確定しない／極性の書かれていない期間が当日に掛かりうるか */
function vagueRangeRelevant(spec, date){
  var vr=spec.vagueRanges||[], mo=date.getMonth()+1, i;
  for(i=0;i<vr.length;i++){
    if(!vr[i].months.length) continue;
    if(vr[i].months.indexOf(mo)>=0) return vr[i].src;
  }
  return null;
}

function judge(s, date, OPT, cache){
  OPT = OPT||DEFAULT_OPT;
  var cd = s.closed_days||'', bh = s.business_hours||'';
  var spec;
  if(cache){ spec = cache.get(cd); if(!spec){ spec=parseClosedSpec(cd); cache.set(cd,spec); } }
  else spec = parseClosedSpec(cd);
  var dow=date.getDay(), tw=WD[dow], isWeekend=(dow===0||dow===6), isHol=isHolDate(date);
  var soft = specIsSoft(spec);

  var r = evalSpec(spec, s, date, OPT);
  /* v3.1-②: 振替先が確定できない日は closed にしない（裁定100-1） */
  if(r && r.unknown) return {state:'unknown', soft:true, reason:r.reason};
  if(r && r.closed){
    if(r.viaWeekday){
      var uq = unresolvedOpenBlocks(spec, tw);
      if(uq) return {state:'unknown', soft:true,
                     reason:'期間が特定できない季節例外「'+uq+'」が休を打ち消しうる ／ '+r.reason};
    }
    return {state:'closed', soft:soft, reason:r.reason};
  }
  if(substUnknownRelevant(spec, date))
    return {state:'unknown', soft:true, reason:'振替先が確定できない（「翌々日」型）: '+cd.slice(0,40)};
  var up = relevantUnparsed(spec, date);
  if(up) return {state:'unknown', soft:true, reason:'解析できない節「'+up.slice(0,40)+'」が当日に掛かりうる'};

  /* 平日限定営業の週末除外（旧 R9 / v2 の曜日別シグナル版） */
  if(isWeekend||isHol){
    var nb = norm(bh), txt = nb+' '+norm(cd);
    var weekdayOnly = RE_WEEKDAY_ONLY.test(txt) || /^平日(?![はも])/.test(nb.trim());
    if(weekdayOnly && !weekendOpenSignal(nb, spec.openDays||[], dow, isHol))
      return {state:'closed', soft:soft, reason:'平日限定営業（business_hours「'+String(bh).slice(0,28)+'」）'};
  }
  /* 監督A裁定102: 営業曜日だけが書かれている行の補集合は **closed**。
     公式が「開放は火・木のみ」と明示している場合、他曜日は「不確か」ではなく明示された非営業日。
     原則1（不確かなものを閉にしない）とは衝突しない。 */
  if(OPT.openOnly && spec.openDays.length && !hasAnyToken(spec)){
    if(spec.openDays.indexOf(tw)<0 && !(isHol && spec.openDays.indexOf('祝')>=0))
      return {state:'closed', soft:soft,
              reason:'営業曜日('+spec.openDays.join('')+')の補集合（裁定102）'};
  }
  /* 裁定157: 端点が確定しない／極性不明の期間が当日に掛かるなら、開とも閉とも断定しない。
     （曜日定休などの明示的な休はこの手前で closed として確定済み） */
  var vg = vagueRangeRelevant(spec, date);
  if(vg) return {state:'unknown', soft:true,
                 reason:'期間の端点・極性が確定しない節「'+vg.slice(0,40)+'」が当日に掛かりうる'};
  return {state:'open', soft:soft, reason:(r&&r.reason)||'該当する休業規則なし'};
}

var SPEC_CACHE = (typeof Map === 'function') ? new Map() : null;
function judgeCached(s, date){ return judge(s, date, DEFAULT_OPT, SPEC_CACHE); }
function specOf(cd){
  if(SPEC_CACHE){ var v=SPEC_CACHE.get(cd||''); if(!v){ v=parseClosedSpec(cd||''); SPEC_CACHE.set(cd||'',v); } return v; }
  return parseClosedSpec(cd||'');
}
return {judge:judgeCached, judgeRaw:judge, specOf:specOf, rangePolarity:rangePolarity,
        parseClosedSpec:parseClosedSpec, evalSpec:evalSpec, specIsSoft:specIsSoft,
        isHolDate:isHolDate, holName:holName, DEFAULT_OPT:DEFAULT_OPT};
})();

/* ---- 呼び出し側の互換 API -------------------------------------------------
   isClosedOn(s,date) は従来どおり真偽値を返す。**unknown は「閉」にしない**（裁定100-1）。
   unknown / 未解析を含む行は isUnverifiedHours() 経由で既存文言
   「🕐 営業時間は要確認」が出る。新しい文言は増やさない。 */
/* ===== [plan-fix 2026-09-23] 営業期間・月つき曜日休・土日祝のみ の補助判定 =====
   CLOSED_V3.judge（3値判定）の結果が open / unknown のときだけ、下の限定パターンを追加で読む。
   ここで「閉」にできるのは、公式表記が次の形で明示されている場合だけ（原則1: 誤って閉にしない）:
     R1 営業期間: 「7月20日〜8月31日のみ開設」「営業期間 4月1日〜11月末」「開設期間 6月25日から9月7日」
     R2 月つき曜日休: 「10月〜3月 毎週 日・月・水・木・土曜日」「1月〜3月は毎週水曜日」「7月〜10月、12月〜2月」「12月〜3月は閉園」

     R4 「毎月第一月曜日は開館、翌火曜日が休館」
     R5 3値判定が「期間が特定できない季節例外（春休み・夏休み・GW 等）が休を打ち消しうる」で unknown にした行のうち、
        当日がその季節語のどの期間からも十分離れている日（例: 10月の「夏休みは開館」）は、元の曜日休を採る
   主語つきの節（「ランチは」「屋外プールは」「9月は」等）・「不定休」・祝日の例外は閉にしない。 */
var XR_CACHE={};
function xrNorm(t){
  t=String(t==null?'':t);
  var o='';
  for(var i=0;i<t.length;i++){
    var ch=t.charAt(i), c=t.charCodeAt(i);
    if(c>=0xFF10&&c<=0xFF19) ch=String.fromCharCode(c-0xFEE0);
    else if('（【［〔'.indexOf(ch)>=0) ch='(';
    else if('）】］〕'.indexOf(ch)>=0) ch=')';
    else if('～〜－–—~'.indexOf(ch)>=0) ch='〜';
    else if(ch==='：') ch=':';
    else if(ch==='　') ch=' ';
    else if(ch==='，'||ch===',') ch='、';
    else if(ch==='／') ch='/';
    else if(ch==='･') ch='・';
    o+=ch;
  }

}
var XR_RNG='(\\d{1,2})月?(?:(\\d{1,2})日|(上旬|初旬|中旬|下旬))?\\s*〜\\s*(\\d{1,2})月(?:(\\d{1,2})日|(上旬|初旬|中旬|下旬|末日?))?';

  return [a,d1,b,d2];
}
function xrIn(date,r){
  var md=(date.getMonth()+1)*100+date.getDate(), ra=r[0]*100+r[1], rb=r[2]*100+r[3];
  return ra<=rb ? (md>=ra&&md<=rb) : (md>=ra||md<=rb);
}
/* 直前の区切りから範囲の手前までに主語（「〜は」）があるか。年だけの主語（2026年は）は許す */
function xrHasSubject(pre,wide){
  var k=wide?Math.max(pre.lastIndexOf('。'),pre.lastIndexOf('/'),pre.lastIndexOf('※'),pre.lastIndexOf(')'))
            :Math.max(pre.lastIndexOf('、'),pre.lastIndexOf('。'),pre.lastIndexOf('/'),pre.lastIndexOf('('),pre.lastIndexOf('※'),pre.lastIndexOf(')'));
  var cl=pre.slice(k+1).replace(/\d{4}年は?/g,'');
  return /は|夕食|夜|ディナー|朝食|モーニング|ランチ|昼食|駐車|貸室|売店|レストラン/.test(cl);
}
var XR_WDS='日月火水木金土';
function xrParse(s){
  var bh=xrNorm(s.business_hours), cd=xrNorm(s.closed_days), key=bh+'\u0001'+cd+'\u0001'+String(s.name||'');   // [deploy 2026-09-23] R6 の見出し判定が施設名を見るので名前もキーに
  if(XR_CACHE[key]) return XR_CACHE[key];
  var R={periods:[], mwk:[], mclosed:[], wkOnly:null, nthOpen:null, lunchWkOnly:false, openRanges:[], seasonOnly:[], mIrregular:[], designated:false};

    var mo, cdn=cd.replace(/\(/g,'、').replace(/\)/g,'、');

         休みの適用期間（「月曜日（11〜3月のみ）」「11月〜2月のみ金曜日定休」）なので営業期間にしない */
      if(!/(開設|営業|開館|開園|開放|運航|運行|オープン)$/.test(m[0]) && (ti===1 || /[曜休]/.test(t.slice(Math.max(0,m.index-12),m.index)))) continue;

    while((m=re.exec(t))){
      var pre=t.slice(0,m.index), k=Math.max(pre.lastIndexOf('、'),pre.lastIndexOf('。'),pre.lastIndexOf('/'),pre.lastIndexOf(')'));

    re=new RegExp(XR_RNG+'の?(?:限定)?(?:営業|開設|開園)期間外は?(?:休業|休園|休み)','g');
    while((m=re.exec(t))){ var r3=xrRange(m,1); if(r3) R.periods.push(r3); }
    /* R6 季節限定（「春季限定運航」「夏季のみ営業」）。主語つき（「屋外プールは夏季」）は採らない */
    re=/(春季|春期|夏季|夏期|秋季|秋期|冬季|冬期)(?:限定|のみ)(?:の)?(?:運航|運行|営業|開園|開館|開設|オープン)?/g;
    while((m=re.exec(t))){ if(xrHasSubject(t.slice(0,m.index),false)) continue;
      /* [deploy 2026-09-23] 節の頭に見出し（例「流水プール 10:00〜16:00（夏季のみ）」）があり、施設名にその語が無ければ一部施設の話なので採らない */
      var pre6=t.slice(0,m.index), k6=Math.max(pre6.lastIndexOf('。'),pre6.lastIndexOf('/'),pre6.lastIndexOf('※'),pre6.lastIndexOf('、'),pre6.lastIndexOf('\n'));
      var lab6=(pre6.slice(k6+1).trim().match(/^([^\d\s(:]{2,})/)||[])[1]||'';
      if(lab6 && !/^(春|夏|秋|冬)/.test(lab6) && String(s.name||'').indexOf(lab6.replace(/[はの]$/,''))<0) continue;

    while((m=re.exec(t))){

      if(xrHasSubject(pre3,true)) continue;
      if(/\d{1,2}月/.test(pre3.slice(Math.max(pre3.lastIndexOf('、'),pre3.lastIndexOf('/'),pre3.lastIndexOf('('))+1))) continue;
      /* [deploy 2026-09-23] 営業時間欄に平日・曜日の営業も書かれていれば（「バイキング 土日祝限定／ランチ食堂 平日 11:00〜」）一部門の話なので採らない */
      if(ti===0 && /平日|[月火水木金]曜/.test(t.slice(0,m.index)+' '+t.slice(m.index+m[0].length))) continue;
      R.wkOnly={hol:/祝/.test(m[0]), src:m[0]};

/* ===== weather ===== */
// 雨モードの主判定は weather code。降水確率が高いだけでは雨モードにしない。
// 区分は index.html の wxEmoji() と同一基準:
//   0=☀️ / 1-2=🌤 / 3=☁️ / 45-48=🌫 … 通常モード
//   51-67,80-82=🌧 / 71-77,85-86=❄️ / 95以上=⛈ … 雨モード(雪は雨天相当で屋内優先)
function isRainCode(c){ return c!=null && c>=51; }
async function fetchWeather(){
  try{
    const o=state.origin;
    const url='https://api.open-meteo.com/v1/forecast?latitude='+o.lat+'&longitude='+o.lng+
      '&daily=weather_code,temperature_2m_max,precipitation_probability_max&hourly=precipitation_probability,weather_code&timezone=Asia%2FTokyo&forecast_days=7';
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(t);
    if(!r.ok) return null;
    const j=await r.json();
    const td=targetDate(state.when);
    const now=new Date(); now.setHours(0,0,0,0);
    let idx=Math.round((td-now)/86400000); if(idx<0)idx=0; if(idx>6)idx=6;
    const daily=j.daily||{};
    const w={
      precip:(daily.precipitation_probability_max||[])[idx],
      tmax:(daily.temperature_2m_max||[])[idx],
      code:(daily.weather_code||[])[idx],
      rainMode:null, transient:false
    };
    // hourly降水確率: 「おでかけ対象時間帯(出発〜最長18時)で40%以上が2時間以上」なら雨モード。
    // 40%以上が1時間だけ等のごく一時的な場合は雨モードにせず「にわか雨注意」フラグのみ。
    try{
      const hp=(j.hourly&&j.hourly.precipitation_probability)||[];
      const hc=(j.hourly&&j.hourly.weather_code)||[];
      const ht=(j.hourly&&j.hourly.time)||[];
      if((hp.length||hc.length)&&ht.length){
        let sMin; try{sMin=startMinutes();}catch(e){sMin=9*60+30;}
        const sH=Math.max(7,Math.min(16,Math.floor(sMin/60)));
        const eH=Math.min(18,sH+7);
        const y=td.getFullYear(),mo=('0'+(td.getMonth()+1)).slice(-2),da=('0'+td.getDate()).slice(-2);
        const dstr=y+'-'+mo+'-'+da;
        let rainH=0,maxP=null,cnt=0,codeSeen=0,rainCodeH=0;
        for(let k=0;k<ht.length;k++){
          if(ht[k].slice(0,10)!==dstr) continue;
          const hh=parseInt(ht[k].slice(11,13),10);
          if(hh<sH||hh>=eH) continue;
          const c=hc[k];
          if(c!=null){ codeSeen++; if(isRainCode(c)) rainCodeH++; }
          const v=hp[k];
          if(v==null) continue;
          cnt++;
          if(maxP==null||v>maxP) maxP=v;
          if(v>=40) rainH++;
        }
        if(codeSeen>=3){
          // 主判定: おでかけ時間帯に雨・雷雨・雪の weather code が含まれるか
          w.rainMode=(rainCodeH>=1);
          // 通常モードでも降水確率が高い時間があれば「にわか雨注意」だけ出す(表示用)
          if(!w.rainMode&&rainH>=1) w.transient=true;
          if(maxP!=null) w.windowMax=maxP;
        } else if(cnt>=3){
          // フォールバック: hourly の weather code が取れなかった場合のみ従来の降水確率判定
          if(rainH>=2){ w.rainMode=true; }
          else { w.rainMode=false; if(rainH===1) w.transient=true; }
          if(maxP!=null) w.windowMax=maxP;
        }
      }
    }catch(e){}
    return w;
  }catch(e){ return null; }
}

function isRainMode(w){
  if(!w) return false;
  if(w.rainMode===true) return true;
  if(w.rainMode===false) return false;
  // hourly が取れなかった場合は日別の weather code で判定する(旧: 降水確率>=50)
  return isRainCode(w.code);
}

/* [plan-fix 2026-09-23] tier の控えめな加点（S>A>B）。年齢・天候の適合（+1〜+3）を覆さない大きさ。
   「〜40分」には掛けない: 40分は近さを打ち消すシャッフルで 20〜40分圏の施設を自然に混ぜる設計で、
   ここに加点すると同点の B より S/A が必ず前に来て diversifyHead の帯（裁定192）が S/A に閉じ、
   3案のメインの顔ぶれが 9 県平均で約3割減った（REPORT.md の比較 F と M）。 */
const TIER_SCORE_S=0.5, TIER_SCORE_A=0.25;
/* [plan-fix 2026-09-23] おまかせで S が無いとき A を先頭にする範囲（メインの片道・分） */
const ANY_A_MAX_MIN=90;
/* [plan-fix 2026-09-23] 当日の休業判定が unknown（館内整理期間・不定休など）の施設は軽く減点（除外はしない） */
const UNKNOWN_DAY_PENALTY=1.0;
function scoreSpot(s,date,w,arrivalMin){
  let sc=0;
  // age
  const feats=(s.kid_features||[]).join(' ');
  const pt=s.play_types||[];
  if(state.ages.has('0-2')){
    if(pt.includes('indoor')) sc+=2;
    if(pt.includes('active')) sc+=1;
    if(/おむつ替え|授乳|ベビー/.test(feats)) sc+=2;
  }
  if(state.ages.has('3-5')){
    if(pt.includes('active')||pt.includes('animal')||pt.includes('water')) sc+=2;
    if(pt.includes('indoor')) sc+=1;
  }
  if(state.ages.has('elem')){
    if(pt.includes('create')||pt.includes('active')||pt.includes('vehicle')||pt.includes('museum_science')) sc+=2;
  }
  // heat preference (soft)
  if(w&&w.tmax!=null&&w.tmax>=34){
    if(pt.includes('water')) sc+=3;
    else if(pt.includes('indoor')||s.rain_friendly) sc+=2;
  }
  // free preference on free budget
  if(state.budget==='free'&&s.is_free) sc+=1;
  // 営業時間未登録は軽く減点(順位を下げるだけ。候補不足時は採用可)
  if(!s.business_hours&&!s.closed_days&&!pt.includes('food')) sc-=0.5;
  // 0-2歳のみ: 遠いメインをなだらかに減点(除外はしない。40分超から10分ごとに-1、最大-4)
  if(typeof toddlerOnlyNow==='function'&&toddlerOnlyNow()){
    const dm0=driveMinutesFrom(state.origin,s);
    if(dm0!=null&&dm0>40) sc-=Math.min(4,(dm0-40)/10);
    // 0-2歳のみ: 滝・渓谷・釣り・ハイキング等(TODDLER_CAUTION_RE)はメインの主役として弱いので順位を下げる。
    // 除外にしないのは、候補が少ない地域で「候補ゼロ」を増やさないため(強い運動系は既に buildPool で除外済み)。
    if(typeof isToddlerCaution==='function'&&isToddlerCaution(s)) sc-=3;
  }
  // night park / evening handling
  if(arrivalMin!=null){
    const t=((arrivalMin%1440)+1440)%1440;
    const outdoorPark=(s.indoor_or_outdoor==='outdoor')&&(pt.includes('active')||pt.includes('nature'));
    if(outdoorPark){
      if(t>=19*60) sc-=100; // pushed to bonus-only tier
      else if(t>=18*60+30) sc-=6;
    }
    // water play after 16:00: lower priority in favor of indoor/light/near-meal
    if(pt.includes('water')&&t>=16*60) sc-=4;
  }
  if(state.driveTime!=='40'){ if(s.tier==='S') sc+=TIER_SCORE_S; else if(s.tier==='A') sc+=TIER_SCORE_A; }   // [plan-fix 2026-09-23]
  if(date instanceof Date){ try{ if(judgeClosed(s,date).state==='unknown') sc-=UNKNOWN_DAY_PENALTY; }catch(e){} }
  /* [plan-fix2 2026-09-24] (2) 幼児だけ（0-2／3-5のみ）: 図書館・資料館などを下げる（雨 -4・晴れ -3）。雨なら屋内の遊び場・科学館・屋内プールなどを上げる */
  sc+=kidDullAdj(s,w);
  sc+=eng3AgeAdj(s);   // [engine-fix3 2026-09-25] (1) 0〜5歳だけ: 美術館・資料館・図書館など（新マップの分類と同じ規則）を軽く下げる
  return sc;
}
// 児童館・子育て支援センター系(is_jidokan===true)はプランナーの対象外。
// マップ上の🏠チップ専用スポットという設計であり、メイン/ランチ/余力のどの枠にも入れない。
// 「遠出の帰り道に児童センター系には寄らない」というユーザー方針のガードをここに一本化する。
function isJidokan(s){ return s&&s.is_jidokan===true; }
// 児童館(is_jidokan)とそれ以外を読み込み時に1回だけ分ける(SPOTS の直後相当。SPOTS リテラルの終端は県ごとに書式が違うため、isJidokan 定義直後に置く)
const SPOTS_NORMAL=SPOTS.filter(s=>!isJidokan(s)); const SPOTS_JIDOKAN=SPOTS.filter(s=>isJidokan(s));
// 児童館フォールバック(段階①): 雨モード × 20/40分 × 0-2/3-5歳 × 通常候補<3 のときだけ児童館を候補に足す。予算条件は入れない。
function allowJidokanNow(normalCount){
  if(!isRainMode(state.weather)) return false;
  if(!(state.driveTime==='20'||state.driveTime==='40')) return false;
  if(!(state.ages&&(state.ages.has('0-2')||state.ages.has('3-5')))) return false;

// 市町村名の正規化キー(同一市町村の児童館を優先するための比較用)
// 郡接頭は「蒲郡市」の郡を誤除去しないよう (?!市) で除外し、市町村の境界で打ち切る。plan.html / weekend/index.html で同一実装。
function cityKey(c){ c=String(c||'').normalize('NFKC').replace(/\s+/g,''); c=c.replace(/^[^郡市町村]+郡(?!市)/,''); var m=c.match(/^.+?[市町村]/); return m?m[0]:c; }
function budgetPass(s){
  if(state.budget==='any') return true;
  if(state.budget==='free') return s.is_free===true;
  const p=parsePrice(s);
  if(p==null) return true; // unknown: keep
  if(state.budget==='1000') return p<=1000;
  if(state.budget==='3000') return p<=3000;
  return true;
}
function shuffle(arr,seed){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const RECENT_MAINS_KEY=pkey('odemaru_recent_mains_v1');
function recentMains(){ try{ return JSON.parse(localStorage.getItem(RECENT_MAINS_KEY)||'[]'); }catch(e){ return []; } }
function rememberMains(names){
  try{
    let a=recentMains();
    names.forEach(nm=>{ a=a.filter(x=>x!==nm); a.unshift(nm); });
    localStorage.setItem(RECENT_MAINS_KEY,JSON.stringify(a.slice(0,15)));
  }catch(e){}
}
// 強い運動系施設: 0-2歳のみのグループでは自動選定から除外(カスタムの明示指定は対象外)
const ACTIVE_SPORT_RE=/VS ?PARK|トランポリン|Mr\.? ?JUMP|ミスタージャンプ|ボルダリング|クライミング|スポッチャ|スケートリンク|スケート場|パルクール/i;
function isActiveSportSpot(s){ return ACTIVE_SPORT_RE.test(String(s.name||'')+' '+String(s.kid_appeal||'')); }
function toddlerOnlyNow(){ return state.ages&&state.ages.has('0-2')&&state.ages.size===1; }
// 乳児だけでは楽しみにくい可能性のある施設(運動系+滝・ハイキング等の歩行量が多い場所)。断定せず注意のみ
const TODDLER_CAUTION_RE=/滝|ハイキング|登山|渓谷|トレッキング|遊歩道|釣り|釣って/;
function isToddlerCaution(s){ return isActiveSportSpot(s)||TODDLER_CAUTION_RE.test(String(s.name||'')+' '+String(s.kid_appeal||'')); }
function budgetCapYen(){ return state.budget==='free'?0:(state.budget==='1000'?1000:(state.budget==='3000'?3000:null)); }
// カスタムで選んだ施設のうち設定範囲を超えるもの [{name,dm}]
function cpOverRange(){
  const cap=capFor(state.driveTime);
  if(!isFinite(cap)) return [];
  const out=[];
  (state.customSlots||[]).filter(Boolean).forEach(function(s){
    if(s.__temp||s.latitude==null) return;
    const dm=driveMinutesFrom(state.origin,s);
    if(dm!=null&&dm>cap) out.push({name:s.name,dm:dm});
  });
  return out;
}
// 選んだ施設(非food)の入場料合計(1人あたり・読み取れる分のみ)
function cpSelectedCost(){
  let sum=0;
  (state.customSlots||[]).filter(Boolean).forEach(function(s){
    if(s.__temp||(s.play_types||[]).includes('food')) return;
    const p=parsePrice(s); if(p!=null) sum+=p;
  });
  return sum;
}

  return (APPEAL_FREQ[a]||0)>=4&&!APPEAL_ACT_RE.test(a);   // 4件以上で同じ文、かつ遊び方を何も言っていない
}

/* ---- (2) 雨の日×幼児（0-2／3-5 だけ。小学生を含まない） ----
   図書館・資料館・郷土館・文化財センター・美術館など（名前に子ども向けの語が無いもの）を下げ、屋内の遊び場・科学館・屋内プール等を上げる。
   晴れの日も幼児だけのときは、図書館・資料館などを主役にしにくくする（雨の日より弱め）。
   児童館は既存方針どおりプランナー対象外（この処理では足さない）。 */
const RAIN_DULL_RE=/図書館|図書室|資料館|郷土館|郷土博物館|郷土文化館|文化館|参考館|文化財|美術館|記念館|歴史館|民俗|民家園|文学館|史料館|埋蔵|古墳|史跡|城跡|城址|遺跡|遺構|宮跡|大極殿|陣屋|本陣|奉行所|武家屋敷|庭園|寺|神社/;
const RAIN_PLAY_NAME_RE=/キッズ|プレイ|あそび|遊び場|ひろば|広場|室内遊|屋内遊|ボーネルンド|キドキド|ファンタジー|科学館|サイエンス|プラネタリウム|屋内プール|温水プール|トランポリン|ふわふわ|おもちゃ|木育|こども館|子ども館|アスレチック|ランド/;
const RAIN_PLAY_AP_RE=/屋内の?遊び場|室内の?遊び場|キッズスペース|キッズコーナー|プレイルーム|ボールプール|ふわふわ|ネット遊具|遊具|すべり台|滑り台|トランポリン|プラネタリウム|体を動か/;
const RAIN_DULL_PENALTY=4, DRY_DULL_PENALTY=3, RAIN_PLAY_BONUS=1.5;
function smallKidOnly(){
  var a=state.ages;
  if(!a||!a.size||a.has('elem')) return false;
  var ok=true; a.forEach(function(x){ if(x!=='0-2'&&x!=='3-5') ok=false; });
  return ok;
}
function rainToddlerMode(w){ return smallKidOnly()&&isIndoorMode(w||state.weather); }
/* scoreSpot の加減点: 幼児だけのとき図書館・資料館などを下げる（雨 -4／晴れ -3）。雨なら屋内の遊び場を +1.5 */
function kidDullAdj(s,w){
  if(!smallKidOnly()) return 0;
  var rain=isIndoorMode(w||state.weather);
  if(isDullForToddler(s)) return -(rain?RAIN_DULL_PENALTY:DRY_DULL_PENALTY);
  if(rain&&isIndoorPlayForKids(s)) return RAIN_PLAY_BONUS;
  return 0;
}
function isDullForToddler(s){ var nm=String(s&&s.name||''); return RAIN_DULL_RE.test(nm)&&!KIDS_WORD_RE.test(nm)&&!/公園|広場|パーク|の森|の村/.test(nm); }   // 城址公園・遺跡公園などの公園は下げない
function isIndoorPlayForKids(s){
  if(!s||isDullForToddler(s)) return false;
  return RAIN_PLAY_NAME_RE.test(String(s.name||''))||RAIN_PLAY_AP_RE.test(String(s.kid_appeal||''));
}
/* 午後・余力枠の並び: 幼児だけなら図書館等を後ろへ（雨なら遊び場を前へ）。直前までに画面に主役として出した施設は常に後ろへ（同じ館のループを防ぐ） */
function subOrder2(list,w){
  var sk=smallKidOnly(), rt=rainToddlerMode(w), shown=state.__mainHist||[];   // 画面に出した主役だけ（案2・案3の未表示の主役は含めない）
  return list.map(function(s,i){
    var r=1;
    if(sk&&isDullForToddler(s)) r=2; else if(rt&&isIndoorPlayForKids(s)) r=0;
    if(shown.indexOf(s)>=0) r+=3;

  }).sort(function(a,b){ return a.r-b.r||a.i-b.i; }).map(function(x){ return x.s; });
}
/* ===== [engine-fix3 2026-09-25] 年齢に合わない候補・無料の指定・遅い出発のお昼・お昼なし・滞在の指定 =====
   どれも「並べ替え」と「滞在時間の決め方」だけで、3か所構成（メイン・お昼・午後）・帰宅上限（capHomeFor）・
   島／ランチは飲食店だけ／遠いのに短い／季節外れ／閉館後到着の判定（plan-fix2）はそのまま。SPOTS・CITIES は読むだけ。
   東京の新マップ（tokyo/erabu.html）はこのエンジンの宣言をそのまま取り込むので、ここは宣言（var・function）だけにしている。
   buildPlan(main,date,w,opts) の opts（4つ目の引数。従来の {lunch,sub} の指定と同じ場所）に次を足した:
     opts.lunch='none' … お昼の枠を作らない（午前 → 帰路。午後も組まない）
     opts.freeOnly=true … 午後の候補と「変える」の候補を無料の施設から先に出す（無いときは有料も出す）
     opts.stayMain=分 / opts.staySub=分 … 午前・午後の滞在（帰宅上限・閉館時刻の範囲に収める）
   {freeOnly,stayMain,staySub} だけを渡したときは、お昼・午後は従来どおり自動で選ぶ。lunch か sub のキーがあれば従来どおりその指定で組む。 */

/* ---- (1) 年齢に合わない候補: 東京の新マップのピン分類（mapnew/icons/work/classify.js の pinKind）と同じ規則 ---- */
function eng3PinKind(s){
  var pt = s.play_types || [], n = String(s.name || '');
  if (s.is_chain === true) return 'chain';
  if (pt.indexOf('food') >= 0) return 'food';
  if (s.is_jidokan === true) return 'jidokan';
  if (/森林科学園|山のふるさと村/.test(n)) return 'park';
  if (/おもちゃ美術館|あそびのせかい|あそびの森|HUGHUG|ちきゅうのにわ|PLAY! PARK|こどもひろば|0123|まんがぱーく|キッズ|プレイルーム/.test(n)) return 'indoor';
  if (/動物|水族|ZOO|牧場|ポニー|リス園|さる園|生物園|自然文化園/.test(n)) return 'animal';
  if (/科学|サイエンス|プラネタリウム|天文|宇宙|鉄道|れーる|電車|地下鉄|東武博物館|交通|消防|防災館|防災センター|そなエリア|ケーブルカー|警察|ポリス|郵政|通信|下水道|水道|水の|ガス|くすり|放送|寄生虫|南極|teamLab|工場|印刷|たばこと塩|紙の博物館|お札|貨幣|子ども未来館|ギャラクシティ|遊園|ランド|花やしき|都電|展望|タワー/.test(n)) return 'science';
  if (/美術館|資料館|資料室|図書|文学館|記念館|郷土|歴史|民俗|民家園|たてもの園|博物館|ミュージアム|MUSEUM|文化館|ふるさと館|ふるさと村|版画|彫刻|古墳|埋蔵文化財|本陣|展示|絵本|ことばらんど|はちはく|史料館|インターメディアテク|昭和館|復興記念|屋敷|住宅|水と緑のふれあい館/.test(n)) return 'book';
  if (/公園|広場|緑地|庭園|植物園|御苑|プレーパーク|鍾乳洞|釣場|菖蒲園|花木園|ビジターセンター/.test(n)) return 'park';
  if (pt.indexOf('animal') >= 0) return 'animal';
  if (pt.indexOf('vehicle') >= 0) return 'science';
  if (pt.indexOf('museum_science') >= 0) return 'book';
  if (pt.indexOf('active') >= 0 || pt.indexOf('water') >= 0 || pt.indexOf('nature') >= 0) return 'park';
  return 'indoor';
}
/* 全国で使うための除外（名前の語）: 子ども向けの語がある館（こども図書館・えほん館・こども美術館など）、公園（歴史公園・記念公園など）、
   説明に子どもの遊び場があると書いてある館、乗り物（play_types の vehicle）の館、生き物（animal）の展示がある館は下げない */
var ENG3_PARK_NAME_RE=/公園|広場|パーク|緑地|の森(?!美術館)/;   // 「〜の森美術館」は美術館として扱う
var ENG3_KIDPLAY_AP_RE=/キッズスペース|キッズコーナー|キッズルーム|プレイルーム|プレイコーナー|あそびコーナー|遊びコーナー|遊び場|あそび場|ボールプール|遊具|ふわふわ|おもちゃ/;
/* 2026-09-25 追記: 東京の新マップの乗り物・遊園地（classify.js の vehicle）と同じ語を足した。「ランド」だけでは決めない（室内の遊び場が多い）。遊園地は名前で1つずつ */
var ENG3_VEHICLE_NAME_RE=/航空|飛行機|自動車|鉄道|電車|機関車|のりもの|乗り物|バス|ロマンスカー|トヨタ博物館|汽車|(^|[^A-Za-z])SL([^A-Za-z]|$)|れーる|ミニトレイン|地下鉄|モノレール|ゴーカート|ケーブルカー|ロープウェイ|交通|消防|ポリス|警察|都電|東武博物館|(^|[^童東])遊園地|あらかわ遊園|みかさ遊園|花やしき|よみうりランド(?!.*プール)|サマーランド|レゴランド・ジャパン|シートレインランド|富士急ハイランド|スパーランド|東京ドームシティ|アミューズメントパーク/;
var ENG3_TODDLER_MUSEUM_RE=/博物館|ミュージアム|寄生虫|資料/;
var ENG3_UNFIT_MAIN_ADJ=2, ENG3_MILD_MAIN_ADJ=1;
/* 2 = 図書館・郷土資料館・歴史館・文学館・美術館・大学博物館・記念館・史料館など（0〜5歳だけのとき下げる）
   1 = 0〜2歳だけのときの博物館型の科学館（国立科学博物館・寄生虫館など。軽く下げる）  0 = 下げない */
function ageUnfitLevel(s){
  if(!s||s.__temp||s.__bento) return 0;
  var k=eng3PinKind(s), nm=String(s.name||''), ap=String(s.kid_appeal||'');
  var pt=s.play_types||[];
  if(KIDS_WORD_RE.test(nm)||ENG3_KIDPLAY_AP_RE.test(ap)) return 0;
  if(pt.indexOf('vehicle')>=0||ENG3_VEHICLE_NAME_RE.test(nm)) return 0;   // 電車・乗り物のミュージアム（ロマンスカーミュージアム・京急ミュージアム・東武博物館など）は幼児向き
  if(k==='book') return (ENG3_PARK_NAME_RE.test(nm)||pt.indexOf('animal')>=0)?0:2;   // 生き物の展示（ニフレルなど）も下げない
  if(k==='science'&&toddlerOnlyNow()&&ENG3_TODDLER_MUSEUM_RE.test(nm)) return 1;
  return 0;
}
/* scoreSpot の加減点（主役）: 0〜5歳だけのとき。plan-fix2 の kidDullAdj が既に下げている館（図書館・資料館など）には重ねない */
function eng3AgeAdj(s){
  if(!smallKidOnly()) return 0;
  var u=ageUnfitLevel(s);
  if(u===2) return isDullForToddler(s)?0:-ENG3_UNFIT_MAIN_ADJ;
  if(u===1) return -ENG3_MILD_MAIN_ADJ;
  return 0;
}

/* ---- (2) 無料の指定 ---- */
var ENG3_FREE=false;   // buildPlan の opts.freeOnly の間だけ true
function eng3IsFree(s){ if(!s) return false; if(s.is_free===true) return true; try{ return parsePrice(s)===0; }catch(e){ return false; } }
function eng3FreePref(){ return ENG3_FREE===true||state.budget==='free'; }
/* 並べ替えの順位（小さいほど先）: 無料の指定で有料 +4、0〜5歳だけで年齢に合わない +2（軽い方 +1） */
function eng3Rank(s){
  var r=0;
  if(eng3FreePref()&&!eng3IsFree(s)) r+=4;
  if(smallKidOnly()){ var u=ageUnfitLevel(s); if(u===2) r+=2; else if(u===1) r+=1; }
  return r;
}
function eng3Order(list){
  if(!list||list.length<2) return list||[];
  return list.map(function(s,i){ return {s:s,i:i,r:eng3Rank(s)}; })
    .sort(function(a,b){ return a.r-b.r||a.i-b.i; }).map(function(x){ return x.s; });
}
/* 午後の自動選択用: 無料・年齢の条件に合う候補が1件でもあれば、それだけから選ぶ（無いときは全体から＝除外ではなく順位を下げるだけ） */
function eng3Prefer(list){
  var o=eng3Order(list);
  if(!o.length) return o;
  var hard=function(s){ return Math.floor(eng3Rank(s)/2); };   // 軽い方（+1）は絞り込みに使わない
  var h0=hard(o[0]), f=o.filter(function(s){ return hard(s)===h0; });
  return f.length?f:o;
}
/* 「変える」の候補（午前・午後・自分で選ぶの非お昼の枠）: 近い順に並べた後で、無料・年齢に合う候補を前へ */
function eng3SwapOrder(list,slot){
  if(slot==='lunch') return list;
  try{ if(csIndex(slot)!=null&&csIsLunchSlot(slot)) return list; }catch(e){}
  var f0=ENG3_FREE;

  finally{ ENG3_FREE=f0; }
}

/* ---- (3) 遅い出発: お昼を 12:30 までに始める（午前の滞在を短くする。最短 45 分）。
   0〜2歳がいるときは午後を 16:00 帰宅めどに短くし、60分とれなければ午後なし（帰宅上限 capHomeFor はそのまま守る） ---- */
var ENG3_LATE_START=10*60, ENG3_LUNCH_BY=12*60+30, ENG3_MAIN_MIN_LATE=45, ENG3_LUNCH_LEG_EST=10, ENG3_TODDLER_LATE_HOME=16*60;
function eng3IsLate(st){ try{ return (st==null?startMinutes():st)>=ENG3_LATE_START; }catch(e){ return false; } }

  if(arr==null||stay==null||!eng3IsLate()) return stay;
  if(arr>=ENG3_LUNCH_BY) return stay;   // お昼どきを過ぎて着く（正午スロットなど）は従来どおり
  var c=Math.floor((ENG3_LUNCH_BY-(leg==null?ENG3_LUNCH_LEG_EST:leg)-arr)/5)*5;

}
function eng3SoftHome(bdm,st){
  if(!(state.ages&&state.ages.has&&state.ages.has('0-2'))||!eng3IsLate(st)) return Infinity;

}

/* ---- (4) お昼なし: 家でお昼を食べる。午前の遊び場から 13:00 ごろ帰着（最短 45 分は遊ぶ） ---- */
var ENG3_HOME_LUNCH=13*60;
function eng3HomeLunchCap(stay,t,homeDm){
  if(t==null||t>=ENG3_LUNCH_BY) return stay;
  var c=Math.floor((ENG3_HOME_LUNCH-(homeDm||0)-t)/15)*15;
  return Math.min(stay,Math.max(ENG3_MAIN_MIN_LATE,c));
}

/* ---- (5) 滞在: 自分の場所（マイプレイス・自分で追加した場所）と tier S の大きな公園は長め ---- */
var ENG3_MYPLACE_STAY=240, ENG3_BIGPARK_STAY=180;
var ENG3_BIGPARK_NAME_RE=/公園|パーク|緑地|の森|森林|丘陵|自然園/;
function eng3IsMyPlace(s){ return !!(s&&s.__temp===true&&!s.__bento); }
function eng3IsBigPark(s){ return !!(s&&s.tier==='S'&&!isShortStaySpot(s)&&ENG3_BIGPARK_NAME_RE.test(String(s.name||''))); }
function eng3StayNum(v){ var n=Number(v); if(!isFinite(n)||n<=0) return null; return Math.max(30,Math.min(600,Math.round(n/5)*5)); }

/* ---- buildPlan の opts の読み取り ---- */
var ENG3_OPT_KEYS=['freeOnly','stayMain','staySub'];
function eng3Opts(o){

  r.stayMain=eng3StayNum(o.stayMain);

/* 画面の差し替え（変えるパネル）でも、同じプランの指定（無料・お昼なし・滞在）を引き継ぐ */

/* おまかせの「変える」パネル（お昼）の1行: お昼なし（家で食べる） */
function eng3LunchNone(){

/* 共有URL: お昼なし nl=1・無料 fo=1・滞在 sm=分 / ss=分（無いURL＝従来の形式は従来どおりに開く） */
function eng3SharePush(p,parts){

function eng3ShareOpts(qs){

function eng3RestoreOpts(r){
  var o={lunch:r.lunchSpot,sub:r.subSpot}, e=(r&&r.e3)||{};
  for(var k in e) o[k]=e[k];
  return o;
}
function poolFrom(list,date,w){
  if(date instanceof Date) setPlanDate(date);
  const o=state.origin;
  const rain=isIndoorMode(w);
  const start=startMinutes();
  let cand=list.filter(s=>{
    if(s.latitude==null) return false;
    if(isClosedNotice(s)) return false; // 閉店・休業告知のある店は全開放でも候補にしない
    if(isJidokan(s)&&list!==SPOTS_JIDOKAN) return false; // 児童館・子育て支援センター系はプランナー対象外（🏠チップ専用）。SPOTS_JIDOKAN を渡したときだけ通す

    if(pt.length===1&&pt[0]==='food') return false; // pure food -> lunch only
    if(toddlerOnlyNow()&&isActiveSportSpot(s)) return false; // 0-2歳のみ: 強い運動系はメイン候補から除外
    const dm=driveMinutesFrom(o,s);
    if(dm==null||dm>CURRENT_CAP) return false;
    if(!islandOk(s)) return false;                 // [plan-fix2 2026-09-24] (1a) 出発地と陸続きでない島の施設
    if(farShortMain(s,dm,start)) return false;     // [plan-fix2 2026-09-24] (1c) 片道90分超なのに滞在が片道の1.5倍とれない

function todayStartFeasible(){

  // (カスタムプランの「きょう」は depart 未設定のまま来るため、旧実装は素通りしていた)

function generatePlans(date,w){
  resetReserve();
  state.tooLateToday=false;
  if(!todayStartFeasible()){ state.tooLateToday=true; return []; }
  let cap=capFor(state.driveTime);
  CURRENT_CAP=cap;
  let pool=buildPool(date,w);
  state.expandedDrive=false;
  state.ringRelaxed=false;
  // 距離帯(41〜60分等)に候補が無い場合のみ、近場も含めて再収集(上限は超えない)
  if(!pool.length&&(state.driveTime==='40'||state.driveTime==='60')){
    window.RING_RELAX=true;
    pool=buildPool(date,w);
    window.RING_RELAX=false;
    if(pool.length) state.ringRelaxed=true;
  }
  // 移動時間は「上限」。候補が少なくても勝手に範囲を広げない(広げるのはユーザーが明示的に承認した場合のみ)。
  pool=appendJidokan(pool,date,w);
  if(!pool.length) return [];
  const tiered=diversifyHead(applyDriveMoodTier(pool));
  // variety: distinct mains for up to 3 variants
  const mains=[];
  for(const s of tiered){ if(!mains.includes(s)) mains.push(s); if(mains.length>=3) break; }
  state.shownMains=mains.slice();
  state.__mainHist=[];   // [plan-fix2 2026-09-24] 新しく作り直すときは画面に出した主役の履歴を空にする
  const onlyT=state.ages.has('0-2')&&state.ages.size===1;
  const kidCap=capHomeFor(state.ages);   // [裁定172] 4か所の重複定義を1本に統一
  const built=mains.map(m=>{
    let pl=buildPlan(m,date,w);
    // 総移動時間の上限: 3時間超(乳児のみは130分超)のプランは午後スポットを外して移動負担を抑える
    const driveLimit=onlyT?130:190;
    if(pl.totalDrive>driveLimit&&pl.sub){
      const pl2=buildPlan(m,date,w,{lunch:pl.lunch||null,sub:null});
      if(pl2.totalDrive<pl.totalDrive) pl=pl2;
    }
    /* [裁定173] 帰宅上限を超えた案の修復を段階化する。
       旧実装は「午後スポットを外す」1段だけで、しかも条件に && pl.sub があったため
       夕方（sub が最初から null）では 1 度も走らず、__late を立てるだけだった。
         ① 午後スポットを外す → ② 食事枠を外す → ③ より近いメイン（buildPool 側で除外済み）
         → ④ それでもダメなら __late（下の out で 0 件に落とす） */
    if(kidCap&&pl.retHome&&pl.retHome>kidCap){
      let fixed=null;
      if(pl.sub){
        const p1=buildPlan(m,date,w,{lunch:pl.lunch||null,sub:null});
        if(p1.retHome&&p1.retHome<=kidCap) fixed=p1;
      }
      if(!fixed&&pl.lunch){
        const p2=buildPlan(m,date,w,{lunch:null,sub:null});
        if(p2.retHome&&p2.retHome<=kidCap) fixed=p2;
      }
      if(fixed) pl=fixed;
    }
    if(kidCap&&pl.retHome&&pl.retHome>kidCap) pl.__late=true;

     どの案も帰宅上限を超える場合は、遅い案を出さずに 0 件にして「あす」へ誘導する。
     （overBurden だけの超過は従来どおり警告つきで出す。0 件にするのは帰宅上限違反のときだけ） */
  const within=built.filter(p=>!p.__late&&!overBurden(p)&&!farShortPlan(p));   // [plan-fix2 2026-09-24] (1c)

  return out;
}
// Regeneration for "別のプランにする": widen the main-spot pool to the top 10〜15 (quality floor
// kept by ranking, not a fixed score cutoff) and shuffle-pick one that hasn't been shown yet this
// session. When every reasonable candidate has already been shown, reset the history (but avoid
// immediately repeating the very last one) and note that we've gone through a full cycle.
function nextVarietyPlan(date,w){
  if(!todayStartFeasible()){ state.tooLateToday=true; return null; }
  const cap=capFor(state.driveTime);
  CURRENT_CAP=cap;
  let pool=buildPool(date,w);
  // C) 移動時間は「上限」。候補が少なくても勝手に範囲を広げない(初回生成 generatePlans と同じ方針)。
  //    旧実装は pool<3 のとき 20→40→60→無制限 と自動拡張していた。
  state.expandedDrive=false;
  state.ringRelaxed=false;
  // 距離帯(41〜60分等)に候補が無い場合のみ、初回と同じく近場も含めて再収集(上限は超えない)
  if(!pool.length&&(state.driveTime==='40'||state.driveTime==='60')){
    window.RING_RELAX=true;
    pool=buildPool(date,w);
    window.RING_RELAX=false;
    if(pool.length) state.ringRelaxed=true;
  }
  pool=appendJidokan(pool,date,w);
  if(!pool.length) return null;
  const tiered=applyDriveMoodTier(pool);
  const uniq=[];
  for(const s of tiered){ if(!uniq.includes(s)) uniq.push(s); }
  if(!uniq.length) return null;
  // top 10〜15 by score (already sorted desc within tiering) as the shuffle pool
  const topN=uniq.slice(0, Math.min(40, uniq.length));
  let candidates=topN.length>=3 ? topN : uniq;
  if(!state.excludedSpots) state.excludedSpots=[];
  if(!state.lastPlanSpots) state.lastPlanSpots=[];
  let fresh=candidates.filter(s=>!state.shownMains.includes(s)&&!state.excludedSpots.includes(s)&&!state.lastPlanSpots.includes(s));
  if(!fresh.length) fresh=candidates.filter(s=>!state.shownMains.includes(s)&&!state.excludedSpots.includes(s));
  let cycled=false;
  if(!fresh.length){
    const last=state.shownMains[state.shownMains.length-1];
    state.shownMains=[];
    fresh=candidates.filter(s=>s!==last);
    if(!fresh.length) fresh=candidates;
    cycled=true;
    /* [plan-fix2 2026-09-24] 一巡したら、画面に出した直前2回の主役を避けて候補全体から取り直す（last は画面に出ていない案2・案3のことがある） */
    const __rc=(state.__mainHist||[]).slice(-2), __p2=candidates.filter(s=>__rc.indexOf(s)<0);
    if(__p2.length) fresh=__p2;
  }
  /* [plan-fix2 2026-09-24] おまかせ（遠くてもOK）は「別のプラン」でも目玉（S/A）から選ぶ（初回の applyDriveMoodTier と同じ考え方） */
  if(state.driveTime==='any'&&HAS_TIER){ const __sa=fresh.filter(s=>s.tier==='S'||s.tier==='A'); if(__sa.length) fresh=__sa; }
  /* [plan-fix2 2026-09-24] 画面に主役として出した回数が最も少ない施設から選ぶ（まだ見せていない施設を先に。同じ館のループを防ぐ） */
  { const __H=state.__mainHist||[], __cnt=s=>__H.filter(x=>x===s).length, __mc=Math.min.apply(null,fresh.map(__cnt)); fresh=fresh.filter(s=>__cnt(s)===__mc); }
  /* [plan-fix2 2026-09-24] (2) 幼児だけ（雨の日を含む）: 図書館・資料館などは、ほかに候補があれば選ばない */
  if(smallKidOnly()){ const __nd=fresh.filter(s=>!isDullForToddler(s)&&ageUnfitLevel(s)!==2); if(__nd.length) fresh=__nd; }   // [engine-fix3 2026-09-25] (1)
  state.cycledNote=cycled;
  // B) 初回生成(generatePlans)と同じ年齢・負担軽減ガードを適用する。
  //    旧実装は総運転190分の一律判定のみで、0-2歳のみの130分上限と帰宅時刻上限が抜けていた。
  // D) 負担超過(運転合計300分超 / 帰着19:00以降)の案は採らず、次の候補を試す。
  //    どの候補も超える場合のみ、最初の案を警告つきで出す(generatePlans と同じ方針)。
  const onlyT=state.ages.has('0-2')&&state.ages.size===1;
  const kidCap=capHomeFor(state.ages);   // [裁定172] 重複定義を1本に統一
  const driveLimit=onlyT?130:190;
  const order=shuffle(fresh);
  const tries=Math.min(order.length,12);
  let firstPicked=null,firstPlan=null,okPicked=null,okPlan=null;
  for(let ti=0;ti<tries;ti++){
    const cand=order[ti];
    let plv=buildPlan(cand,date,w);
    if(plv.totalDrive>driveLimit&&plv.sub){
      const plv2=buildPlan(cand,date,w,{lunch:plv.lunch||null,sub:null});
      if(plv2.totalDrive<plv.totalDrive) plv=plv2;
    }
    /* [裁定173] generatePlans と同じ段階フォールバックを「別のプランにする」にも適用する */
    if(kidCap&&plv.retHome&&plv.retHome>kidCap){
      let plvFix=null;
      if(plv.sub){
        const plv3=buildPlan(cand,date,w,{lunch:plv.lunch||null,sub:null});
        if(plv3.retHome&&plv3.retHome<=kidCap) plvFix=plv3;
      }
      if(!plvFix&&plv.lunch){
        const plv4=buildPlan(cand,date,w,{lunch:null,sub:null});
        if(plv4.retHome&&plv4.retHome<=kidCap) plvFix=plv4;
      }
      if(plvFix) plv=plvFix;
    }
    if(kidCap&&plv.retHome&&plv.retHome>kidCap) plv.__late=true;
    if(firstPicked===null){ firstPicked=cand; firstPlan=plv; }
    if(!plv.__late&&!overBurden(plv)&&!farShortPlan(plv)){ okPicked=cand; okPlan=plv; break; }   // [plan-fix2 2026-09-24] (1c)
  }
  const finalPicked=(okPicked!==null?okPicked:firstPicked);
  const finalPlan=(okPlan!==null?okPlan:firstPlan);
  if(!finalPlan) return null;
  state.shownMains.push(finalPicked);
  (state.__mainHist=state.__mainHist||[]).push(finalPicked);   // [plan-fix2 2026-09-24]
  return finalPlan;
}

let GEN_SEQ=0, __genTimer=null;

    const L=document.getElementById('loading');
    // loadingが既に閉じている(=候補なし等で正常に抜けた)場合は何もしない

      GEN_SEQ++;  // 以後、この生成が遅れて完了しても結果は無効(画面を上書きしない)
      showGenError('⏳ 生成に時間がかかっています');
    }

}
function genOk(id){
  if(GEN_SEQ!==id) return false;   // タイムアウト済み・別の生成が始まった → この結果は捨てる

  } else if(state.driveTime==='40'){

  } else {

  const o=state.origin;

  const agesTxt=[...state.ages].map(a=>ageMap[a]).filter(Boolean).join('・');
  const budMap={'free':'無料スポット中心','1000':'予算1人1,000円以内目安','3000':'予算1人3,000円以内目安'};
  const condParts=[];
  const baseMentionsDrive=/車\d+分圏内/.test(base);
  if(o&&o.name&&['20','40','60'].includes(state.driveTime)&&!baseMentionsDrive){
    if(state.isCustomView){
      // カスタムは選択地点が範囲を超え得るので断定しない
      condParts.push('自動提案は'+o.name+'から車'+state.driveTime+'分圏内'+(cpOverRange().length?'（えらんだ場所は除く）':''));
    } else {
      condParts.push(o.name+'から車'+state.driveTime+'分圏内');
    }
  }
  else if(o&&o.name&&base.indexOf(o.name)===-1) condParts.push(o.name+'発');
  if(agesTxt) condParts.push(agesTxt+'のお子さん向け');
  if(budMap[state.budget]){

      condParts.push('空き枠は'+budMap[state.budget]+'を優先（えらんだ場所は予算を超える場合があります）');
    } else {
      condParts.push(budMap[state.budget]);
    }

  if(condParts.length) base+=(base?' ':'')+condParts.join('・')+'で組み立てています。';
  if(state.nearFallback){

  }
  if(state.cycledNote){
    base+=' （候補を一巡したので、また最初の方の候補から出しています）';
  }
  return base.trim();

function buildRouteUrl(p){
  const o=state.origin;
  if(!o||o.lat==null||o.lng==null) return null;
  const spots=p.rows.filter(r=>r.type==='spot'&&!r.opt).map(r=>r.spot).filter(Boolean);  // 余力枠は本編ルートに含めない(採用時はGoogleマップ側で編集)
  if(!spots.length) return null;

  // 地点は「名称+市」で渡す→Googleマップ側で施設名として表示される(座標だと「指定した地点」になる)
  // 入力した場所(__temp)はGoogleに載っていない可能性が高いので座標のまま
  const q=s=>s.__temp?(s.latitude+','+s.longitude):((s.name||'')+' '+(s.city||'')).trim();
  const oq=(o.name&&o.name!=='現在地')?o.name:(o.lat+','+o.lng);
  let url='https://www.google.com/maps/dir/?api=1'+
    '&origin='+encodeURIComponent(oq)+
    '&destination='+encodeURIComponent(q(dest))+
    '&travelmode=driving';
  if(waypoints.length){
    url+='&waypoints='+encodeURIComponent(waypoints.map(q).join('|'));
  }
  return url;
}
